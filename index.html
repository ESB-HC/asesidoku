    </div>` : ''}
    <div class="sudhead ui">
      <span class="casebadge">${T('sudN', {n: String(x.id).padStart(4,'0')})}</span>
      <span class="tierbadge">${esc(tierName(x.tier))}</span>
      <span class="diff mono">${dots(x.d)}</span>
      ${v.d ? `<span class="tierbadge">${T('sudDaily')}</span>` : ''}
    </div>
    <div class="sgrid" id="sgrid" role="grid" aria-label="Sudoku"></div>
    <div class="snums" id="snums"></div>
    <div class="stools">
      <button class="btn" id="sb-notes" aria-pressed="false">✎ ${T('sudNotes')}</button>
      <button class="btn" id="sb-erase">⌫ ${T('sudErase')}</button>
      <button class="btn" id="sb-undo">↶ ${T('sudUndo')}</button>
      <button class="btn ghost" id="sb-clear">${T('sudClear')}</button>
    </div>
  </section>`;

  /* volver lleva a la pestaña de donde se vino: carrera, diario o expediente */
  const back = {name:'sud', tab: v.r ? 'contrarreloj' : v.d ? 'diario' : 'expediente'};
  document.getElementById('sb-back').onclick = () => go(back);
  const abortBtn = document.getElementById('sr-abort');
  if (abortBtn) abortBtn.onclick = async () => {
    if (!await uiConfirm(T('raceQuitAsk'))) return;
    raceAbort(); go({name:'sud', tab:'contrarreloj'});
  };
  document.getElementById('sb-notes').onclick = () => { notesOn = !notesOn;
    const b = document.getElementById('sb-notes');
    b.setAttribute('aria-pressed', notesOn); b.classList.toggle('primary', notesOn); };
  document.getElementById('sb-erase').onclick = () => { if (sel !== null) setCell(x, sel, 0); };
  document.getElementById('sb-undo').onclick = () => undo(x);
  document.getElementById('sb-clear').onclick = async () => {
    if (!await uiConfirm(T('sudClearSure'))) return;
    push(x); const s2 = st(x.id); s2.e = {}; s2.n = {}; s2.fails = 0; save();
    drawSud(x); Audio_.lift();
  };

  clearInterval(timerS);
  timerS = setInterval(() => {
    const el = document.getElementById('stimer');
    if (!el){ clearInterval(timerS); return; }
    if (!st(x.id).solved) el.textContent = fmt(st(x.id).ms + (Date.now() - tick0));
    const rl = document.getElementById('srclock');
    if (rl) rl.textContent = fmt(raceElapsedS());
  }, 1000);

  drawSud(x);
}

function gridVal(x, k){
  if (x.p[k] !== '0') return +x.p[k];
  const e = st(x.id).e[k];
  return e || 0;
}

function drawSud(x){
  const s = st(x.id);
  const g = document.getElementById('sgrid');
  if (!g) return;
  /* choques: el mismo número repetido en fila, columna o caja */
  const clash = new Set();
  const seen = {};
  const mark = (unit, k, d) => { const key = unit + d;
    if (seen[key] !== undefined){ clash.add(seen[key]); clash.add(k); } else seen[key] = k; };
  for (let k = 0; k < 81; k++){
    const d = gridVal(x, k);
    if (!d) continue;
    mark('r' + Math.floor(k/9), k, d);
    mark('c' + (k%9), k, d);
    mark('b' + (Math.floor(k/27)*3 + Math.floor((k%9)/3)), k, d);
  }
  const selD = sel !== null ? gridVal(x, sel) : 0;
  let html = '';
  for (let k = 0; k < 81; k++){
    const given = x.p[k] !== '0';
    const d = gridVal(x, k);
    const cls = ['scell'];
    if (given) cls.push('given');
    if (k === sel) cls.push('sel');
    else if (sel !== null && (Math.floor(k/9) === Math.floor(sel/9) || k%9 === sel%9 ||
      (Math.floor(k/27) === Math.floor(sel/27) && Math.floor((k%9)/3) === Math.floor((sel%9)/3))))
      cls.push('peer');
    if (selD && d === selD && k !== sel) cls.push('same');
    if (clash.has(k)) cls.push('clash');
    if (k % 9 === 2 || k % 9 === 5) cls.push('bR');
    if (Math.floor(k/9) === 2 || Math.floor(k/9) === 5) cls.push('bB');
    let inner = '';
    if (d) inner = `<b>${d}</b>`;
    else {
      const nn = s.n[k];
      if (nn && nn.length) inner = `<span class="pnotes">${[1,2,3,4,5,6,7,8,9].map(i =>
        `<i>${nn.indexOf(i) >= 0 ? i : ''}</i>`).join('')}</span>`;
    }
    html += `<button class="${cls.join(' ')}" data-k="${k}" role="gridcell"
      aria-label="${'RCDEFGHIJ'[Math.floor(k/9)] ? '' : ''}${'ABCDEFGHI'[k%9]}${Math.floor(k/9)+1}${d ? ', ' + d : ''}">${inner}</button>`;
  }
  g.innerHTML = html;
  g.querySelectorAll('.scell').forEach(b => b.onclick = () => { sel = +b.dataset.k; drawSud(x); });

  /* teclado de números con recuento de los que faltan */
  const left = {};
  for (let d = 1; d <= 9; d++) left[d] = 9;
  for (let k = 0; k < 81; k++){ const d = gridVal(x, k); if (d) left[d]--; }
  document.getElementById('snums').innerHTML = [1,2,3,4,5,6,7,8,9].map(d =>
    `<button class="snum${left[d] <= 0 ? ' out' : ''}" data-d="${d}">
       <b>${d}</b><i>${Math.max(0, left[d])}</i></button>`).join('');
  document.querySelectorAll('.snum').forEach(b => b.onclick = () => {
    if (sel !== null) setCell(x, sel, +b.dataset.d);
  });
}

function push(x){
  const s = st(x.id);
  UNDO.push(JSON.stringify({e: s.e, n: s.n}));
  if (UNDO.length > 120) UNDO.shift();
}
function undo(x){
  if (!UNDO.length) return;
  const o = JSON.parse(UNDO.pop());
  const s = st(x.id); s.e = o.e; s.n = o.n; save();
  Audio_.lift(); drawSud(x);
}

function setCell(x, k, d){
  const s = st(x.id);
  if (s.solved || x.p[k] !== '0') return;
  push(x);
  if (d === 0){ delete s.e[k]; delete s.n[k]; save(); Audio_.lift(); buzz(8); drawSud(x); return; }
  if (notesOn && !s.e[k]){
    const arr = s.n[k] = s.n[k] || [];
    const i = arr.indexOf(d);
    if (i >= 0) arr.splice(i, 1); else arr.push(d);
    if (!arr.length) delete s.n[k];
    save(); Audio_.mark(); drawSud(x); return;
  }
  s.e[k] = d; delete s.n[k];
  /* al escribir una cifra, se barre esa nota de fila, columna y caja */
  for (let j = 0; j < 81; j++){
    if (!s.n[j]) continue;
    if (Math.floor(j/9) === Math.floor(k/9) || j%9 === k%9 ||
        (Math.floor(j/27) === Math.floor(k/27) && Math.floor((j%9)/3) === Math.floor((k%9)/3))){
      const i = s.n[j].indexOf(d);
      if (i >= 0){ s.n[j].splice(i, 1); if (!s.n[j].length) delete s.n[j]; }
    }
  }
  save(); Audio_.place(); buzz(12); drawSud(x);
  maybeWin(x);
}

function maybeWin(x){
  const s = st(x.id);
  for (let k = 0; k < 81; k++) if (!gridVal(x, k)) return;
  let ok = true;
  for (let k = 0; k < 81; k++) if (String(gridVal(x, k)) !== x.s[k]){ ok = false; break; }
  if (!ok){
    s.fails++; save();
    flashTop(T('sudWrong')); Audio_.bad(); buzz([25,50,25]);
    return;
  }
  s.solved = true;
  s.ms += Date.now() - tick0; tick0 = Date.now();
  const iso = todayISO();
  if (sudDayId(iso) === x.id) SS().days[iso] = x.id;
  save();
  Audio_.win(); buzz([15,40,15,40,60]);
  clearInterval(timerS);
  if (raceWon(x)){ drawSud(x); return; }
  const next = LIST.find(y => y.id > x.id && canPlaySud(y) && !(SS().cases[y.id] && SS().cases[y.id].solved))
            || LIST.find(y => canPlaySud(y) && !(SS().cases[y.id] && SS().cases[y.id].solved));
  openSheet(T('sudWin'), `
    <p class="big">${T('sudWinBody', {t: fmt(s.ms)})}</p>
    <p class="muted">${s.fails ? T('sudWinFails', {n: s.fails}) : T('sudWinClean')}</p>
    <div class="row">
      ${next ? `<button class="btn primary" id="sb-next">${T('sudNext')}</button>` : ''}
      <button class="btn" id="sb-list">${T('sudBack')}</button>
    </div>`);
  const bn = document.getElementById('sb-next');
  if (bn) bn.onclick = () => { closeSheet(); go({name:'sudcase', id: next.id}); };
  document.getElementById('sb-list').onclick = () => { closeSheet(); go({name:'sud', tab:'expediente'}); };
  if (adDue('sud')) setTimeout(() => showAd(null, false, 'adWhySud'), 1200);
  if (typeof checkAchv === 'function') setTimeout(checkAchv, 1700);
  drawSud(x);
}

/* teclado físico, en web y en iPad */
document.addEventListener('keydown', ev => {
  if (!view || view.name !== 'sudcase' || sel === null) return;
  const x = BY[view.id];
  if (!x) return;
  if (ev.key >= '1' && ev.key <= '9'){ setCell(x, sel, +ev.key); ev.preventDefault(); }
  else if (ev.key === 'Backspace' || ev.key === 'Delete'){ setCell(x, sel, 0); ev.preventDefault(); }
  else if (ev.key === 'n' || ev.key === 'N'){ const b = document.getElementById('sb-notes'); if (b) b.click(); }
  else {
    const mv = {ArrowUp:-9, ArrowDown:9, ArrowLeft:-1, ArrowRight:1}[ev.key];
    if (mv !== undefined){
      const nk = sel + mv;
      if (nk >= 0 && nk < 81){ sel = nk; drawSud(x); ev.preventDefault(); }
    }
  }
});

root.AsesiSudoku = {
  render(v){ ready(() => { if (v.name === 'sudcase') renderSudCase(v); else renderSud(v); }); },
  /* llamado por render() de app.js con la vista nueva (o null = pausa segura):
     pausa la carrera de sudokus salvo que la vista sea su propio tablero */
  pauseRace(v){
    const rc = raceState();
    if (!rc || !rc.running) return;
    if (v && v.name === 'sudcase' && v.r && rc.ids[rc.i] === v.id) return;
    racePauseS();
  },
  resumeRace(v){
    const rc = raceState();
    if (rc && rc.running && v && v.r && rc.ids[rc.i] === v.id) raceResumeS();
  },
  loaded: () => !!LIST,
  dayId: () => LIST ? sudDayId(todayISO()) : null,
  canPlay: id => LIST ? canPlaySud(BY[id]) : false,
  solvedCount: sudSolved,
  /* duelo y liga, a la vista para las pruebas (y para el servidor, mañana) */
  duel: {draw: sduelDraw, parse: sduelParse, code: sduelCode,
         partParse: sduelPartParse, list: sduels, by: sduelBy},
  liga: {create: sgroupCreate, join: sgroupJoin, by: sgroupBy, list: sgroups,
         partOf: spartOf, parse: spartParse},
};
})(typeof window !== 'undefined' ? window : globalThis);

</script>
