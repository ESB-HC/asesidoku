/* ────────────────────────────────────────────────────── índice ────────── */
/* Mil tarjetas de golpe no son un índice, son un scroll de tres minutos y un
   navegador sudando. Cada nivel abre con una tanda y se amplía a demanda, y el
   botón de continuar salta al primero sin cerrar del nivel donde te quedaste. */
const PAGE = 48, PAGE_MAS = 96;
let shown = {};
let tierSel = null;      /* la pestaña de nivel elegida en el expediente */

/* La tarjeta compacta: número, dificultad y estado, en rejilla densa. El
   título viaja oculto (lo leen el lector de pantalla y las pruebas); en un
   catálogo de dos mil, el título se descubre al abrir, como en un archivo
   de verdad. El candado se sigue enseñando: se vende, no se esconde. */
function caseCard(c){
  const s = store.cases[c.id];
  const done = s && s.solved, started = s && !s.solved && (Object.keys(s.p).length || s.used.length);
  const lock = !canPlay(c);
  const lc = loc(c);
  return `<button class="case-card cc${done?" done":""}${c.almost?" peak":""}${lock?" locked":""}"
    data-id="${c.id}" aria-label="${esc(lc.title)}${lock ? ` · ${T("caseLocked")}` : ""}">
    <span class="ccnum mono">${String(c.id).padStart(4,"0")}</span>
    <span class="ccdots mono" aria-hidden="true">${diffDots(diffOf(c))}</span>
    ${done ? `<span class="cctick" aria-hidden="true">✓</span>`
           : lock ? `<span class="padlock ui" aria-hidden="true">${T("proBadge")}</span>`
           : started ? '<span class="started"></span>' : ""}
    <span class="name vh">${esc(lc.title)}</span>
  </button>`;
}

function renderIndex(){
  document.getElementById("subtitle").textContent = T("subtitle_file");
  const n = solvedCount(), t = CASES.length;
  /* «continuar» lleva al primer caso abierto QUE SE PUEDA JUGAR: mandar a
     quien no ha pagado contra un candado no es continuar, es vender mal */
  const next = CASES.find(c => !(store.cases[c.id] && store.cases[c.id].solved) && canPlay(c));
  let h = tabs("index") + `<section class="hero">
    <div>
    <h2 class="ui">${n === 0 ? T("heroNone") : n === t ? T("heroAll") : T("heroSome")}</h2>
    <p>${T("heroBody")}</p>
    <div class="row">
      ${next ? `<button class="btn primary" id="h-continue">${n === 0 ? T("openFirst") : T("continueAt",{n:pad2(next.id)})}</button>` : ""}
      <button class="btn" id="h-rules">${T("howTo")}</button>
    </div>
    <div class="progressbar"><i style="width:${(n/t*100).toFixed(1)}%"></i></div>
    <div class="legendrow"><span>${T("ofClosed",{n:pad2(n),t})}</span>
      ${streak() >= 2 ? `<span>${T("streakOf",{n:streak()})}</span>` : ""}
      <span>${T("verified")}</span></div>
    </div>
    <div class="heroplan" aria-hidden="true">${heroPlan(null, true)}</div>
  </section>`;
  if(CASES[19]) need(CASES[19].id, () => { if(view.name === "index") renderIndex(); });

  /* pestañas por nivel: el catálogo entero sin tres minutos de scroll */
  if(!tierSel || !TIERS.some(t => t.key === tierSel))
    tierSel = next ? next.tier : (TIERS[0] || {}).key;
  h += `<nav class="tiertabs ui" role="tablist" aria-label="${T("byTier")}">` +
    TIERS.map(tr => {
      const list = CASES.filter(c => c.tier === tr.key);
      if(!list.length) return "";
      const done = list.filter(c => store.cases[c.id] && store.cases[c.id].solved).length;
      return `<button role="tab" data-ttab="${tr.key}" aria-selected="${tr.key===tierSel}">
        ${esc(LANG==="en"&&tr.name_en?tr.name_en:tr.name)}<i class="mono">${done}/${list.length}</i></button>`;
    }).join("") + `</nav>`;

  for(const tr of TIERS){
    const list = CASES.filter(c => c.tier === tr.key);
    if(!list.length) continue;
    const done = list.filter(c => store.cases[c.id] && store.cases[c.id].solved).length;
    /* la tanda arranca donde el jugador lo dejó, no siempre por el principio */
    if(shown[tr.key] === undefined){
      const i = list.findIndex(c => !(store.cases[c.id] && store.cases[c.id].solved));
      shown[tr.key] = Math.min(list.length, Math.max(PAGE, (i < 0 ? 0 : i) + PAGE));
    }
    const upto = Math.min(shown[tr.key], list.length);
    h += `<section class="tier" data-tier="${tr.key}"${tr.key===tierSel?"":" hidden"}><div class="tier-head">
        <h3 class="ui">${esc(LANG==="en"&&tr.name_en?tr.name_en:tr.name)}</h3>
        <span class="note">${esc(LANG==="en"&&tr.note_en?tr.note_en:tr.note)}</span>
        <span class="count">${done}/${list.length}</span>
      </div><div class="cases compact">${list.slice(0, upto).map(caseCard).join("")}</div>
      ${upto < list.length ? `<p class="more"><button class="btn" data-more="${tr.key}">${
        T("showMore", {n: Math.min(PAGE_MAS, list.length - upto)})}</button>
        <span class="mono">${upto}/${list.length}</span></p>` : ""}
    </section>`;
  }
  app.innerHTML = h;
  wireTabs();
  app.querySelectorAll("[data-ttab]").forEach(b =>
    b.addEventListener("click", () => {
      tierSel = b.dataset.ttab;
      const y = window.scrollY;
      renderIndex();
      window.scrollTo({top:y, behavior:"instant"});
    }));
  app.querySelectorAll(".case-card").forEach(b =>
    b.addEventListener("click", () => {
      if(b.classList.contains("locked")){ openPro(); return; }
      go({name:"case", id:+b.dataset.id});
    }));
  app.querySelectorAll("[data-more]").forEach(b =>
    b.addEventListener("click", () => {
      const k = b.dataset.more;
      shown[k] = (shown[k] || PAGE) + PAGE_MAS;
      const y = window.scrollY;
      renderIndex();
      window.scrollTo({top:y, behavior:"instant"});
    }));
  const cont = document.getElementById("h-continue");
  if(cont) cont.addEventListener("click", () => go({name:"case", id:next.id}));
  document.getElementById("h-rules").addEventListener("click", openRules);
}

/* La rampa se lee de los propios casos: cada día de la semana reparte tableros
   de un tamaño, y basta mirar el primero de cada día para saber cuál. */
function rampBars(k, wd){
  const seen = {};
  for(const d of DAILY_DATES){
    const w = DAILY[d].wd;
    if(seen[w]) continue;
    const c = dayCase(d, k);
    if(c) seen[w] = c;
    if(Object.keys(seen).length === 7) break;
  }
  const max = Math.max(...Object.keys(seen).map(w => seen[w].C), 5);
  return [0,1,2,3,4,5,6].map(i => {
    const c = seen[i];
    if(!c) return `<span><b>${T(DAYNAMES[i]).slice(0,2)}</b></span>`;
    const alto = 8 + (c.C - 4) / (max - 4) * 26;
    return `<span class="${i===wd?'on':''}${c.almost?' peak':''}">
      <b>${T(DAYNAMES[i]).slice(0,2)}</b><i style="height:${alto.toFixed(0)}px"></i>${c.R}×${c.C}</span>`;
  }).join("");
}

/* ───────────────────────────────────────────── calendario del diario ──────
   Ciento veinte tarjetas en fila no son un archivo, son un scroll. Un juego
   diario se navega por meses: la cuadrícula enseña de un vistazo qué días
   caíste y dónde se rompió la racha, que es justo lo que uno viene a mirar. */
let calMonth = null;
const MON = ["january","february","march","april","may","june",
             "july","august","september","october","november","december"];
function monthShift(ym, d){
  let [y, m] = ym.split("-").map(Number);
  m += d; while(m < 1){ m += 12; y--; } while(m > 12){ m -= 12; y++; }
  return y + "-" + pad2(m);
}
function drawCalendar(ym){
  calMonth = ym;
  const sec = document.getElementById("cal");
  if(!sec) return;
  const today = todayISO();
  const [y, m] = ym.split("-").map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1));
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const lead = (first.getUTCDay() + 6) % 7;          /* la semana empieza en lunes */
  const inMonth = DAILY_DATES.filter(d => d.slice(0,7) === ym);
  const done = inMonth.filter(d => daySolved(d, track)).length;
  const prev = DAILY_DATES.some(d => d < ym + "-01");
  const nextM = monthShift(ym, 1);
  const next = DAILY_DATES.some(d => d.slice(0,7) === nextM && d <= today);

  let cells = "";
  for(let i = 0; i < lead; i++) cells += `<span class="cd empty"></span>`;
  for(let d = 1; d <= days; d++){
    const iso = ym + "-" + pad2(d);
    const cc = dayCase(iso, track);
    if(!cc || iso > today){ cells += `<span class="cd empty">${d}</span>`; continue; }
    const st = store.cases[cc.id];
    const otro = daySolved(iso, track === "f" ? "x" : "f");
    const cls = st && st.solved ? "done" : st && Object.keys(st.p || {}).length ? "started" : "";
    cells += `<button class="cd ${cls}${iso === today ? " today" : ""}${cc.almost ? " peak" : ""}"
      data-daily="${iso}"
      title="${esc(loc(cc).title)} · ${T("difficulty")} ${diffOf(cc)}/5${cc.almost ? " · " + T("almostImpossible") : ""}">
      <b>${d}</b><i class="mono">${diffDots(diffOf(cc)).slice(0, diffOf(cc))}</i>
      ${otro ? '<u class="other"></u>' : ""}</button>`;
  }
  sec.innerHTML = `<div class="tier-head">
      <h3 class="ui">${T(MON[m-1])} ${y}</h3>
      <span class="note">${T(track === "x" ? "archiveHard" : "archiveNote")}</span>
      <span class="count">${pad2(done)}/${pad2(inMonth.filter(d => d <= today).length)}</span>
    </div>
    <div class="calnav">
      <button class="btn ghost" id="cal-prev" ${prev?"":"disabled"}>←</button>
      <div class="calhead ui">${[0,1,2,3,4,5,6].map(i => `<span>${T(DAYNAMES[i]).slice(0,2)}</span>`).join("")}</div>
      <button class="btn ghost" id="cal-next" ${next?"":"disabled"}>→</button>
    </div>
    <div class="calgrid">${cells}</div>
    <p class="callegend ui"><span class="cd done sample"></span>${T("calDone")}
      <span class="cd started sample"></span>${T("calStarted")}
      <span class="cd sample"></span>${T("calOpen")}</p>`;
  sec.querySelectorAll("[data-daily]").forEach(b =>
    b.onclick = () => go({name:"case", id: DAILY[b.dataset.daily][track],
                          d: b.dataset.daily, k: track}));
  const pv = document.getElementById("cal-prev"), nx = document.getElementById("cal-next");
  if(pv) pv.onclick = () => drawCalendar(monthShift(ym, -1));
  if(nx) nx.onclick = () => drawCalendar(nextM);
}

/* ═════════════════════════════════════════════════ PERFIL Y GRUPOS ══════
   Un grupo es una liga de dos semanas entre amigos: cada día se corre la
   contrarreloj y quien menos tarda se lleva los puntos del día. Al cabo de
   catorce días se cierra, se proclama ganador y empieza otra.

   Se puntúa POR PUESTO, no por tiempo. Es deliberado: como a cada jugador le
   tocan cuatro casos distintos —para que no se puedan copiar—, dos tiempos no
   son exactamente comparables aunque la escalera de dificultad sea la misma.
   Ordenar por puesto cada día y sumar catorce días diluye esa variación; sumar
   segundos la amplificaría.

   Hoy los partes viajan por código: terminas, copias una línea y la pegas en
   el grupo de quien sea. Cuando exista el servidor, `Board` cambiará de
   implementación y la interfaz se queda igual: los mismos datos, sin copiar
   y pegar. */
const SEASON_DAYS = 14;
const PTS = [5, 3, 2];                 /* 1º, 2º, 3º; los demás que acaben, 1 */
/* De tres a doce. Abajo, porque con dos no hay clasificación: hay un duelo, y
   para eso está el duelo. Arriba, porque el reparto de puntos sólo premia a
   tres puestos y a partir de una docena la mayoría del grupo corre cada día
   para llevarse un punto de consolación, que es la forma más rápida de que
   una liga se muera. */
const GROUP_MIN = 3, GROUP_MAX = 12;
const groupSize = g => Object.keys(g.members || {}).length;
const groupReady = g => groupSize(g) >= GROUP_MIN;

function me(){
  if(!store.me || !store.me.id){
    const r = Math.random().toString(36).slice(2, 8).toUpperCase();
    store.me = {id: "P" + r, name: "", emoji: "🕵️"};
    save();
  }
  return store.me;
}
const meName = () => (me().name || T("meAnon"));
const groups = () => (store.groups = store.groups || []);
const groupBy = code => groups().find(g => g.code === code);

function newCode(n){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";   /* sin I ni O ni 0 ni 1 */
  let s = "";
  for(let i=0;i<n;i++) s += A[Math.floor(Math.random() * A.length)];
  return s;
}
function groupCreate(name, kind){
  /* `start` en blanco a propósito: la temporada no empieza a contar hasta que
     el grupo llega a tres. Arrancar el reloj con el fundador solo quemaría
     días de liga mientras la gente todavía está entrando. */
  const g = {code: newCode(6), name: name || T("groupUnnamed"), kind: kind || "normal",
             start: null, members: {}, results: {}, history: []};
  g.members[me().id] = {name: meName(), emoji: me().emoji};
  groups().push(g); save();
  return g;
}
function groupJoin(code, name){
  code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if(!code || groupBy(code)) return null;
  const g = {code, name: name || T("groupJoined",{c:code}), kind: "normal",
             start: null, members: {}, results: {}, history: []};
  g.members[me().id] = {name: meName(), emoji: me().emoji};
  groups().push(g); save();
  return g;
}
/* Meter a alguien en el grupo. Devuelve por qué no, si no. Un grupo lleno no
   se amplía en silencio: quien pega el parte del decimotercero tiene que
   enterarse de que ese resultado no ha entrado. */
function groupAdd(g, pid, name, emoji){
  if(g.members[pid]){
    if(name) g.members[pid].name = name;
    return "ok";
  }
  if(groupSize(g) >= GROUP_MAX) return "lleno";
  g.members[pid] = {name: name || pid, emoji: emoji || "🕵️"};
  /* el tercero arranca la temporada, y el reloj empieza hoy para todos */
  if(!g.start && groupReady(g)) g.start = todayISO();
  save();
  return "ok";
}
/* Un grupo de menos de tres no tiene temporada en marcha: se le enseña el
   hueco que falta, no una tabla de uno. */
const seasonOn = g => !!g.start;
const dayShift = (iso, n) => {
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
};
const daysBetween = (a, b) =>
  Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 86400000);
const seasonEnd = g => g.start ? dayShift(g.start, SEASON_DAYS - 1) : null;
const seasonLeft = g => g.start
  ? Math.max(0, daysBetween(todayISO(), seasonEnd(g)) + 1) : SEASON_DAYS;

/* puntos de un día: por puesto, y quien acaba se lleva al menos uno */
function dayPoints(g, iso){
  const r = g.results[iso] || {};
  const orden = Object.keys(r).sort((a,b) => r[a].ms - r[b].ms);
  const out = {};
  orden.forEach((pid, i) => { out[pid] = PTS[i] !== undefined ? PTS[i] : 1; });
  return out;
}
function standings(g){
  const tot = {};
  Object.keys(g.members).forEach(p => tot[p] = {pid:p, pts:0, dias:0, mejor:null, suma:0});
  for(let i = 0; g.start && i < SEASON_DAYS; i++){
    const iso = dayShift(g.start, i);
    if(iso > todayISO()) break;
    const pts = dayPoints(g, iso), r = g.results[iso] || {};
    for(const pid in pts){
      if(!tot[pid]) tot[pid] = {pid, pts:0, dias:0, mejor:null, suma:0};
      tot[pid].pts += pts[pid];
      tot[pid].dias++;
      tot[pid].suma += r[pid].ms;
      if(tot[pid].mejor === null || r[pid].ms < tot[pid].mejor) tot[pid].mejor = r[pid].ms;
    }
  }
  /* empate a puntos: gana quien acumule menos tiempo */
  return Object.keys(tot).map(k => tot[k])
    .sort((a,b) => b.pts - a.pts || (a.suma || Infinity) - (b.suma || Infinity));
}
/* si la temporada ha vencido, se cierra, se guarda el ganador y empieza otra */
function seasonRoll(g){
  if(!g.start || todayISO() <= seasonEnd(g)) return null;
  const tabla = standings(g).filter(x => x.dias);
  const campeon = tabla[0] || null;
  g.history.push({start: g.start, end: seasonEnd(g),
                  winner: campeon ? campeon.pid : null,
                  pts: campeon ? campeon.pts : 0,
                  tabla: tabla.slice(0, 8).map(x => ({pid:x.pid, pts:x.pts}))});
  g.results = {}; g.start = todayISO(); save();
  return campeon;
}
function groupPost(g, iso, pid, who, ms, hints){
  const entra = groupAdd(g, pid, who);
  if(entra !== "ok") return entra;               /* «lleno» */
  g.results[iso] = g.results[iso] || {};
  /* sólo cuenta el primer intento del día: si no, se corre hasta acertar */
  if(g.results[iso][pid]) return "repe";
  g.results[iso][pid] = {ms, hints};
  save();
  return true;
}
/* el parte del día, en una línea */
const partOf = (g, iso, ms, hints) =>
  ["ASG1", g.code, me().id, iso.replace(/-/g,""), Math.round(ms/1000), hints,
   meName().replace(/[^\p{L}\p{N} ]/gu, "").slice(0,14) || "?"].join(".");
function partParse(txt){
  const m = String(txt||"").trim().match(
    /ASG1\.([A-Z0-9]+)\.([A-Z0-9]+)\.(\d{8})\.(\d+)\.(\d+)\.(.+)$/u);
  if(!m) return null;
  return {code:m[1], pid:m[2],
          iso:m[3].slice(0,4)+"-"+m[3].slice(4,6)+"-"+m[3].slice(6,8),
          ms:+m[4]*1000, hints:+m[5], name:m[6].trim()};
}

/* La invitación llegada por enlace se atiende aquí, ya con la pestaña
   pintada: abrir una hoja modal encima de una pantalla en blanco desorienta. */
async function takeInvite(){
  if(PENDING && PENDING.kind !== "duelo" && PENDING.kind !== "grupo") return;
  const p = PENDING; PENDING = null;
  if(!p) return;
  /* fuera de la barra de direcciones: recargar no debe volver a preguntar */
  try { history.replaceState(null, "", "#contrarreloj"); } catch(e){}
  if(p.kind === "duelo"){
    const d = duelAdopt(p, "priv");
    drawDuels(); openDuel(d.seed);
    return;
  }
  const ya = groupBy(p.code);
  if(ya){ openGroup(ya.code); return; }
  if(!await uiConfirm(T("groupJoinFromLink", {c: p.code}))) return;
  const g = groupJoin(p.code);
  if(!g){ flashTop(T("groupBadCode")); return; }
  renderRace(); openGroup(g.code);
}

/* Un enlace sólo sirve si quien lo recibe puede abrirlo. Con file:// o dentro
   del visor de artefactos la dirección no lleva a ningún sitio para otra
   persona, así que ahí se comparte el código a secas y no una URL falsa. */
function shareURL(frag){
  if(EMBEDDED || !/^https?:$/.test(location.protocol)) return null;
  return location.origin + location.pathname + frag;
}
/* copiar, o compartir con la hoja del sistema si el móvil la tiene */
function shareOut(texto, titulo, outEl){
  const puesto = m => { if(outEl) outEl.textContent = m; };
  if(navigator.share){
    navigator.share({title: titulo, text: texto}).then(() => puesto(T("shareSent")),
      () => {});
    return;
  }
  navigator.clipboard.writeText(texto).then(() => puesto(texto),
    () => uiPrompt(titulo, texto));
}

function wireDuels(){
  /* Un grupo de radios de verdad, no cuatro botones seguidos: al tabulador le
     llega uno solo —el marcado— y dentro se anda con las flechas. Es lo que
     espera quien navega con teclado y lo que anuncia `role="radiogroup"`; si
     lo declaras y luego no lo cumples, el lector de pantalla miente. */
  const seg = (id, attr, set) => {
    const box = document.getElementById(id);
    if(!box) return;
    const todos = [...box.querySelectorAll("button")];
    const marca = b => {
      set(b.dataset[attr]);
      todos.forEach(x => {
        const on = x === b;
        x.classList.toggle("on", on);
        x.setAttribute("aria-checked", on ? "true" : "false");
        x.tabIndex = on ? 0 : -1;
      });
    };
    todos.forEach(b => {
      b.tabIndex = b.getAttribute("aria-checked") === "true" ? 0 : -1;
      b.onclick = () => marca(b);
      b.onkeydown = e => {
        const paso = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1
                   : e.key === "ArrowLeft"  || e.key === "ArrowUp"   ? -1
                   : e.key === "Home" ? "a" : e.key === "End" ? "z" : 0;
        if(!paso) return;
        e.preventDefault();
        const i = todos.indexOf(b);
        const sig = paso === "a" ? todos[0] : paso === "z" ? todos[todos.length - 1]
                  : todos[(i + paso + todos.length) % todos.length];
        marca(sig); sig.focus();
      };
    });
  };
  seg("d-n", "n", v => { duelN = +v; store.opts.duelN = duelN; save(); });
  seg("d-b", "b", v => { duelBand = v; store.opts.duelBand = v; save(); });

  const onl = document.getElementById("d-online");
  if(onl) onl.onclick = () => {
    if(!Net.online){ openDuelNoServer(); return; }
    onl.disabled = true; onl.textContent = T("duelSearching");
    Net.match(duelN, duelBand).then(m => {
      const d = duelAdopt({seed: m.seed, n: duelN, band: duelBand}, "online");
      d.rival = d.rival || {pid: m.rival.id, name: m.rival.name, ms: null, hints: 0};
      save(); drawDuels(); openDuel(d.seed);
    }, () => { onl.disabled = false; onl.textContent = T("duelFindRival");
               flashTop(T("duelNoRival")); });
  };
  const nue = document.getElementById("d-new");
  if(nue) nue.onclick = () => { const d = duelNew(duelN, duelBand, "priv");
                                drawDuels(); openDuel(d.seed); };
  const ent = document.getElementById("d-enter");
  if(ent) ent.onclick = async () => {
    const p = duelParse(await uiPrompt(T("duelAskCode"), ""));
    if(!p){ flashTop(T("duelBadCode")); return; }
    const d = duelAdopt(p, "priv");
    drawDuels(); openDuel(d.seed);
  };
  drawDuels();
}

        · ${d.when}</span>
      <span class="dstate ui">${estado}</span>
      <span class="dtimes mono">${d.mine ? fmtTime(d.mine.ms) : "—:—"}
        <i>vs</i> ${d.rival && d.rival.ms != null ? fmtTime(d.rival.ms) : "—:—"}</span>
    </button>`;
  }).join("");
  box.querySelectorAll("[data-d]").forEach(b => b.onclick = () => openDuel(b.dataset.d));
}

function openDuel(seed){
  const d = duelBy(seed);
  if(!d) return;
  const w = duelWinner(d);
  const url = shareURL("#duelo-" + d.seed + "-" + d.n + "-" + DUEL_BANDS.indexOf(d.band));
  const invitacion = url || duelCode(d);
  const marcador = () => {
    /* Sin haber corrido aún, el marcador SÍ se pinta si ya hay rival: en el
       duelo al azar te acaban de emparejar y lo primero que quieres saber es
       contra quién vas. Esconderlo hasta que corras era dejar la ficha muda
       justo en el momento de más ganas. */
    if(!d.mine && !d.rival) return `<p class="muted">${T("duelRunFirst")}</p>`;
    const yo = d.mine
      ? `<div class="dside${w === "yo" ? " win" : ""}">
          <span class="dwho ui">${esc(meName())}</span>
          <span class="dt mono">${fmtTime(d.mine.ms)}</span>
          <span class="dh">${T("raceHintsUsed", {n: d.mine.hints})}</span></div>`
      : `<div class="dside pend">
          <span class="dwho ui">${esc(meName())}</span>
          <span class="dt mono">—:—</span>
          <span class="dh">${T("duelNotRun")}</span></div>`;
    const otro = d.rival && d.rival.ms != null
      ? `<div class="dside${w === "rival" ? " win" : ""}">
          <span class="dwho ui">${esc(d.rival.name)}</span>
          <span class="dt mono">${fmtTime(d.rival.ms)}</span>
          <span class="dh">${T("raceHintsUsed", {n: d.rival.hints})}</span></div>`
      : `<div class="dside pend"><span class="dwho ui">${
          d.rival ? esc(d.rival.name) : T("duelRivalUnknown")}</span>
          <span class="dt mono">—:—</span>
          <span class="dh">${T("duelWaitingRival")}</span></div>`;
    return `<div class="duelboard">${yo}<span class="dvs ui">vs</span>${otro}</div>
      ${w ? `<p class="big">${w === "yo" ? T("duelYouWon")
             : w === "rival" ? T("duelTheyWon", {w: d.rival.name}) : T("duelTie")}</p>` : ""}`;
  };

  openSheet(T("duelSheet", {n: d.n}) + " · " + d.seed, `
    <p class="big">${duelLabel(d)}</p>
    <p>${T(d.mode === "online" ? "duelOnlineHow" : "duelPrivHow")}</p>
    ${marcador()}
    <div class="row" style="margin-top:16px">
      ${d.mine ? "" : `<button class="btn primary" id="du-run">${T("duelRun")}</button>`}
      <button class="btn${d.mine ? " primary" : " ghost"}" id="du-share">${
        url ? T("duelShareLink") : T("duelShareCode")}</button>
      ${d.mine && !(d.rival && d.rival.ms != null)
        ? `<button class="btn ghost" id="du-part">${T("duelCopyPart")}</button>
           <button class="btn ghost" id="du-paste">${T("duelPastePart")}</button>` : ""}
    </div>
    <p class="duelout" id="du-out"></p>
    <p class="muted">${T("duelFairNote")}</p>
    <p style="margin-top:18px"><button class="btn ghost" id="du-drop">${T("duelDrop")}</button></p>`);

  const out = () => document.getElementById("du-out");
  const run = document.getElementById("du-run");
  if(run) run.onclick = async () => {
    if(!await raceSwapOK()) return;
    const ids = duelDraw(d.seed, d.n, d.band);
    run.disabled = true; run.textContent = T("loading");
    Promise.all(ids.map(i => ensure(i))).then(() => {
      closeSheet();
      raceStart(ids, "duelo", todayISO(), {seed: d.seed});
      go({name: "case", id: ids[0], r: 1});
    }, () => { run.disabled = false; run.textContent = T("duelRun"); flashTop(T("loadFail")); });
  };
  document.getElementById("du-share").onclick = () =>
    shareOut(T("duelInviteText", {s: duelLabel(d), c: invitacion}), T("duelShareCode"), out());
  const part = document.getElementById("du-part");
  if(part) part.onclick = () => {
    const txt = duelPart(d);
    navigator.clipboard.writeText(txt).then(() => { out().textContent = txt; },
                                            () => uiPrompt(T("duelCopyPart"), txt));
  };
  const pega = document.getElementById("du-paste");
  if(pega) pega.onclick = async () => {
    const p = duelPartParse(await uiPrompt(T("duelAskPart"), ""));
    if(!p){ out().textContent = T("duelBadPart"); return; }
    if(p.seed !== d.seed){ out().textContent = T("duelOtherDuel"); return; }
    if(!duelPost(d, p.pid, p.name, p.ms, p.hints)){
      out().textContent = T("duelPartDup"); return;
    }
    Audio_.seal();
    drawDuels(); openDuel(d.seed);
  };
  document.getElementById("du-drop").onclick = async () => {
    if(!await uiConfirm(T("duelDropAsk"))) return;
    store.duels = duels().filter(x => x.seed !== d.seed); save();
    closeSheet(); renderRace();
  };
}

function syncFree(){
  const n = freePick.length;
  const c = document.getElementById("r-count");
  if(c) c.textContent = n + "/20";
  const b = document.getElementById("r-start");
  if(b){ b.disabled = !n; b.textContent = T("raceStartFree",{n}); }
}
function drawFree(){
  const box = document.getElementById("r-list");
  if(!box) return;
  /* sólo lo que este jugador puede abrir: ofrecer un caso con candado en el
     armador de carreras sería invitar a chocar con él tres pantallas después */
  const pool = CASES.filter(c => (freeTier === "todos" || c.tier === freeTier) && canPlay(c));
  /* la lista es larguísima: se enseña una ventana y se busca por número */
  const vista = pool.slice(0, 60);
  box.innerHTML = `<p class="muted">${T("raceWindow",{n:vista.length, t:pool.length})}</p>
    <div class="freegrid">${vista.map(c => {
      const on = freePick.indexOf(c.id) >= 0;
      return `<button class="fc${on?" on":""}" data-pick="${c.id}"
        title="${esc(loc(c).title)}"><b class="mono">${pad2(c.id)}</b>
        <i class="mono">${c.R}×${c.C}</i>
        <span class="diff mono">${diffDots(diffOf(c))}</span></button>`;
    }).join("")}</div>
    ${freePick.length ? `<p class="picked ui">${T("racePicked")}
      ${freePick.map(id => `<span class="chip mono" data-drop="${id}">${pad2(id)} ✕</span>`).join(" ")}</p>` : ""}`;
  box.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const id = +b.dataset.pick, i = freePick.indexOf(id);
    if(i >= 0) freePick.splice(i,1);
    else if(freePick.length < 20) freePick.push(id);
    drawFree(); syncFree(); Audio_.mark();
  });
  box.querySelectorAll("[data-drop]").forEach(b => b.onclick = () => {
    freePick = freePick.filter(x => x !== +b.dataset.drop);
    drawFree(); syncFree();
  });
}

/* ─────────────────────────────────────────────────── grupos: interfaz ──── */
function drawGroups(){
  const box = document.getElementById("g-list");
  if(!box) return;
  const gs = groups();
  if(!gs.length){ box.innerHTML = `<p class="muted">${T("groupNone")}</p>`; return; }
  box.innerHTML = gs.map(g => {
    const camp = seasonRoll(g);
    const t = standings(g).filter(x => x.dias);
    const hoy = (g.results[todayISO()] || {})[me().id];
    const yo = t.findIndex(x => x.pid === me().id);
    const faltan = GROUP_MIN - groupSize(g);
    return `<button class="gcard${seasonOn(g) ? "" : " waiting"}" data-g="${g.code}">
      <span class="gtop"><b class="ui">${esc(g.name)}</b>
        <span class="gcode mono">${g.code}</span></span>
      <span class="gmid ui">${seasonOn(g)
          ? T("groupDaysLeft",{n:seasonLeft(g)})
          : T("groupNotStarted")} ·
        ${T("groupMembers",{n:groupSize(g), m:GROUP_MAX})}</span>
      <span class="gpos ui">${!seasonOn(g)
        ? T("groupNeedMore",{n:faltan})
        : t.length
        ? T("groupYouAre",{p:yo >= 0 ? yo + 1 : "—", n:t.length,
                           pts:yo >= 0 ? t[yo].pts : 0})
        : T("groupEmptySeason")}</span>
      <span class="gtoday ${hoy ? "done" : ""}">${hoy
        ? T("groupTodayDone",{t:fmtTime(hoy.ms)}) : T("groupTodayPending")}</span>
      ${camp ? `<span class="gnew ui">${T("groupSeasonRolled")}</span>` : ""}
    </button>`;
  }).join("");
  box.querySelectorAll("[data-g]").forEach(b => b.onclick = () => openGroup(b.dataset.g));
}

function openGroup(code){
  const g = groupBy(code);
  if(!g) return;
  seasonRoll(g);
  const t = standings(g);
  const jugados = t.filter(x => x.dias).length;
  const dias = [];
  for(let i = 0; g.start && i < SEASON_DAYS; i++){
    const iso = dayShift(g.start, i);
    if(iso > todayISO()) break;
    dias.push(iso);
  }
  const fila = (x, i) => {
    const m = g.members[x.pid] || {name:x.pid, emoji:"🕵️"};
    const yo = x.pid === me().id;
    return `<tr class="${yo ? "yo" : ""}">
      <td class="pos mono">${x.dias ? i + 1 : "—"}</td>
      <td>${m.emoji} ${esc(m.name)}${yo ? ` <em>${T("groupYou")}</em>` : ""}</td>
      <td class="mono">${x.pts}</td>
      <td class="mono">${x.dias}</td>
      <td class="mono">${x.mejor !== null ? fmtTime(x.mejor) : "—"}</td></tr>`;
  };
  const hist = (g.history || []).slice(-3).reverse().map(h => {
    const m = g.members[h.winner] || {name: h.winner || "—", emoji:"🏆"};
    return `<li>${h.start} → ${h.end}: <b>${esc(m.name)}</b> ${T("groupWithPts",{n:h.pts})}</li>`;
  }).join("");

  const faltan = GROUP_MIN - groupSize(g);
  openSheet(g.name + " · " + g.code, `
    ${seasonOn(g)
      ? `<p class="big">${T("groupSeasonRange",{a:g.start, b:seasonEnd(g), n:seasonLeft(g)})}</p>`
      : `<div class="prolock"><p class="ui">${T("groupNeedMore",{n:faltan})}</p>
         <p>${T("groupNotStartedNote",{min:GROUP_MIN, max:GROUP_MAX})}</p></div>`}
    <p>${T("groupHow")}</p>
    <p class="muted">${T("groupSizeNote",{min:GROUP_MIN, max:GROUP_MAX,
      n:groupSize(g), libres:Math.max(0, GROUP_MAX - groupSize(g))})}</p>
    <div class="tw"><table class="standings">
      <thead><tr><th>#</th><th>${T("groupPlayer")}</th><th>${T("groupPts")}</th>
        <th>${T("groupDays")}</th><th>${T("groupBest")}</th></tr></thead>
      <tbody>${t.map(fila).join("")}</tbody></table></div>
    ${jugados ? "" : `<p class="muted">${T("groupNobodyYet")}</p>`}
    <h4 class="ui">${T("groupToday")}</h4>
    <p class="muted">${T("groupTodayNote")}</p>
    <div class="row">
      <button class="btn" id="gp-copy">${T("groupCopyPart")}</button>
      <button class="btn ghost" id="gp-paste">${T("groupPaste")}</button>
      <button class="btn ghost" id="gp-invite">${T("groupInvite")}</button>
    </div>
    <p class="duelout" id="gp-out"></p>
    <h4 class="ui">${T("groupScoring")}</h4>
    <p>${T("groupScoringNote")}</p>
    ${hist ? `<h4 class="ui">${T("groupPast")}</h4><ul>${hist}</ul>` : ""}
    <p style="margin-top:22px"><button class="btn ghost" id="gp-leave">${T("groupLeave")}</button></p>`);

  const out = () => document.getElementById("gp-out");
  document.getElementById("gp-copy").onclick = () => {
    const r = (g.results[todayISO()] || {})[me().id];
    if(!r){ out().textContent = T("groupNoRaceToday"); return; }
    const code2 = partOf(g, todayISO(), r.ms, r.hints);
    navigator.clipboard.writeText(code2).then(() => { out().textContent = code2; },
                                              () => uiPrompt(T("groupCopyPart"), code2));
  };
  document.getElementById("gp-paste").onclick = () => pastePart(g.code, out());
  document.getElementById("gp-invite").onclick = () => {
    if(groupSize(g) >= GROUP_MAX){ out().textContent = T("groupFull",{n:GROUP_MAX}); return; }
    const url = shareURL("#grupo-" + g.code);
    shareOut(T("groupInviteText", {g: g.name, c: url || g.code}), T("groupInvite"), out());
  };
  document.getElementById("gp-leave").onclick = async () => {
    if(!await uiConfirm(T("groupLeaveAsk"))) return;
    store.groups = groups().filter(x => x.code !== g.code); save();
    closeSheet(); renderRace();
  };
}

/* pegar el parte de otro: entra en el grupo que diga el propio código */
async function pastePart(prefer, outEl){
  const p = partParse(await uiPrompt(T("groupAskPart"), ""));
  const say = m => { if(outEl) outEl.textContent = m; else uiAlert(m); };
  if(!p){ say(T("groupBadPart")); return; }
  let g = groupBy(p.code);
  if(!g && prefer) g = groupBy(prefer);
  if(!g){
    if(!await uiConfirm(T("groupJoinFromPart",{c:p.code}))) return;
    g = groupJoin(p.code);
    if(!g){ say(T("groupBadCode")); return; }
  }
  const ok = groupPost(g, p.iso, p.pid, p.name, p.ms, p.hints);
  say(ok === true ? T("groupPartOk",{w:p.name, t:fmtTime(p.ms), d:p.iso})
    : ok === "lleno" ? T("groupFullPart",{w:p.name, n:GROUP_MAX})
    : T("groupPartDup",{w:p.name, d:p.iso}));
  drawGroups();
  if(outEl) openGroup(g.code);
}

/* pantalla intermedia: una carrera empezada y a medias */
/* Empezar una carrera nueva con otra a medias la abandona: se avisa antes */
async function raceSwapOK(){
  return !(store.race && store.race.running) || await uiConfirm(T("raceSwapAsk"));
}

/* el final: tiempos, parciales, marca y el hueco del anuncio */
function renderRaceResult(){
  const r = store.race;
  const total = r.splits.reduce((a,b) => a + b, 0);
  /* Un duelo no acaba en esta pantalla: acaba en la del duelo, con los dos
     tiempos al lado. Se anota el tiempo, se manda al servidor si lo hay y se
     sale por ahí. El anuncio se cobra igual, que la partida ha terminado. */
  if(r.kind === "duelo" && r.seed){
    const d = duelBy(r.seed);
    if(d){
      if(!d.mine){ d.mine = {ms: total, hints: r.hints}; save(); }
      raceSaveBest("duelo:" + d.band, d.n, total, r.hints);
      if(Net.online) Net.report(d.seed, total, r.hints).then(rv => {
        if(rv && rv.ms != null){ duelPost(d, rv.pid, rv.name, rv.ms, rv.hints);
                                 if(view && view.name === "race") openDuel(d.seed); }
      }, () => {});
      raceReset();
      renderRace();
      openDuel(d.seed);
      if(adDue("race")) setTimeout(() => showAd(null, false, "adWhyRace"), 800);
      return;
    }
  }
  const esDia = r.kind !== "libre";
  const mejor = raceSaveBest(r.kind, r.ids.length, total, r.hints);
  store.raceLog = (store.raceLog || []).concat([{kind:r.kind, iso:r.iso || todayISO(),
    n:r.ids.length, ms:total, hints:r.hints}]).slice(-60);
  save();
  setTimeout(checkAchv, 1400);
  /* la marca lleva la forma de la carrera, no los casos: así se compara lo
     comparable aunque a cada uno le tocaran cuatro distintos */
  const code = "ASR2." + (r.iso || todayISO()).replace(/-/g,"") + "." + r.kind
             + "." + r.ids.length + "." + Math.round(total/1000) + "." + r.hints;
  /* Sólo la carrera del tipo que corre el grupo puntúa, y sólo una al día:
     si no, se repetiría hasta que saliera un tiempo bueno. */
  const gruposAptos = esDia ? groups().filter(g => (g.kind || "normal") === r.kind) : [];

  app.innerHTML = tabs("race") + `<section class="hero">
    <div>
      <p class="tag ui">${esDia ? T(r.kind === "extrema" ? "raceDoneX" : "raceDoneN") : T("raceDoneFree")}</p>
      <h2 class="ui mono big-time">${fmtTime(total)}</h2>
      ${mejor ? `<p class="pb ui">${T("raceNewBest")}</p>` : ""}
      <div class="splits">${r.splits.map((ms,i) => {
        const c = ALLCASES[r.ids[i]];
        return `<div class="sp"><span class="mono">${i+1}</span>
          <span class="nm">${esc(loc(c).title)}</span>
          <span class="mono t">${fmtTime(ms)}</span></div>`;
      }).join("")}</div>
      <p class="legendrow"><span>${T("raceHintsUsed",{n:r.hints})}</span>
        <span>${T("raceAvg",{t:fmtTime(Math.round(total/r.ids.length))})}</span></p>
      ${gruposAptos.length ? `<div class="postgroups">
        <p class="ui">${T("racePostTo")}</p>
        ${gruposAptos.map(g => {
          const ya = (g.results[todayISO()] || {})[me().id];
          return `<button class="btn ${ya ? "ghost" : ""}" data-post="${g.code}" ${ya ? "disabled" : ""}>
            ${esc(g.name)}${ya ? " ✔" : ""}</button>`; }).join("")}
      </div>` : ""}
      <div class="row" style="margin-top:18px">
        ${esDia ? `<button class="btn primary" id="r-pub">${T("racePublish")}</button>` : ""}
        <button class="btn" id="r-share">${T("raceShare")}</button>
        <button class="btn ghost" id="r-new">${T("raceNew")}</button>
      </div>
      <p class="duelout" id="r-out"></p>
      ${esDia ? `<p class="muted">${T("racePublishNote")}</p>` : `<p class="muted">${T("raceFreeNoRank")}</p>`}
    </div>
    <div>
      ${isPro() ? "" : `<div class="adslot" id="adslot" role="note">
        <p class="ui">${T("adSlot")}</p>
        <p>${T("adSlotNote")}</p>
        <p class="row"><button class="btn" id="ad-buy">${T("adNever")}</button></p>
      </div>`}
    </div>
  </section>`;
  wireTabs();
  const adbuy = document.getElementById("ad-buy");
  if(adbuy) adbuy.onclick = openPro;
  if(adDue("race")) setTimeout(() => showAd(null, false, "adWhyRace"), 800);
  app.querySelectorAll("[data-post]").forEach(b => b.onclick = () => {
    const g = groupBy(b.dataset.post);
    if(!g) return;
    const ok = groupPost(g, todayISO(), me().id, meName(), total, r.hints);
    b.disabled = true; b.textContent = esc(g.name) + " ✔";
    document.getElementById("r-out").textContent = ok === true
      ? T("racePosted",{g:g.name}) + "  " + partOf(g, todayISO(), total, r.hints)
      : T("groupPartDup",{w:meName(), d:todayISO()});
    Audio_.seal();
  });
  const pub = document.getElementById("r-pub");
  if(pub) pub.onclick = () => {
    Board.push({kind:"race", code, ms:total, hints:r.hints});
    document.getElementById("r-out").textContent = T("racePublishSoon");
  };
  document.getElementById("r-share").onclick = () => {
    const txt = `ASESIDOKU · ${T("raceTab").toUpperCase()} ${r.ids.length}\n`
      + `${fmtTime(total)}  ${r.hints ? T("shareHints",{n:r.hints}) : T("shareClean")}\n`
      + r.splits.map(ms => fmtTime(ms)).join(" · ") + "\n" + code;
    navigator.clipboard.writeText(txt).then(
      () => { document.getElementById("r-out").textContent = txt; },
      () => uiPrompt(T("raceShare"), txt));
  };
  document.getElementById("r-new").onclick = () => { raceReset(); renderRace(); };
  raceReset();
}

/* ══════════════════════════════════════════════════════════ APRENDER ════
   El tutorial no explica: hace jugar. Recorre la cadena de deducción del
   propio caso —la misma que verificó Python— paso a paso, diciendo qué mirar
   y sin dejar avanzar hasta que la ficha cae donde toca. Los enunciados salen
   de la misma maquinaria que el resto del juego, así que están traducidos y
   son los mismos que se comprobaron: no hay un texto paralelo que se pueda
   desincronizar.

   Un reglamento de seis puntos delante de un 6×6 es la mejor forma de perder
   a alguien en los primeros treinta segundos. */
const LESSON = [["tutorL1","tutorL1b"], ["tutorL2","tutorL2b"], ["tutorL3","tutorL3b"]];

function renderLearn(){
  document.getElementById("subtitle").textContent = T("tutorTab");
  const hecho = store.tutor || 0;
  let h = tabs("learn") + `<section class="hero">
    <div>
      <p class="tag ui">${T("tutorTab")}</p>
      <h2 class="ui">${hecho >= TUTOR.length ? T("tutorDone") : T("tutorTitle")}</h2>
      <p>${T("tutorLead")}</p>
      <div class="row">
        <button class="btn primary" id="t-go">${hecho ? (hecho >= TUTOR.length ? T("tutorAgain") : T("tutorNext")) : T("tutorStart")}</button>
        ${DAILY[todayISO()] ? `<button class="btn" id="t-skip">${hecho >= TUTOR.length ? T("tutorToDaily") : T("tutorSkip")}</button>` : ""}
      </div>
    </div>
    <div class="heroplan" aria-hidden="true" ${TUTOR[0] ? `style="aspect-ratio:${TUTOR[0].C}/${TUTOR[0].R}"` : ""}>${TUTOR[0] ? heroPlan(TUTOR[0]) : ""}</div>
  </section>
  <section class="tier"><div class="tier-head">
    <h3 class="ui">${T("tutorTab")}</h3><span class="count">${pad2(Math.min(hecho,TUTOR.length))}/${pad2(TUTOR.length)}</span></div>
    <div class="cases">`;
  TUTOR.forEach((c,i) => {
    const done = i < hecho;
    h += `<button class="case-card${done?" done":""}" data-tutor="${i}">
      <span class="thumb">${thumb(c)}</span>
      <span class="meta">
        <span class="num mono">${T("tutorLesson",{n:i+1}).toUpperCase()}</span>
        <span class="name">${T(LESSON[i][0])}</span>
        <span class="sub">${T(LESSON[i][1])}</span>
      </span>${done ? `<span class="stamp ui">${T("solved").toUpperCase()}</span>` : ""}</button>`;
  });
  h += `</div></section>`;
  app.innerHTML = h;
  wireTabs();
  const next = Math.min(hecho, TUTOR.length - 1);
  document.getElementById("t-go").onclick = () => go({name:"case", id:TUTOR[hecho >= TUTOR.length ? 0 : next].id});
  const sk = document.getElementById("t-skip");
  if(sk) sk.onclick = () => { store.tutor = TUTOR.length; save(); go({name:"daily"}); };
  app.querySelectorAll("[data-tutor]").forEach(b =>
    b.onclick = () => go({name:"case", id:TUTOR[+b.dataset.tutor].id}));
}

function renderCase(id){
  const c = ALLCASES[id];
  if(!c){ go({name:"index"}); return; }
  /* La guarda de verdad. La tarjeta con candado ya desvía el clic, pero un

  /* La selección es de este caso, no del anterior. Sin esto, elegir una ficha

  const dayISO = view.d || null, dayTrack = view.k || null;

  const isTutor = c.tier === "tutorial";
  const tutorN = isTutor ? TUTOR.findIndex(t => t.id === c.id) : -1;
  /* Una carrera juega con su propio tablero: rejugar un caso ya cerrado
     empieza en blanco y no toca el progreso del expediente. */
  const race = (view.r && store.race && store.race.running &&
                store.race.ids[store.race.i] === id) ? store.race : null;
  if(race) raceResume();
  const s = cs(race ? RACE_KEY(id) : id);
  const lc = loc(c);
  const names = c.suspects.map(x => x.name);
  const list = isDaily ? null : CASES;
  const prev = list && list.find(x => x.id === id - 1), next = list && list.find(x => x.id === id + 1);

  <div class="layout">
    <div>
      ${race ? `<div class="racebar ui" id="racebar">

      ${isTutor ? `<div class="guide" id="guide">

      <div class="plan-bar ui"><span>${T("scene",{r:c.R,c:c.C})}</span><span id="bodyinfo"></span></div>
      <div class="planwrap" data-zoom="1">
        <div class="rul top mono" style="grid-template-columns:repeat(${c.C},minmax(0,1fr))">${rulTop}</div>

        <h3 class="ui">${T("clues")}</h3>
        <div class="body"><ol class="clues" id="clues"></ol></div>
        <div class="foot"><span id="cluefoot">${T("clueStrike")}</span>
          <label class="livesw ui"><input type="checkbox" id="b-live" ${s.live?"checked":""}>
            ${T("liveClues")}</label></div>
      </div>
      <div class="toolbar" style="margin-top:0">
        <button class="btn" id="b-hint">${T("askHint")}</button>
        <button class="btn ghost" id="b-clear">${T("clearBoard")}</button>
        <button class="btn ghost" id="b-solve">${T("showSolution")}</button>
      </div>
      <p class="proof ui" id="proof"></p>

  document.getElementById("b-back").onclick = () =>
    go({name: race ? "race" : isTutor ? "learn" : isDaily ? "daily" : "index"});
  if(race){
    const ab = document.getElementById("r-abort");
    if(ab) ab.onclick = async () => { if(await uiConfirm(T("raceQuitAsk"))){ raceReset(); go({name:"race"}); } };
    const rc = document.getElementById("rclock");
    setInterval(() => { if(rc && store.race && store.race.running)
      rc.textContent = fmtTime(raceElapsed()); }, 500);
  }
  /* Cambiar de reto no es bajarle la dificultad a este: son dos casos
     distintos. Lo que se deja a medias se queda donde está y espera. */
  const swap = document.getElementById("b-swap");
  if(swap) swap.onclick = () => {
    const otra = dayTrack === "x" ? "f" : "x";
    track = otra; store.opts.track = otra; save();
    go({name:"case", id: DAILY[dayISO][otra], d: dayISO, k: otra});
  };
  if(prev) document.getElementById("b-prev").onclick = () => go({name:"case", id:id-1});
  if(next) document.getElementById("b-next").onclick = () => go({name:"case", id:id+1});
  document.querySelectorAll(".seg [data-tool]").forEach(b => {
    b.setAttribute("aria-pressed", b.dataset.tool === tool ? "true" : "false");
    b.onclick = () => { tool = b.dataset.tool;
      document.querySelectorAll(".seg [data-tool]").forEach(x =>
        x.setAttribute("aria-pressed", x.dataset.tool === tool ? "true" : "false"));
      refresh(); };
  });
  document.getElementById("b-undo").onclick = () => { if(undo(id)){ Audio_.lift(); refresh(); } };
  document.getElementById("b-redo").onclick = () => { if(redo(id)){ Audio_.mark(); refresh(); } };
  document.getElementById("b-check").onclick = check;
  document.getElementById("b-accuse").onclick = accuse;
  document.getElementById("b-hint").onclick = askHint;
  document.getElementById("b-auto").onclick = toggleAuto;
  document.getElementById("b-why").onclick = () => { tool = "why"; refresh();
    flash(T("whyPick")); };
  document.getElementById("b-print").onclick = () => window.print();

  /* En un 8×9 dentro de un móvil la casilla mide 37 px: pasa el mínimo táctil
     pero colocar con el pulgar en la última columna es incómodo. La lupa
     ensancha el plano y deja que se desplace en horizontal, en vez de
     obligar a hacer pinza sobre toda la página. */
  const zoomBar = document.getElementById("zoombar");
  const wrapEl = app.querySelector(".planwrap");
  let zoom = 1;
  function applyZoom(){
    wrapEl.dataset.zoom = String(zoom);
    wrapEl.style.setProperty("--zoom", zoom);
    const zv = document.getElementById("z-val");
    if(zv) zv.textContent = Math.round(zoom * 100) + "%";
    const zo = document.getElementById("z-out"), zi = document.getElementById("z-in");
    if(zo) zo.disabled = zoom <= 1;
    if(zi) zi.disabled = zoom >= 2;
  }
  function zoomable(){
    return window.innerWidth < 760 && c.C >= 7;
  }
  function syncZoomBar(){
    if(!zoomBar) return;
    zoomBar.hidden = !zoomable();
    if(zoomBar.hidden && zoom !== 1){ zoom = 1; applyZoom(); }
  }
  if(zoomBar){
    document.getElementById("z-in").onclick = () => { zoom = Math.min(2, zoom + 0.25); applyZoom(); };
    document.getElementById("z-out").onclick = () => { zoom = Math.max(1, zoom - 0.25); applyZoom(); };
    /* doble toque sobre el plano: acercar y volver */
    let lastTap = 0;
    document.getElementById("plan").addEventListener("pointerup", e => {
      if(!zoomable()) return;
      const now = e.timeStamp;
      if(now - lastTap < 320){ zoom = zoom > 1 ? 1 : 1.75; applyZoom(); }
      lastTap = now;
    });
    window.addEventListener("resize", syncZoomBar);
    syncZoomBar(); applyZoom();
  }
  document.getElementById("b-techs").onclick = () => openTechs(c);
  document.getElementById("b-live").onchange = e => {

  };
  document.getElementById("b-clear").onclick = () => {
    pushUndo(id); s.p = {}; s.v = null; s.notes = {}; s.x = {}; s.hyp = {};
    s.sealed = []; s.auto = false; save(); sel = null; Audio_.lift(); refresh();
  };
  document.getElementById("b-solve").onclick = async () => {
    if(!await uiConfirm(T("confirmSolve"))) return;
    pushUndo(id);
    for(const n of names) s.p[n] = c.solution[n].slice();
    s.v = c.victim.cell.slice(); save(); refresh(); showVerdict(false);
  };
  document.getElementById("proof").innerHTML =
    `<span class="seal">✔</span> ${T("proofStamp")} · ${T("proofSteps",{n:c.hints.length})}`;
