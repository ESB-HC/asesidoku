.cases.compact{display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:6px}
.case-card.cc,.sudcard.cc{flex-direction:column; align-items:center; justify-content:center;
  gap:3px; padding:9px 2px 8px; min-height:56px; text-align:center}
.cc .ccnum{font-size:13px; font-weight:700; color:var(--ink); letter-spacing:.02em}
.cc .ccdots{font-size:8px; letter-spacing:.14em; color:var(--accent)}
.cc.locked .ccnum,.cc.locked .ccdots{color:var(--muted)}
.cc .padlock{position:static; margin-top:1px}
.cc .cctick{position:absolute; top:3px; right:6px; font-size:11px; font-weight:800;
  color:var(--good,#2F6B3A)}
.cc.done{background:color-mix(in srgb, #2F6B3A 8%, var(--surface))}
.cc .started{top:6px; right:6px}
.cc .name{position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap}
</style>
<script>
/* -- engine.js -- */
/* ═══════════════════════════════════════════════════════════════════════════
   MOTOR DE RESTRICCIONES EN EL NAVEGADOR

   Es el mismo razonamiento que el solucionador de Python, portado a JS. No
   sirve para resolver el caso por el jugador: sirve para quitarle de encima la
   contabilidad. De aquí salen tres cosas que ninguna app del género tiene:

     · los candidatos automáticos  — qué fichas caben todavía en cada casilla
     · el modo foco               — dónde puede estar aún esta ficha
     · «¿por qué aquí no?»        — QUÉ PISTA concreta lo impide, nombrada

   La propagación es CORRECTA pero no completa: nunca descarta una casilla
   válida, aunque puede dejar alguna imposible sin descartar. Eso es lo que
   queremos: una ayuda honesta, no un oráculo.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
"use strict";

const DIRV = { N: [-1, 0], S: [1, 0], W: [0, -1], E: [0, 1] };
/* los datos guardan las direcciones en castellano: es la clave, no el idioma */
const DIRKEY = { norte: 'N', sur: 'S', oeste: 'W', este: 'E' };
const WALKABLE = ['chair', 'sofa', 'bed', 'rug'];

const key = (r, q) => r * 100 + q;
const rowOf = k => (k / 100) | 0;
const colOf = k => k % 100;

/* ─────────────────────────────────────────────────── precómputo del plano ── */
function buildBoard(C) {
  const R = C.R, W = C.C;
  const reg = new Map(), cells = [];
  for (let r = 0; r < R; r++) for (let q = 0; q < W; q++) {
    const k = key(r, q); cells.push(k); reg.set(k, C.regions[r][q]);
  }
  const furn = new Map();
  C.furniture.forEach(f => furn.set(key(f.cell[0], f.cell[1]), f));

  const blocked = new Set(), walkcells = new Set();
  furn.forEach((f, k) => (f.walk ? walkcells : blocked).add(k));
  const free = cells.filter(k => !blocked.has(k));
  const freeSet = new Set(free);

  /* vecindad: contigua Y en la misma habitación. Las paredes cortan aquí. */
  const beside = new Map();
  for (const k of cells) {
    const r = rowOf(k), q = colOf(k), out = [];
    for (const [dr, dq] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
      const r2 = r + dr, q2 = q + dq;
      if (r2 < 0 || q2 < 0 || r2 >= R || q2 >= W) continue;
      const k2 = key(r2, q2);
      if (reg.get(k2) === reg.get(k)) out.push(k2);
    }
    beside.set(k, out);
  }

  const bfam = new Map(), bfamn = new Map(), bobj = new Map();
  furn.forEach((f, k) => {
    if (!bfam.has(f.icon)) { bfam.set(f.icon, new Set()); bfamn.set(f.icon, new Map()); }
    if (!bobj.has(f.label)) bobj.set(f.label, new Set());
    for (const d of beside.get(k)) {
      bfam.get(f.icon).add(d);
      bfamn.get(f.icon).set(d, (bfamn.get(f.icon).get(d) || 0) + 1);
      bobj.get(f.label).add(d);
    }
  });
  const roomcells = [];
  for (let i = 0; i < C.rooms.length; i++)
    roomcells.push(new Set(free.filter(k => reg.get(k) === i)));
  const corners = new Set([key(0, 0), key(0, W - 1), key(R - 1, 0), key(R - 1, W - 1)]);

  const sus = C.suspects.map(s => s.name);
  const vic = C.victim.name;
  const attr = {};
  C.suspects.forEach(s => { attr[s.name] = s; });
  attr[vic] = C.victim;

  return {
    C, R, W, reg, cells, free, freeSet, furn, blocked, walkcells, beside,
    bfam, bfamn, bobj, roomcells, corners,
    sus, vic, people: sus.concat([vic]), attr,
    onFam: k => { const f = furn.get(k); return f && f.walk ? f.icon : null; }
  };
}

/* ───────────────────────────────────────── restricciones de cada tipo ─────
   Devuelve una lista de objetos:
     {t:'U', w, set}            dominio de una persona
     {t:'B', a, b, fn}          compatibilidad entre dos
     {t:'EQ'|'GE', set, k, sel} recuento
     {t:'W', w, set, scope}     testigo
     {t:'NOLINE', ax, v} · {t:'TRAIT', i, tr} · {t:'ROOMS', k} · {t:'ALONE2', a, b}
   `sel`: null = todas las personas · 'sus' = sospechosos · ['g','f'] = mujeres  */
function constraintsFor(cl, B) {
  const reg = B.reg, free = B.free, RC = B.roomcells, k = cl.k, w = cl.w;
  const U = pred => [{ t: 'U', w, set: new Set(free.filter(pred)) }];
  const bin = fn => [{ t: 'B', a: w, b: cl.b, fn }];
  const famSet = f => new Set([...(B.bfam.get(f) || [])].filter(x => B.freeSet.has(x)));

  switch (k) {
    case 'room+':   return U(x => reg.get(x) === cl.i);
    case 'room-':   return U(x => reg.get(x) !== cl.i);
    case 'roomOr':  return U(x => cl.ii.indexOf(reg.get(x)) >= 0);
    case 'edge': {
      const lim = cl.axis === 0 ? B.R - 1 : B.W - 1, v = cl.which === 0 ? 0 : lim;
      return U(x => (cl.axis === 0 ? rowOf(x) : colOf(x)) === v);
    }
    case 'line':    return U(x => (cl.axis === 0 ? rowOf(x) : colOf(x)) === cl.v);
    case 'notEdges': {
      const lim = cl.axis === 0 ? B.R - 1 : B.W - 1;
      return U(x => { const v = cl.axis === 0 ? rowOf(x) : colOf(x); return v !== 0 && v !== lim; });
    }
    case 'corner':  return U(x => B.corners.has(x) === !!cl.v);
    case 'besideFam':    return [{ t: 'U', w, set: famSet(cl.fam) }];
    case 'notBesideFam': return U(x => !(B.bfam.get(cl.fam) || new Set()).has(x));
    case 'besideFamN':   return U(x => ((B.bfamn.get(cl.fam) || new Map()).get(x) || 0) === cl.n);
    case 'besideObj':    return [{ t: 'U', w, set: new Set([...(B.bobj.get(cl.label) || [])].filter(x => B.freeSet.has(x))) }];
    case 'objDir': {
      const [dr, dq] = DIRV[DIRKEY[cl.dir]];
      return U(x => {
        const s = key(rowOf(x) - dr, colOf(x) - dq), f = B.furn.get(s);
        return !!f && f.label === cl.label && reg.get(s) === reg.get(x);
      });
    }
    case 'onFam':   return U(x => B.onFam(x) === cl.fam);
    case 'notOn':   return U(x => !B.walkcells.has(x));
    case 'onlyFam': { const S = new Set(free.filter(x => B.onFam(x) === cl.fam));
                      return [{ t: 'U', w, set: S }, { t: 'EQ', set: S, k: 1, sel: null }]; }
    case 'onlyRoom': return [{ t: 'U', w, set: RC[cl.i] }, { t: 'EQ', set: RC[cl.i], k: 1, sel: null }];
    case 'onlyBeside': { const S = famSet(cl.fam);
                         return [{ t: 'U', w, set: S }, { t: 'EQ', set: S, k: 1, sel: null }]; }
    case 'order': {
      const d = DIRKEY[cl.dir];
      if (d === 'N') return bin((x, y) => rowOf(x) < rowOf(y));
      if (d === 'S') return bin((x, y) => rowOf(x) > rowOf(y));
      if (d === 'W') return bin((x, y) => colOf(x) < colOf(y));
      return bin((x, y) => colOf(x) > colOf(y));
    }
    case 'diag': {
      const [v, h] = cl.dir.split('-');
      return bin((x, y) => (v === 'norte' ? rowOf(x) < rowOf(y) : rowOf(x) > rowOf(y))
                        && (h === 'oeste' ? colOf(x) < colOf(y) : colOf(x) > colOf(y)));
    }
    case 'offset': {
      const [dr, dq] = DIRV[DIRKEY[cl.dir]], d = cl.d;
      return bin((x, y) => y === key(rowOf(x) + dr * d, colOf(x) + dq * d));
    }
    case 'beside':    return bin((x, y) => B.beside.get(x).indexOf(y) >= 0);
    case 'notBeside': return bin((x, y) => B.beside.get(x).indexOf(y) < 0);
    case 'sameRoom':  return bin((x, y) => reg.get(x) === reg.get(y));
    case 'diffRoom':  return bin((x, y) => reg.get(x) !== reg.get(y));
    case 'alone2':    return [{ t: 'B', a: w, b: cl.b, fn: (x, y) => reg.get(x) === reg.get(y) },
                              { t: 'ALONE2', a: w, b: cl.b }];
    case 'roomCount':   return [{ t: 'EQ', set: RC[cl.i], k: cl.n, sel: null }];
    case 'roomAtLeast': return [{ t: 'GE', set: RC[cl.i], k: cl.n, sel: null }];
    case 'roomAttr':    return [{ t: 'EQ', set: RC[cl.i], k: cl.n, sel: ['g', cl.val] }];
    case 'emptyRooms':  return [{ t: 'ROOMS', k: cl.n }];
    case 'onTotal':     return [{ t: 'EQ', set: new Set(free.filter(x => B.onFam(x) === cl.fam)), k: cl.n, sel: null }];
    case 'besideTotal': return [{ t: 'EQ', set: famSet(cl.fam), k: cl.n, sel: null }];
    case 'emptyLineIs': return [{ t: 'NOLINE', ax: cl.axis, v: cl.v }];
    case 'witRoom':     return [{ t: 'W', w, set: famSet(cl.fam), scope: 'room' }];
    case 'witBesideRoom': return [{ t: 'W', w, set: new Set(free.filter(x => !(B.bfam.get(cl.fam) || new Set()).has(x))), scope: 'room' }];
    case 'witRoomAttr': return [{ t: 'W', w, set: new Set(free), scope: 'room-g', val: cl.val }];
    case 'witOffset': {
      const [dr, dq] = DIRV[DIRKEY[cl.dir]];
      return [{ t: 'W', w, set: new Set(free), scope: 'off', dr: dr * cl.d, dq: dq * cl.d }];
    }
    case 'roomTrait':   return [{ t: 'U', w, set: RC[cl.i] }, { t: 'TRAIT', i: cl.i, tr: cl.trait }];
    default: return [];
  }
}

/* La caché va por lista de pistas, no por tablero. Guardándola sólo en `B`,
   una llamada con UNA pista devolvía las restricciones de TODAS las de la
   llamada anterior: «¿rompe esta pista?» habría respondido siempre por el
   tablero entero y habría señalado como culpables a pistas inocentes. */
const CONS = new WeakMap();
function allConstraints(B, clues) {
  let byClues = CONS.get(B);
  if (!byClues) CONS.set(B, byClues = new WeakMap());
  const hit = byClues.get(clues);
  if (hit) return hit;
  const out = [];
  clues.forEach((cl, i) => constraintsFor(cl, B).forEach(c => out.push({ c, i })));
  byClues.set(clues, out);
  return out;
}

/* ──────────────────────────────────────────────────────────── propagación ──
   `fixed` es lo que el jugador ya ha puesto: {nombre: [fila, col]}. Se toma
   como cierto para calcular candidatos, aunque sea un error del jugador: la
   ayuda tiene que responder a SU tablero, no a la solución.                   */
function propagate(B, clues, fixed, opts) {
  opts = opts || {};
  const rounds = opts.rounds || 24;
  const dom = new Map();
  for (const p of B.people) {
    if (fixed && fixed[p]) dom.set(p, new Set([key(fixed[p][0], fixed[p][1])]));
    else dom.set(p, new Set(B.free));
  }
  /* En modo `basic` sólo se aplican las restricciones que el jugador podría
     escribir a lápiz sin razonar: las pistas que nombran a UNA persona y le
     acotan la casilla, y las filas y columnas que ya ocupa alguien colocado.
     Queda fuera todo lo que constituye una deducción de verdad —cruzar dos
     pistas, contar habitaciones, el único que puede estar en tal fila—, que
     es justamente lo que se supone que hace el jugador. La propagación
     completa resuelve el caso entero; ofrecerla como «candidatos» no sería
     una ayuda, sería la solución. */
  const BASIC = { U: 1, NOLINE: 1, TRAIT: 1 };
  let cons = allConstraints(B, clues);
  if (opts.basic) cons = cons.filter(o => BASIC[o.c.t]);
  const peopleOf = sel => !sel ? B.people
    : sel === 'sus' ? B.sus
    : B.people.filter(p => (B.attr[p] || {})[sel[0]] === sel[1]);

  const exact = (S, k, sel) => {
    const pool = peopleOf(sel);
    const must = pool.filter(p => [...dom.get(p)].every(x => S.has(x)));
    const can = pool.filter(p => [...dom.get(p)].some(x => S.has(x)));
    if (must.length > k || can.length < k) return null;
    let ch = false;
    if (must.length === k) for (const p of pool) {
      if (must.indexOf(p) >= 0) continue;
      const n = new Set([...dom.get(p)].filter(x => !S.has(x)));
      if (n.size !== dom.get(p).size) { dom.set(p, n); ch = true; }
    }
    if (can.length === k) for (const p of can) {
      const n = new Set([...dom.get(p)].filter(x => S.has(x)));
      if (n.size !== dom.get(p).size) { dom.set(p, n); ch = true; }
    }
    return ch;
  };

  let changed = true;
  for (let round = 0; round < rounds && changed; round++) {
    changed = false;
    for (const p of B.people) if (dom.get(p).size === 0) return dom;

    for (const { c } of cons) {
      if (c.t === 'U') {
        const n = new Set([...dom.get(c.w)].filter(x => c.set.has(x)));
        if (n.size !== dom.get(c.w).size) { dom.set(c.w, n); changed = true; }
      } else if (c.t === 'B') {
        const A = dom.get(c.a), D = dom.get(c.b);
        const na = new Set([...A].filter(x => { for (const y of D) if (c.fn(x, y)) return true; return false; }));
        const nb = new Set([...D].filter(y => { for (const x of A) if (c.fn(x, y)) return true; return false; }));
        if (na.size !== A.size) { dom.set(c.a, na); changed = true; }
        if (nb.size !== D.size) { dom.set(c.b, nb); changed = true; }
      } else if (c.t === 'EQ') {
        const r = exact(c.set, c.k, c.sel); if (r === null) return dom; changed = changed || r;
      } else if (c.t === 'GE') {
        const can = B.people.filter(p => [...dom.get(p)].some(x => c.set.has(x)));
        if (can.length === c.k) for (const p of can) {
          const n = new Set([...dom.get(p)].filter(x => c.set.has(x)));
          if (n.size !== dom.get(p).size) { dom.set(p, n); changed = true; }
        }
      } else if (c.t === 'NOLINE') {
        for (const p of B.people) {
          const n = new Set([...dom.get(p)].filter(x => (c.ax === 0 ? rowOf(x) : colOf(x)) !== c.v));
          if (n.size !== dom.get(p).size) { dom.set(p, n); changed = true; }
        }
      } else if (c.t === 'TRAIT') {
        for (const p of B.people) {
          if ((B.attr[p] || {})[c.tr]) continue;
          const n = new Set([...dom.get(p)].filter(x => !B.roomcells[c.i].has(x)));
          if (n.size !== dom.get(p).size) { dom.set(p, n); changed = true; }
        }
      } else if (c.t === 'ALONE2') {
        const ok = new Set();
        for (let i = 0; i < B.roomcells.length; i++) {
          const S = B.roomcells[i];
          const mn = B.people.filter(p => [...dom.get(p)].every(x => S.has(x))).length;
          const mx = B.people.filter(p => [...dom.get(p)].some(x => S.has(x))).length;
          if (mn <= 2 && 2 <= mx) ok.add(i);
        }
        for (const who of [c.a, c.b]) {
          const n = new Set([...dom.get(who)].filter(x => ok.has(B.reg.get(x))));
          if (n.size !== dom.get(who).size) { dom.set(who, n); changed = true; }
        }
      } else if (c.t === 'W') {
        const ok = new Set();
        for (const x of dom.get(c.w)) {
          let good = false, targets;
          if (c.scope === 'off') {
            const t = key(rowOf(x) + c.dr, colOf(x) + c.dq);
            targets = B.freeSet.has(t) ? [t] : [];
          } else {
            targets = [...c.set].filter(y => y !== x && B.reg.get(y) === B.reg.get(x));
          }
          for (const y of targets) {
            for (const q of B.people) {
              if (q === c.w) continue;
              if (c.scope === 'room-g' && (B.attr[q] || {}).g !== c.val) continue;
              if (dom.get(q).has(y) && rowOf(y) !== rowOf(x) && colOf(y) !== colOf(x)) { good = true; break; }
            }
            if (good) break;
          }
          if (good) ok.add(x);
        }
        if (ok.size !== dom.get(c.w).size) { dom.set(c.w, ok); changed = true; }
      }
    }

    /* fila y columna: como mucho una persona */
    for (const ax of [0, 1]) {
      for (const p of B.people) {
        /* a lápiz sólo cuentan las fichas ya puestas, no las que la máquina
           ha reducido a una casilla por su cuenta */
        if (opts.basic && !(fixed && fixed[p])) continue;
        if (dom.get(p).size !== 1) continue;
        const only = [...dom.get(p)][0], v = ax === 0 ? rowOf(only) : colOf(only);
        for (const q of B.people) {
          if (q === p) continue;
          const n = new Set([...dom.get(q)].filter(x => (ax === 0 ? rowOf(x) : colOf(x)) !== v));
          if (n.size !== dom.get(q).size) { dom.set(q, n); changed = true; }
        }
      }
      const lim = ax === 0 ? B.R : B.W;
      if (!opts.basic && B.people.length === lim) {
        for (let v = 0; v < lim; v++) {
          const who = B.people.filter(p => [...dom.get(p)].some(x => (ax === 0 ? rowOf(x) : colOf(x)) === v));
          if (who.length === 1) {
            const p = who[0];
            const n = new Set([...dom.get(p)].filter(x => (ax === 0 ? rowOf(x) : colOf(x)) === v));
            if (n.size !== dom.get(p).size) { dom.set(p, n); changed = true; }
          }
        }
      }
    }

    /* regla del asesino */
    if (opts.basic) continue;
    const okrooms = new Set();
    for (let i = 0; i < B.roomcells.length; i++) {
      const S = B.roomcells[i];
      const mn = B.sus.filter(p => [...dom.get(p)].every(x => S.has(x))).length;
      const mx = B.sus.filter(p => [...dom.get(p)].some(x => S.has(x))).length;
      if (mn <= 1 && 1 <= mx) okrooms.add(i);
    }
    const nv = new Set([...dom.get(B.vic)].filter(x => okrooms.has(B.reg.get(x))));
    if (nv.size !== dom.get(B.vic).size) { dom.set(B.vic, nv); changed = true; }
  }
  return dom;
}

/* ──────────────────────────────────── ¿por qué esta ficha no cabe aquí? ────
   Devuelve las razones concretas, cada una con la pista que la produce. Es lo
   contrario de un corrector: no dice si la casilla es la buena, dice qué regla
   la excluye. Si no devuelve nada, la casilla es compatible con todo lo que hay
   sobre la mesa — que no es lo mismo que ser la correcta.                     */
function whyNot(B, clues, who, cell, fixed) {
  const x = key(cell[0], cell[1]);
  const out = [];
  if (B.blocked.has(x)) {
    const f = B.furn.get(x);
    out.push({ kind: 'blocked', label: f ? f.label : null, labelEn: f ? f.label_en : null });
    return out;
  }
  /* choques con lo ya colocado */
  for (const p in (fixed || {})) {
    if (p === who) continue;
    const [r, q] = fixed[p];
    if (r === cell[0] && q === cell[1]) out.push({ kind: 'taken', who: p });
    else if (r === cell[0]) out.push({ kind: 'row', who: p, v: r });
    else if (q === cell[1]) out.push({ kind: 'col', who: p, v: q });
  }
  /* pistas que excluyen la casilla por sí solas */
  clues.forEach((cl, i) => {
    for (const c of constraintsFor(cl, B)) {
      if (c.t === 'U' && c.w === who && !c.set.has(x)) { out.push({ kind: 'clue', clue: i }); return; }
      if (c.t === 'NOLINE') {
        const v = c.ax === 0 ? cell[0] : cell[1];
        if (v === c.v) { out.push({ kind: 'clue', clue: i }); return; }
      }
      if (c.t === 'TRAIT' && !(B.attr[who] || {})[c.tr] && B.roomcells[c.i].has(x)) {
        out.push({ kind: 'clue', clue: i }); return;
      }
    }
  });
  /* pistas binarias: no queda sitio para la otra persona */
  const dom = propagate(B, clues, fixed || {}, { rounds: 8 });
  clues.forEach((cl, i) => {
    if (out.some(o => o.clue === i)) return;
    for (const c of constraintsFor(cl, B)) {
      if (c.t !== 'B') continue;
      const me = c.a === who ? 'a' : c.b === who ? 'b' : null;
      if (!me) continue;
      const other = me === 'a' ? c.b : c.a;
      let support = false;
      for (const y of dom.get(other)) {
        if (y === x) continue;
        if (me === 'a' ? c.fn(x, y) : c.fn(y, x)) { support = true; break; }
      }
      if (!support) { out.push({ kind: 'clue', clue: i, other }); return; }
    }
  });
  return out;

/* ─────────────────────────────────── las razones, en frases del idioma ───── */
function reasonText(a, X, clueNo) {
  const L = X.L, es = L.code === 'es';
  const n = a.n, cN = (a.c !== undefined) ? (a.c + 1) : null;
  const sq = es ? (n === 1 ? 'una sola casilla' : n + ' casillas')
                : (n === 1 ? 'a single square' : n + ' squares');
  switch (a.code) {
    case 'unaria': return es ? `la pista ${cN} deja a ${a.w} en ${sq}`
                             : `clue ${cN} leaves ${a.w} with ${sq}`;
    case 'arco': return es ? `la pista ${cN}, cruzada con ${a.o}, deja ${sq}`
                           : `clue ${cN}, crossed with ${a.o}, leaves ${sq}`;
    case 'recuento': return es ? `el aforo de la pista ${cN} obliga a repartir así`
                               : `the room count in clue ${cN} forces the split`;
    case 'minimo': return es ? `el mínimo de la pista ${cN} obliga a llenar esa habitación`
                             : `the minimum in clue ${cN} forces that room to fill`;
    case 'linea': return es ? `${a.p} ocupa ${L.line(a.ax, a.v)}`
                            : `${a.p} occupies ${L.line(a.ax, a.v)}`;
    case 'oculto': return es ? `nadie más cabe en ${L.line(a.ax, a.v)}`
                             : `nobody else fits in ${L.line(a.ax, a.v)}`;
    case 'bloqueado': return es ? `${a.ws.join(', ')} se reparten esas casillas y no dejan sitio`
                                : `${a.ws.join(', ')} share those squares and leave no room`;
    case 'asesino': return es ? 'el cuerpo solo puede estar donde quede exactamente un sospechoso'
                              : 'the body can only be where exactly one suspect remains';
    case 'asesino-sala': return es ? `en ${X.rooms[a.i]} solo puede quedar un sospechoso`
                                   : `only one suspect can remain in ${X.rooms[a.i]}`;
    case 'solas': return es ? `solo caben dos personas donde dice la pista ${cN}`
                            : `only two people fit where clue ${cN} says`;
    case 'solas2': return es ? `la pista ${cN} deja esa habitación en dos`
                             : `clue ${cN} leaves that room at two`;
    case 'testigo': return es ? `el testigo de la pista ${cN} tiene que caber`
                              : `the witness in clue ${cN} has to fit`;
    case 'rasgo': return es ? `la pista ${cN} exige un rasgo que ${a.w} no tiene`
                            : `clue ${cN} needs a trait ${a.w} does not have`;
    case 'salas': return es ? `la pista ${cN} no deja más habitaciones vacías`
                            : `clue ${cN} allows no further empty rooms`;
    case 'linea-vacia': return es ? `la pista ${cN} deja esa línea sin nadie`
                                  : `clue ${cN} leaves that line empty`;
    default: return '';
  }
}

/* ─────────────────────────────────── las cuatro frases de una pista ─────── */
function hintLevels(h, X, cellRef) {
  const L = X.L, es = L.code === 'es';
  const isVic = h.who === X.C.victim.name;
  const room = X.rooms[X.C.regions[h.cell[0]][h.cell[1]]];
  const tech = (TECH[L.code] || TECH.es)[h.tech] || TECH[L.code].unaria;
  const ns = h.clues.map(i => i + 1);
  const l1 = isVic ? (es ? 'Queda por situar el cuerpo.' : 'The body is still unplaced.')
    : (es ? `Hay algo que ya se puede cerrar sobre ${h.who}.`
          : `There is something you can already settle about ${h.who}.`);
  const l2 = ns.length
    ? (es ? (ns.length === 1 ? `Cruza la pista ${ns[0]}.` : `Cruza las pistas ${ns.join(', ')}.`)
          : (ns.length === 1 ? `Look at clue ${ns[0]}.` : `Cross clues ${ns.join(', ')}.`))
    : (es ? 'No hace falta ninguna pista nueva: mira lo que ya tienes en el plano.'
          : 'No new clue needed: look at what is already on the map.');
  const why = (h.why || []).map(a => reasonText(a, X)).filter(Boolean);
  const l4 = (why.length ? (es ? 'Porque ' : 'Because ') + why.join(es ? '; y ' : '; and ') + '. ' : '')
    + (es ? `Esto aísla a ${h.who} en ${cellRef}, en ${room}.`
          : `This isolates ${h.who} at ${cellRef}, in ${room}.`);
  return { l1, l2, l3: tech[1], l4, techName: tech[0] };
}

/* lo que lleva puesto un detective recién llegado */
const DEFAULT_AVATAR = { fondo:'f_papel', cara:'c_media', pelo:'p_nada', vello:'v_nada',
                         gafas:'g_nada', sombrero:'s_fedora', objeto:'o_nada', marco:'m_nada' };

const BYID = {};
ITEMS.forEach(i => BYID[i.id] = i);

/* componer: concatenar capas en el orden de SLOTS */
function avatarSVG(av, size){
  av = av || DEFAULT_AVATAR;
  const capas = SLOTS.map(s => {
    const it = BYID[av[s]] || BYID[DEFAULT_AVATAR[s]];
    return it ? it.svg : '';
  }).join('');
  return `<svg viewBox="0 0 96 96" width="${size||96}" height="${size||96}" `
       + `role="img" aria-hidden="true">${capas}</svg>`;
}

/* ── los logros ──────────────────────────────────────────────────────────
   Van por FAMILIAS con escalones: «racha de 3, 7, 14…» es una familia con
   ocho escalones, no ocho textos distintos. Cada escalón es el logro
   `familia.escalon`, da sus placas, y algunos regalan un accesorio (item).
   La medida de cada familia vive en app.js, que es quien conoce la partida:
   aquí sólo se declara QUÉ se celebra y CUÁNTO vale. */
const ACHV = [
 {fam:'racha',    n:'Racha de {n} días',            en:'{n}-day streak',
  tiers:[3,7,14,30,60,100,180,365], pts:[10,15,20,30,45,60,80,120],
  items:{365:'s_corona'}},

      [uno(a)].concat(b <= n ? [uno(b)] : [])));
  }
  return cadena.then(() => n);
}
const allCached = () => !DATA.chunk ||
  Object.keys(CHUNKS).length >= Math.ceil(CASES.length / DATA.chunk);

/* pide un caso y, cuando llegue, vuelve a pintar la vista donde estamos */
function need(id, again){
  if(isFull(ALLCASES[id])) return true;
  ensure(id).then(() => { if(view && again) again(); }, () => {});
  return false;
}

/* El diario no tiene casos propios: reparte los del fondo de mil. Cada fecha
   trae dos, uno fácil y uno extremo, y guarda sólo sus números. */
const TRACKS = ["f", "x"];
const dayCase = (iso, k) => { const d = DAILY[iso]; return d ? ALLCASES[d[k]] : null; };
const daySolved = (iso, k) => { const d = DAILY[iso];
  return !!(d && store.cases[d[k]] && store.cases[d[k]].solved); };
const dayAnySolved = iso => TRACKS.some(k => daySolved(iso, k));
/* la pista del día es la que el jugador eligió la última vez */
let track = "f";
/* Dentro de un visor empotrado la página no tiene permiso para iniciar una
   descarga: el enlace no haría nada y el botón sería una promesa falsa. Ahí
   se ofrece sólo copiar al portapapeles, que sí funciona. */
const EMBEDDED = (() => { try { return window.top !== window.self; } catch(e){ return true; } })();

/* ═══════════════════════════════════════════════════════════════ ESTADO ══ */
let store = {
  cases:{}, opts:{sound:true, theme:"auto", lang:null, cb:"none", scale:100, contrast:false},
  days:[], freezes:{n:2, month:""}, learned:[], tutor:0,

};
/* El juego se llamó Murdoku antes de llamarse AsesiDoku. Quien jugara entonces
   tiene su progreso bajo la clave vieja: se recoge y se reescribe bajo la nueva,
   sin borrar la antigua por si alguien vuelve a una versión anterior. */
try {

if (!store.opts.lang) {

if(store.opts.track === "x") track = "x";
let L = LANG === "en" ? I18.EN : I18.ES;

function T(k, a){

  if (a) for (const p in a) s = s.split("{"+p+"}").join(a[p]);

}
let saveT = 0;

function cs(id){

    live:true, solved:false, hints:0, fails:0, ms:0
  };

  s.p=s.p||{}; s.notes=s.notes||{}; s.x=s.x||{}; s.hyp=s.hyp||{};
  s.used=s.used||[]; s.sealed=s.sealed||[];

const solvedCount = () => CASES.filter(c => store.cases[c.id] && store.cases[c.id].solved).length;

/* ═══════════════════════════════════════════════════════════════ PREMIUM ══
   Hay dos versiones y sólo dos: la gratis, con un anuncio cada cuatro
   partidas y otro al cerrar el diario, y Pro, que por 1,99 € quita los
   anuncios y abre el modo sin conexión. No hay monedas, ni vidas, ni niveles
   de suscripción. El contenido —los mil casos, el diario, las carreras, los
   grupos— es el mismo en las dos: cobrar por casos partiría el juego en dos
   y dejaría la clasificación sin sentido.

   `Shop` es el único sitio del juego que sabe cómo se cobra. Cuando haya
   pasarela se cambia aquí y nada más: en la web irá Stripe; dentro de la app
   de Apple tiene que ir StoreKit, porque para bienes digitales la directriz
   3.1.1 no admite otra cosa.

   Una advertencia que conviene tener escrita, porque afecta a lo que se está
   vendiendo: el trabajador de servicio guarda cada tanda de casos que el
   jugador abre, así que quien no pague sigue pudiendo abrir el juego en el
   metro con lo que ya visitó. Eso no se toca. Romperlo a propósito sería
   estropear el juego para forzar una venta, y además haría el PWA peor.
   Lo que se cobra es traerse los mil de golpe —lo que hace falta ANTES de
   quedarse sin red—, y la interfaz lo dice con esas mismas palabras. */
const PRO_KEY = "asesidoku.pro";
const isPro = () => !!store.pro;
/* En la app de iOS los mil casos van DENTRO del paquete: jugar sin red viene
   de serie y venderlo sería vender algo que ya tienes. Ahí Pro hace una sola
   cosa —quitar los anuncios— y la interfaz tiene que decir eso y no lo otro.
   La marca `bundled` la pone build_app.py; la web no la lleva. */
const BUNDLED = () => !!(DATA && DATA.bundled);

/* ── el reparto del fondo ─────────────────────────────────────────────────
   Gratis se juegan QUINIENTOS de los dos mil, repartidos en proporción por
   nivel: con el fondo actual, uno de cada cuatro de cada nivel. Pro abre el
   resto. Tres decisiones dentro de esa frase:

   · Proporcional POR NIVEL, no los quinientos primeros. Un fondo gratuito
     sin extremos sería una demo; así todas las dificultades se prueban
     enteras, incluidos los «casi imposible».
   · El caso del día se juega SIEMPRE, se pague o no, y el diario sortea
     sobre el fondo ENTERO, candados incluidos. El diario es la razón de
     volver cada día y la racha es sagrada; y de paso, el jugador gratuito
     prueba cada día un caso que quizá es de la parte de pago.
   · Las carreras y los duelos SORTEAN SÓLO ENTRE LOS QUINIENTOS LIBRES,
     también para quien paga. Si el sorteo tocara casos que la mitad de la
     liga no puede abrir, la competición se partiría en dos; y de paso,
     pagar no compra ventaja en ninguna clasificación.

   El reparto es determinista —cupo proporcional por resto mayor, tomando
   los primeros de cada nivel— así que no hace falta guardarlo: se calcula
   igual hoy, mañana y en el otro dispositivo. */
const FREE_TOTAL = 500;
let FREE_SET = null;
function freeSet(){
  if(FREE_SET) return FREE_SET;
  FREE_SET = new Set();
  if(CASES.length <= FREE_TOTAL){          /* un fondo pequeño va entero */
    CASES.forEach(c => FREE_SET.add(String(c.id)));
    return FREE_SET;
  }
  const por = {};
  for(const c of CASES) (por[c.tier] = por[c.tier] || []).push(c);
  /* cupo proporcional con resto mayor: los cupos suman exactamente 500 */
  const cupo = {}, restos = [];
  let usados = 0;
  for(const k in por){
    const exacto = por[k].length * FREE_TOTAL / CASES.length;
    cupo[k] = Math.floor(exacto);
    usados += cupo[k];
    restos.push([exacto - cupo[k], k]);
  }
  restos.sort((a, b) => b[0] - a[0] || (a[1] < b[1] ? -1 : 1));
  for(let i = 0; i < FREE_TOTAL - usados; i++) cupo[restos[i % restos.length][1]]++;
  for(const k in por)
    por[k].slice(0, cupo[k]).forEach(c => FREE_SET.add(String(c.id)));
  return FREE_SET;
}
function canPlay(c){
  if(!c) return false;
  if(isPro() || c.tier === "tutorial") return true;
  const d = DAILY[todayISO()];
  if(d && (String(d.f) === String(c.id) || String(d.x) === String(c.id))) return true;
  /* el pase semanal (un anuncio voluntario) abre los retos de ESTA semana */
  if(weekPassOn() && weekIds().has(String(c.id))) return true;
  return freeSet().has(String(c.id));
}

/* Dos productos y sólo dos: `pro` (1,99 €, abre los dos mil y quita los
   anuncios) y `oro` (0,99 €, la Colección Oro de accesorios del avatar).
   Cada uno con su recibo local propio: quien borra su partida no pierde lo
   que pagó, y quien compra uno no arrastra el otro. */
const ORO_KEY = "asesidoku.oro";
const Shop = {
  price: () => T("proPrice"),
  /* dentro del envoltorio de iOS el cobro pasa por StoreKit; en la web, no */
  platform: () => (window.AsesiNative && window.AsesiNative.store) ? "ios" : "web",
  buy(producto){
    producto = producto || "pro";
    const nat = window.AsesiNative && window.AsesiNative.store;
    if(nat) return nat.buy(producto).then(t => Shop.grant(producto, t || "storekit"));
    return Promise.reject(new Error("sin pasarela"));
  },
  restore(){
    const nat = window.AsesiNative && window.AsesiNative.store;
    if(nat) return nat.restore().then(r => {
      const lista = (r && r.productos) || (r ? ["pro"] : []);
      lista.forEach(p => Shop.grant(p, (r && r.token) || "storekit"));
      return lista.length > 0;
    });
    /* en la web los recibos viven aparte del progreso */
    let alguno = false;
    try {
      if(localStorage.getItem(PRO_KEY)){ Shop.grant("pro", "local"); alguno = true; }
      if(localStorage.getItem(ORO_KEY)){ Shop.grant("oro", "local"); alguno = true; }
    } catch(e){}
    return Promise.resolve(alguno);
  },
  /* el único camino por el que se concede: lo llama la pasarela, no la vista */
  grant(producto, token){
    if(producto === "oro"){
      store.oro = true; save();
      try { localStorage.setItem(ORO_KEY, token || "1"); } catch(e){}
      return true;
    }
    store.pro = true; store.proWhen = todayISO(); store.ads = 0; save();
    try { localStorage.setItem(PRO_KEY, token || "1"); } catch(e){}
    return true;
  }
};
try { if(localStorage.getItem(PRO_KEY)) store.pro = true; } catch(e){}
try { if(localStorage.getItem(ORO_KEY)) store.oro = true; } catch(e){}

/* ── anuncios ────────────────────────────────────────────────────────────
   Uno cada cuatro partidas terminadas, y uno al cerrar el diario o una
   carrera. Nunca durante una partida, nunca con el cronómetro corriendo, y
   nunca en el tutorial: quien está aprendiendo a jugar todavía no le debe
   nada a nadie. */
const AD_EVERY = 4;                       /* un anuncio cada 4 casos cerrados */
const AD_RACES = 2;                       /* y uno cada 2 desafíos            */
const AD_COOLDOWN = 10 * 60 * 1000;       /* nunca dos en menos de 10 min     */
/* ¿Toca anuncio? Tres disparadores y dos salvaguardas.

   Disparadores: cerrar el reto del día; uno de cada DOS desafíos terminados
   (contrarreloj o duelo, comparten contador); y cada cuatro casos sueltos
   del expediente.

   Salvaguardas, y las dos salieron de jugar, no de teorizar:
   · CARENCIA — las cuatro primeras partidas cerradas de la vida del jugador
     no llevan anuncio, caiga lo que caiga. Quien acaba el tutorial y prueba
     el diario el primer día no ha decidido todavía si el juego le gusta; un
     intersticial ahí decide por él, y decide que no.
   · ENFRIAMIENTO — nunca dos anuncios en menos de DIEZ minutos, pase lo
     que pase. Sin esto, un duelo de UN puzzle fácil (40 segundos) encadenado
     con la revancha era un anuncio por minuto, y diario + desafío seguidos
     eran dos golpes seguidos. El anuncio perdonado por el frío no se
     acumula: el contador queda armado y dispara en el siguiente, pero un
     desafío ya pasado no se cobra con retraso.

   Quien paga no pasa por aquí; el tutorial tampoco. El anuncio VOLUNTARIO
   —el del pase semanal— tampoco: ese no lo decide este contador sino el
   jugador, que es toda la gracia. */
function adDue(kind){
  if(isPro() || kind === "tutor") return false;
  store.won = (store.won || 0) + 1;
  const carencia = store.won <= AD_EVERY;
  let toca = false;
  if(kind === "daily"){
    toca = true;
  } else if(kind === "race"){
    store.raceN = (store.raceN || 0) + 1;
    toca = store.raceN >= AD_RACES;
  } else {
    store.ads = (store.ads || 0) + 1;
    if(carencia){ if(store.ads >= AD_EVERY) store.ads = 0; save(); return false; }
    /* LA CADENA NO SE CORTA: al cuarto caso el anuncio se ARMA pero no
       interrumpe — espera al descanso (volver a una portada), donde lo
       cobra adBreak(). Si el jugador encadena sin parar, al sexto se
       cobra igual: mejor cada seis que uno en mitad de la racha. */
    if(store.ads >= AD_EVERY + 2){ toca = true; }
    else if(store.ads >= AD_EVERY){ store.adArmed = 1; store.adKind = kind; save(); return false; }
  }
  if(carencia){                                    /* carencia: se perdona */
    if(toca && kind === "race") store.raceN = 0;
    save();
    return false;
  }
  const frio = Date.now() - (store.adAt || 0) < AD_COOLDOWN;
  if(toca && frio){                                /* enfriamiento */
    if(store.ads > AD_EVERY + 2) store.ads = AD_EVERY + 2;  /* queda armado */
    if(store.raceN > AD_RACES) store.raceN = AD_RACES;
    save();
    return false;
  }
  if(toca){ store.ads = 0; store.adArmed = 0;
            if(kind === "race") store.raceN = 0;
            store.adAt = Date.now(); }
  save();
  return toca;
}
/* El descanso: una portada (expediente, diario, contrarreloj, sudoku…).
   Aquí se cobra el anuncio que la cadena de casos dejó armado. */
function adBreak(){
  if(isPro() || !store.adArmed) return;
  if(Date.now() - (store.adAt || 0) < AD_COOLDOWN) return;   /* sigue armado */
  const motivo = store.adKind === "sud" ? "adWhySud" : "adWhyCase";
  store.adArmed = 0; store.ads = 0; store.adAt = Date.now(); save();
  setTimeout(() => showAd(null, false, motivo), 600);
}

/* ── el pase semanal ──────────────────────────────────────────────────────
   Un anuncio VOLUNTARIO con recompensa: lo ves cuando tú quieres y se abren
   los catorce retos de la semana en curso —los 7 días, las dos pistas—
   aunque caigan en la mitad de pago. Es el formato de anuncio mejor tolerado
   que existe, precisamente porque lo pide el jugador; y de paso el gratuito
   prueba casos de la parte Pro, que es la mejor ficha de venta.

   Dos rayas que no se cruzan:
   · El caso de HOY nunca depende de esto: sigue siendo gratis siempre. El
     pase abre el ARCHIVO de la semana (recuperar el martes que te perdiste),
     no el derecho a jugar hoy. Una racha detrás de un anuncio sería un muro
     con otro disfraz — y el día que la red no sirva anuncio (sin cobertura,
     sin inventario), sería una racha rota por un fallo ajeno.
   · Caduca el domingo. La semana siguiente, otro anuncio si se quiere. Por
     eso se guarda el LUNES de la semana, no un booleano. */
const weekMon = () => {
  const d = new Date();
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
};
const weekPassOn = () => store.weekPass === weekMon();
let WEEK_IDS = null, WEEK_FOR = null;
function weekIds(){
  const lun = weekMon();
  if(WEEK_IDS && WEEK_FOR === lun) return WEEK_IDS;
  WEEK_FOR = lun;
  WEEK_IDS = new Set();
  for(let i = 0; i < 7; i++){
    const d = DAILY[dayShift(lun, i)];
    if(d){ WEEK_IDS.add(String(d.f)); WEEK_IDS.add(String(d.x)); }
  }
  return WEEK_IDS;
}
/* ¿le queda algo por desbloquear esta semana a ESTE jugador? */
const weekHasLocked = () =>
  [...weekIds()].some(id => !freeSet().has(id) && ALLCASES[id]);
function weekPassGrant(){
  store.weekPass = weekMon();
  store.adAt = Date.now();      /* tras un anuncio visto, 10 min sin otro */
  save();
}

/* ═══════════════════════════════════════════════ PERFIL, LOGROS Y PLACAS ══
   El catálogo del avatar y la tabla de logros viven en avatar.js; aquí vive
   lo que sólo la partida sabe: cuánto llevas hecho (las MEDIDAS), cuándo se
   celebran los logros, y la caja de las placas.

   Las placas son la moneda blanda: SÓLO se ganan jugando (cada logro paga
   las suyas) y sólo compran accesorios. No se venden por dinero a propósito:
   en cuanto una moneda se puede comprar, cada precio en placas se convierte
   en un precio en euros disfrazado, y esto es un juego de lógica, no un
   bazar. Lo único de pago es la Colección Oro, cerrada y aparte. */
const AV = window.AsesiAvatar;
const owned = () => (store.owned = store.owned || []);
const myAvatar = () => (store.avatar = store.avatar ||
                        Object.assign({}, AV.DEFAULT_AVATAR));
function hasItem(id){
  const it = AV.BYID[id];
  if(!it) return false;
  if(it.src === 'inicio') return true;
  if(it.src === 'oro') return !!store.oro;
  return owned().indexOf(id) >= 0;
}
function equipItem(id){
  const it = AV.BYID[id];
  if(!it || !hasItem(id)) return false;
  myAvatar()[it.slot] = id;
  save();
  return true;
}
function buyItem(id){
  const it = AV.BYID[id];
  if(!it || hasItem(id)) return 'ya';
  const coste = it.src && it.src.placas;
  if(!coste) return 'novale';                 /* logro, anuncio u oro: no se compra */
  if((store.placas || 0) < coste) return 'faltan';
  store.placas -= coste;
  owned().push(id);
  save();
  return true;
}
/* nombre de un accesorio o un logro en el idioma que toque */
const itName = it => (LANG === 'en' && it.en) ? it.en : it.n;
const achvName = (fam, t) => {
  /* el escalón 1 tiene forma singular propia: «1 domingos extremos» no es
     un logro, es una errata enmarcada */
  if(t === 1 && fam.n1) return (LANG === 'en' && fam.en1) ? fam.en1 : fam.n1;
  return ((LANG === 'en' && fam.en) ? fam.en : fam.n).replace('{n}', t);
};

/* ── las medidas: qué llevas hecho, contado desde la partida ──────────── */
const soloCasos = () => Object.keys(store.cases)
  .filter(k => /^\d+$/.test(k) && store.cases[k].solved);
const MEASURE = {
  racha:    () => bestStreak(),
  casos:    () => soloCasos().length,
  diario:   () => dailySolved(),
  domingos: () => DAILY_DATES.filter(d => DAILY[d].wd === 6 && daySolved(d, 'x')).length,
  extremos: () => soloCasos().filter(k => (ALLCASES[k] || {}).tier === 'extremo').length,
  casi:     () => soloCasos().filter(k => (ALLCASES[k] || {}).almost).length,
  limpio:   () => soloCasos().filter(k => !(store.cases[k].hints)).length,
  certero:  () => soloCasos().filter(k => !(store.cases[k].fails)).length,
  carreras: () => (store.raceLog || []).length,
  extrema:  () => (store.raceLog || []).filter(r => r.kind === 'extrema').length,
  duelos:   () => duels().filter(d => d.mine).length,
  duelosg:  () => duels().filter(d => duelWinner(d) === 'yo').length,
  grupo:    () => groups().length ? 1 : 0,
  temporadas: () => groups().reduce((a, g) =>
                a + (g.history || []).filter(h => h.winner === me().id).length, 0),
  niveles:  () => new Set(soloCasos().map(k => (ALLCASES[k] || {}).tier)
                          .filter(Boolean)).size,
  veloz:    () => { const ts = soloCasos().map(k => store.cases[k].ms)
                      .filter(ms => ms > 3000);
                    return ts.length ? Math.round(Math.min(...ts) / 1000) : 0; },
  aprendiz: () => (store.tutor || 0) >= 3 ? 1 : 0,
  /* el modo sudoku mide desde su propio almacén; sin él, todo da cero */
  sudokus:  () => { const s = (store.sud || {}).cases || {}; let n = 0;
                    for(const k in s) if(s[k].solved) n++; return n; },
  sudiario: () => Object.keys((store.sud || {}).days || {}).length,
  sudlimpio: () => { const s = (store.sud || {}).cases || {}; let n = 0;
                     for(const k in s) if(s[k].solved && !s[k].fails) n++; return n; },
  sudveloz: () => { const s = (store.sud || {}).cases || {}; let best = 0;
                    for(const k in s){ const c = s[k];
                      if(c.solved && c.ms > 3000){ const t = Math.round(c.ms / 1000);
                        if(!best || t < best) best = t; } }
                    return best; },
  sudcarreras: () => ((store.sud || {}).raceLog || []).length,
};

/* La reseña de la App Store se pide poco, tarde y en el mejor momento:
   justo después de cerrar un caso, y sólo en tres hitos de la partida.
   Apple raciona el diálogo por su cuenta (3 al año); esto lo raciona más. */
function pedirValoracion(){
  if(!window.AsesiNative || !AsesiNative.review) return;
  const hitos = [10, 60, 200], n = solvedCount();
  const hechos = store.rated || [];
  const h = hitos.find(x => n >= x && hechos.indexOf(x) < 0);
  if(h === undefined) return;
  hechos.push(h); store.rated = hechos; save();
  AsesiNative.review();
}

/* Se llama al cerrar un caso, al acabar un desafío y al abrir el perfil:
   recorre las familias, celebra lo nuevo, paga las placas y entrega los
   accesorios exclusivos. Idempotente: lo ya celebrado no se repite. */
function checkAchv(){
  if(!AV) return [];
  store.achv = store.achv || {};
  const nuevos = [];
  for(const fam of AV.ACHV){
    const medir = MEASURE[fam.fam];
    if(!medir) continue;
    const val = medir();
    fam.tiers.forEach((t, i) => {
      const id = fam.fam + '.' + t;
      if(store.achv[id]) return;
      const logrado = AV.DESCENDING[fam.fam] ? (val > 0 && val <= t) : (val >= t);
      if(!logrado) return;
      store.achv[id] = todayISO();
      store.placas = (store.placas || 0) + fam.pts[i];
      const regalo = (fam.items || {})[t];
      if(regalo && owned().indexOf(regalo) < 0) owned().push(regalo);
      nuevos.push({ fam, t, pts: fam.pts[i], regalo });
    });
  }
  if(nuevos.length){
    save();
    /* los avisos salen en fila, no amontonados; y si caen muchos de golpe
       —la primera vez tras actualizar— se enseñan tres y un resumen */
    const avisos = nuevos.slice(0, 3).map(x =>
      '🏅 ' + achvName(x.fam, x.t) + ' · +' + x.pts + ' ' + T('placas')
      + (x.regalo ? ' · ' + T('achvGift', {i: itName(AV.BYID[x.regalo])}) : ''));
    if(nuevos.length > 3)
      avisos.push(T('achvMore', {n: nuevos.length - 3,
        p: nuevos.slice(3).reduce((a, x) => a + x.pts, 0)}));
    avisos.forEach((m, i) => setTimeout(() => flashTop(m), i * 2600));
  }
  return nuevos;
}
const achvDone = () => Object.keys(store.achv || {}).length;

let adOpen = false;
/* `premio` distingue el anuncio voluntario (el pase semanal) del forzoso:
   cambia el rótulo y el pie —quien lo PIDIÓ no necesita que le vendan la
   versión sin anuncios en ese momento— pero el mecanismo es el mismo. */
function showAd(after, premio, motivo){
  if(adOpen || isPro()){ if(after) after(); return; }
  /* En la app, el anuncio es de verdad: AdMob a través del puente nativo.
     El intersticial cumple aunque falle (no se castiga al jugador por un
     fallo de red); la recompensa SOLO premia si el vídeo premió. El cajón
     dibujado de abajo queda para la web y el visor, donde no hay AdMob. */
  const N = window.AsesiNative && window.AsesiNative.ads;
  if(N){
    adOpen = true;
    const fin = ok => {
      adOpen = false;
      if(premio){
        if(ok){ if(after) after(); }
        else flashTop(T("adNoFill"));
        return;
      }
      if(after) after();
    };
    (premio ? N.rewarded() : N.interstitial()).then(fin, () => fin(false));
    return;
  }
  adOpen = true;
  const prev = document.activeElement;
  const el = document.createElement("div");
  el.className = "adfull";
  el.id = "adfull";
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-modal", "true");
  el.setAttribute("aria-label", T(premio ? "adRewardTitle" : "adTitle"));
  el.innerHTML = `<div class="adbox">
    <p class="adtag ui">${T(premio ? "adRewardTitle" : "adTitle")}</p>
    <div class="adbody"><p>${T("adNote")}</p></div>
    <p class="adwhy">${T(premio ? "adRewardWhy" : (motivo || "adWhy"))}</p>
    <div class="row">
      ${premio ? "" : `<button class="btn primary" id="ad-pro">${T("adNever")}</button>`}
      <button class="btn${premio ? " primary" : ""}" id="ad-x" disabled>${T("adCount", {n: 5})}</button>
    </div></div>`;
  document.body.appendChild(el);
  const x = el.querySelector("#ad-x");
  let n = 5;
  const t = setInterval(() => {
    n--;
    if(n > 0){ x.textContent = T("adCount", {n}); return; }
    clearInterval(t);
    x.disabled = false; x.textContent = T("adClose"); x.focus();
  }, 1000);
  function cerrar(){
    clearInterval(t); el.remove(); adOpen = false;
    try { if(prev && prev.focus) prev.focus(); } catch(e){}
    if(after) after();
  }
  x.onclick = cerrar;
  const compra = el.querySelector("#ad-pro");
  if(compra) compra.onclick = () => { cerrar(); openPro(); };
  /* mientras corre la cuenta atrás el escape no vale: si valiera, el anuncio
     no existiría. Cuando el botón se abre, sí. */
  el.onkeydown = e => { if(e.key === "Escape" && !x.disabled) cerrar(); };
  /* el foco no sale de aquí mientras esté abierto */
  el.addEventListener("keydown", e => {
    if(e.key !== "Tab") return;
    const f = [...el.querySelectorAll("button:not([disabled])")];
    if(!f.length) { e.preventDefault(); return; }
    const i = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  });
  setTimeout(() => { const b = el.querySelector("#ad-pro") || x; if(b) b.focus(); }, 30);
}

/* ── diálogos propios ────────────────────────────────────────────────────
   confirm/prompt del navegador no funcionan en todos los sitios donde vive
   el juego: el visor incrustado los bloquea y devuelven «no» al instante,
   con lo que botones enteros parecían muertos. El juego pregunta con su
   propia ventana y devuelve promesas.
   · uiConfirm(msg)        -> true / false
   · uiPrompt(msg, valor)  -> texto / null
   · uiAlert(msg)          -> al cerrar                                    */
function uiAsk(msg, opts){
  opts = opts || {};
  return new Promise(res => {
    const prev = document.activeElement;
    const el = document.createElement("div");
    el.className = "askover";
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-modal", "true");
    el.innerHTML = `<div class="askbox">
      <p class="askmsg">${esc(msg)}</p>
      ${opts.input ? `<input class="askin" id="ask-in" autocomplete="off">` : ""}
      <div class="row">
        <button class="btn primary" id="ask-ok">${T("askOk")}</button>
        ${opts.alert ? "" : `<button class="btn ghost" id="ask-no">${T("askNo")}</button>`}
      </div></div>`;
    document.body.appendChild(el);
    const inp = el.querySelector("#ask-in");
    if(inp && opts.def != null) inp.value = String(opts.def);
    const fin = v => {
      el.remove();
      try { if(prev && prev.focus) prev.focus(); } catch(e){}
      res(v);
    };
    el.querySelector("#ask-ok").onclick = () => fin(opts.input ? inp.value : true);
    const no = el.querySelector("#ask-no");
    if(no) no.onclick = () => fin(opts.input ? null : false);
    el.onkeydown = e => {
      if(e.key === "Escape"){ e.preventDefault(); fin(opts.alert ? true : opts.input ? null : false); }
      if(e.key === "Enter" && opts.input){ e.preventDefault(); fin(inp.value); }
    };
    setTimeout(() => { (inp || el.querySelector("#ask-ok")).focus(); if(inp) inp.select(); }, 30);
  });
}
const uiConfirm = msg => uiAsk(msg);
const uiPrompt = (msg, def) => uiAsk(msg, {input: true, def});
const uiAlert = msg => uiAsk(msg, {alert: true});

/* ══════════════════════════════════════════════════════ CONTRARRELOJ ═════
   Dos modos, y la diferencia entre ellos no es de tamaño sino de sentido:

   · Carrera del día — cuatro casos FIJADOS POR LA FECHA, los mismos para todo
     el mundo. Una clasificación sobre casos aleatorios no compara nada: mide
     a quién le tocaron los fáciles. Por eso la general sólo admite esta.
   · Libre — eliges tú, de uno a veinte, del nivel que quieras. Cronometrada
     igual y con su marca personal, pero fuera de la clasificación general,
     porque nadie corrió tu carrera.

   Una carrera no toca el progreso del expediente: usa su propio tablero, con
   la clave «r:<id>». Así rejugar un caso que ya cerraste empieza en blanco y
   no te lo desmarca. */
const RACE_KEY = id => "r:" + id;
const RACE_SIZE = 4;

/* mezcla determinista a partir de una semilla de texto */
function seedRnd(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; };
}

/* Los cuatro casos son DISTINTOS para cada jugador. Repartir los mismos a
   todos invitaba a mirar los de otro y correr con ventaja, así que en vez de
   fijar los casos se fija la FORMA: cada puesto se sortea dentro de una banda
   estrecha de dificultad, de modo que dos carreras distintas pesen lo mismo.
   Las bandas se eligieron mirando el reparto real del fondo: dentro de cada
   una todos los casos comparten nivel y puntuación, así que la variación que
   queda es la que hay entre dos casos del mismo nivel, no entre niveles. */
const BANDS = {
  facil:   c => c.tier === "inicio"  && diffOf(c) === 1,
  medio:   c => c.tier === "experto" && diffOf(c) === 3,
  dificil: c => c.tier === "maestro" && diffOf(c) === 4,
  muyduro: c => c.tier === "sinley"  && diffOf(c) === 4,
  extremo: c => c.tier === "extremo" && diffOf(c) >= 4,
};
const RACE_KINDS = {
  /* fácil · medio · difícil · muy difícil, sin llegar a extremo */
  normal:  ["facil", "medio", "dificil", "muyduro"],
  /* la misma escalera, pero el último es de los extremos */
  extrema: ["facil", "medio", "dificil", "extremo"],
};
let BANDPOOL = null;
function bandPool(){
  if(BANDPOOL) return BANDPOOL;
  BANDPOOL = {};
  /* Sólo el fondo libre, TAMBIÉN para quien tiene Pro. No es un descuido:
     una carrera o un duelo sorteados sobre los mil dejaría a la mitad de la
     liga con casos que no puede abrir, y de paso convertiría la compra en
     ventaja competitiva. Los quinientos de pago son para el expediente. */
  for(const k in BANDS)
    BANDPOOL[k] = CASES.filter(BANDS[k]).filter(c => freeSet().has(String(c.id)));
  return BANDPOOL;
}
/* Una carrera nueva cada vez: el sorteo no se repite ni se puede copiar.
   El contador va aparte del reloj a propósito: `performance.now()` viene
   engordado en algunos navegadores para que no se pueda medir el tiempo con
   precisión, así que dos sorteos seguidos podían caer en la misma semilla. */
let drawN = 0;
function raceDraw(kind){
  const pools = bandPool();
  const rnd = seedRnd("c" + Date.now() + ":" + (++drawN) + ":"
                      + Math.random().toString(36).slice(2) + kind);
  const out = [];
  for(const banda of (RACE_KINDS[kind] || RACE_KINDS.normal)){
    const list = pools[banda];
    let id, guard = 0;
    do { id = list[Math.floor(rnd() * list.length)].id; }
    while(out.indexOf(id) >= 0 && ++guard < 40);
    out.push(id);
  }
  return out;
}
function raceReset(){ store.race = null; save(); }
function raceElapsed(){
  const r = store.race;
  if(!r) return 0;
  return r.ms + (r.running && !r.paused ? Date.now() - r.t0 : 0);
}
/* El reloj sólo corre con el tablero delante. Salir de la carrera —al menú,
   a otra pestaña, la app al fondo— lo deja en pausa; volver al caso lo
   arranca de nuevo. Nadie pierde una marca por atender una llamada. */
function racePause(){
  const r = store.race;
  if(r && r.running && !r.paused){ r.ms = raceElapsed(); r.paused = true; save(); }
}
function raceResume(){
  const r = store.race;
  if(r && r.running && r.paused){ r.paused = false; r.t0 = Date.now(); save(); }
}
/* si la app murió sin despedirse, el rato perdido no se cobra */
if(store.race && store.race.running && !store.race.paused){
  store.race.paused = true; save();
}
function raceStart(ids, kind, iso, extra){
  store.race = {ids: ids.slice(), i: 0, splits: [], hints: 0,
                ms: 0, t0: Date.now(), running: true, kind, iso: iso || null};
  if(extra) Object.assign(store.race, extra);
  ids.forEach(id => { delete store.cases[RACE_KEY(id)]; });
  save();
}
function raceSplit(){
  const r = store.race;
  if(!r) return;
  const total = raceElapsed();
  const antes = r.splits.reduce((a,b) => a + b, 0);
  r.splits.push(Math.max(0, total - antes));
  r.ms = total; r.t0 = Date.now();
  r.i++;
  if(r.i >= r.ids.length){ r.running = false; r.done = true; }
  save();
}
/* mejores marcas por número de casos, guardadas aparte del resto */
function raceBest(kind, n){
  const b = (store.bests || {})[kind + ":" + n];
  return b || null;
}
function raceSaveBest(kind, n, ms, hints){
  store.bests = store.bests || {};
  const k = kind + ":" + n, cur = store.bests[k];
  if(!cur || ms < cur.ms){ store.bests[k] = {ms, hints, when: todayISO()}; save(); return true; }
  return false;
}

/* ═══════════════════════════════════════════════════════════ DUELOS ══════
   Uno contra uno, fuera de la liga de grupo y fuera de la general. Dos formas
   de conseguir rival, y la diferencia entre ellas importa:

   · Privado — eliges la forma de la carrera, el juego escupe un código y se lo
     pasas a quien quieras. Funciona hoy, sin cuentas y sin servidor.
   · Al azar — el servidor te empareja con quien haya pedido la misma carrera.
     Eso sí necesita servidor; mientras no lo haya, la interfaz lo dice en vez
     de fingir que busca rival.

   Aquí los DOS juegan los mismos casos, justo al revés que en la carrera del
   día. No es una contradicción: en una clasificación general repartir lo mismo
   a todo el mundo invita a mirar la pantalla del de al lado, pero un duelo sin
   casos comunes no compara nada. Lo que compensa el riesgo es que un duelo se
   corre entre dos que han quedado para eso.

   El código no lleva los casos, lleva la SEMILLA: los dos la siembran y les
   sale el mismo sorteo. El parte de resultado la lleva también, así que no se
   puede colar el tiempo de un duelo dentro de otro. */
const DUEL_SIZES = [1, 3, 5];
const DUEL_BANDS = ["facil", "medio", "dificil", "extremo"];

function duelDraw(seed, n, band){
  const list = bandPool()[band] || bandPool().facil;
  const rnd = seedRnd("d:" + seed + ":" + band + ":" + n);
  const out = [];
  let guard = 0;
  while(out.length < Math.min(n, list.length) && ++guard < 600){
    const id = list[Math.floor(rnd() * list.length)].id;
    if(out.indexOf(id) < 0) out.push(id);
  }
  return out;
}
const duelCode = d => ["ASD3", d.seed, d.n, DUEL_BANDS.indexOf(d.band)].join(".");
function duelParse(txt){
  const m = String(txt || "").trim().toUpperCase()
    .match(/ASD3[.\-]([A-Z0-9]{6})[.\-](\d)[.\-]([0-3])/);
  if(!m || DUEL_SIZES.indexOf(+m[2]) < 0) return null;
  return {seed: m[1], n: +m[2], band: DUEL_BANDS[+m[3]]};
}
const duels = () => (store.duels = store.duels || []);
const duelBy = seed => duels().find(d => d.seed === seed);
/* treinta duelos de historial: más no se mira y ocupa sitio */
function duelKeep(d){ duels().unshift(d); store.duels = duels().slice(0, 30); save(); return d; }
function duelNew(n, band, mode){
  return duelKeep({seed: newCode(6), n, band, mode: mode || "priv", host: 1,
                   when: todayISO(), mine: null, rival: null});
}
/* un código que llega de fuera: se adopta tal cual, sin tocar la semilla */
function duelAdopt(p, mode){
  return duelBy(p.seed) || duelKeep({seed: p.seed, n: p.n, band: p.band,
    mode: mode || "priv", host: 0, when: todayISO(), mine: null, rival: null});
}
const duelPart = d => ["ASR3", d.seed, me().id, Math.round(d.mine.ms / 1000),
  d.mine.hints, meName().replace(/[^\p{L}\p{N} ]/gu, "").slice(0, 14) || "?"].join(".");
function duelPartParse(txt){
  const m = String(txt || "").trim().match(
    /ASR3\.([A-Z0-9]{6})\.([A-Z0-9]+)\.(\d+)\.(\d+)\.(.+)$/u);
  if(!m) return null;
  return {seed: m[1], pid: m[2], ms: +m[3] * 1000, hints: +m[4], name: m[5].trim()};
}
function duelPost(d, pid, name, ms, hints){
  if(pid === me().id) return false;              /* tu propio parte no cuenta */
  /* En el duelo al azar el rival queda apuntado al emparejar, con el tiempo
     todavía vacío, y su tiempo llega después por el servidor. Un rival con
     tiempo vacío se COMPLETA (si es él); uno con tiempo puesto no se pisa.
     El primer duelPost de la historia rechazaba cualquier segundo parte, y
     eso dejaba el marcador del duelo al azar esperando para siempre. */
  if(d.rival && d.rival.ms != null) return false;         /* ya hay resultado */
  if(d.rival && d.rival.pid && d.rival.pid !== pid) return false;  /* otro */
  d.rival = {pid, name: name || (d.rival && d.rival.name) || pid, ms, hints};
  save();
  return true;
}
/* Gana quien menos tarda. A igual tiempo gana quien pidió menos pistas, y si
   también empatan, es empate: inventar un tercer criterio sería inventarse un
   ganador. */
function duelWinner(d){
  if(!d || !d.mine || !d.rival) return null;
  if(d.mine.ms !== d.rival.ms) return d.mine.ms < d.rival.ms ? "yo" : "rival";
  if(d.mine.hints !== d.rival.hints) return d.mine.hints < d.rival.hints ? "yo" : "rival";
  return "empate";
}
const duelLabel = d => T("duelShape", {n: d.n, b: T("band_" + d.band)});

/* ── el único punto por donde saldrá algo a un servidor ──────────────────
   Igual que `Shop` con el cobro: toda la red del juego pasa por aquí. Hoy
   `online` es false y todo lo demás rechaza, así que la interfaz sabe que no
   hay servidor y lo dice; el día que lo haya se cambian estas cuatro
   funciones y ni una vista más.

   `AsesiNet` lo inyecta el arranque cuando se configure el servidor: así el
   mismo fichero sirve para el sitio con backend y para el suelto de siempre. */
const Net = {
  get online(){ return !!window.AsesiNet; },
  /* pedir rival: devuelve {seed, n, band, rival} cuando empareja */
  match(n, band){
    return window.AsesiNet ? window.AsesiNet.match(n, band, me())
                           : Promise.reject(new Error("sin servidor"));
  },
  cancel(){ return window.AsesiNet ? window.AsesiNet.cancel() : Promise.resolve(); },
  /* mandar el resultado de un duelo y recoger el del rival si ya está */
  report(seed, ms, hints){
    return window.AsesiNet ? window.AsesiNet.report(seed, ms, hints, me())
                           : Promise.reject(new Error("sin servidor"));
  },
  /* clasificación general y de amigos */
  push(what){ if(window.AsesiNet) window.AsesiNet.push(what, me()); },
};
const dailySolved = () => DAILY_DATES.reduce((a,d) =>
  a + TRACKS.filter(k => daySolved(d, k)).length, 0);

/* deshacer / rehacer */
let UNDO = {}, REDO = {};
const snapshot = id => { const s = cs(id);
  return JSON.stringify({p:s.p, v:s.v, notes:s.notes, x:s.x, hyp:s.hyp, sealed:s.sealed, auto:s.auto}); };
function pushUndo(id){
  (UNDO[id] = UNDO[id] || []).push(snapshot(id));
  if(UNDO[id].length > 240) UNDO[id].shift();
  REDO[id] = [];
}
function applySnap(id, snap){
  const s = cs(id), o = JSON.parse(snap);
  s.p=o.p; s.v=o.v; s.notes=o.notes; s.x=o.x; s.hyp=o.hyp; s.sealed=o.sealed; s.auto=o.auto;
}
function undo(id){ if(!UNDO[id] || !UNDO[id].length) return false;
  (REDO[id] = REDO[id] || []).push(snapshot(id)); applySnap(id, UNDO[id].pop()); save(); return true; }
function redo(id){ if(!REDO[id] || !REDO[id].length) return false;
  (UNDO[id] = UNDO[id] || []).push(snapshot(id)); applySnap(id, REDO[id].pop()); save(); return true; }

/* ═══════════════════════════════════════════════════════════════ AUDIO ═══ */
const Audio_ = (() => {
  let ctx = null, chain = 0;
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19];
  const on = () => store.opts.sound !== false;
  function ac(){
    if(!on()) return null;
    if(!ctx){ try { ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return null; } }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(f, t0, dur, type, gain, glide){
    const c = ac(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t0);
    if(glide) o.frequency.exponentialRampToValueAtTime(glide, t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + .02);
  }
  function noise(t0, dur, gain, freq){
    const c = ac(); if(!c) return;
    const n = c.sampleRate * dur, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = c.createBufferSource(); src.buffer = b;
    const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq||1600; f.Q.value = 1.1;
    const g = c.createGain(); g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(c.destination); src.start(t0); src.stop(t0 + dur);
  }
  return {
    resetChain(){ chain = 0; },
    place(){ const c = ac(); if(!c) return; const t = c.currentTime;
      noise(t, .045, .05, 2400);
      tone(220 * Math.pow(2, SCALE[Math.min(chain, SCALE.length-1)]/12), t, .26, "triangle", .07);
      chain = Math.min(chain + 1, SCALE.length - 1); },
    lift(){ const c = ac(); if(!c) return; noise(c.currentTime, .04, .035, 1200);
      chain = Math.max(0, chain - 1); },
    mark(){ const c = ac(); if(!c) return; noise(c.currentTime, .026, .028, 3200); },
    bad(){ const c = ac(); if(!c) return; const t = c.currentTime; chain = 0;
      tone(146.8, t, .3, "sine", .05); tone(155.6, t, .3, "sine", .045); },
    warn(){ const c = ac(); if(!c) return; const t = c.currentTime; chain = 0;
      tone(392, t, .16, "triangle", .05); tone(370, t + .13, .26, "triangle", .045); },
    seal(){ const c = ac(); if(!c) return; const t = c.currentTime;
      noise(t, .09, .07, 700); tone(330, t + .02, .5, "sine", .06); tone(495, t + .05, .45, "sine", .035); },
    hint(){ const c = ac(); if(!c) return; tone(587, c.currentTime, .18, "sine", .04, 784); },
    win(){ const c = ac(); if(!c) return; const t = c.currentTime; chain = 0;
      [261.6, 329.6, 392, 523.3].forEach((f,i) => tone(f, t + i*.085, .62 - i*.06, "triangle", .07));
      tone(130.8, t, .8, "sine", .05); }
  };
})();
/* La vibración. En Android la da el navegador; en el WKWebView de iOS
   `navigator.vibrate` no existe y la pone el puente nativo (Taptic). El
   patrón se reduce a suave/medio/fuerte: es lo que distingue un motor Taptic
   y es lo único que el jugador nota de verdad. */
function buzz(p){
  if(store.opts.sound === false) return;
  try {
    const nat = window.AsesiNative && window.AsesiNative.haptic;
    if(nat){
      const total = Array.isArray(p) ? p.reduce((a,b) => a + b, 0) : p;
      nat(total >= 120 ? "heavy" : total >= 60 ? "medium" : "light");
      return;
    }
    if(navigator.vibrate) navigator.vibrate(p);
  } catch(e){}
}

/* ═════════════════════════════════════════════════════ RACHA Y ARCHIVO ══ */
/* Un día cuenta para la racha si cerraste cualquiera de sus dos casos. Exigir
   el extremo convertiría la racha en un peaje; exigir sólo el fácil la haría
   trivial para quien juega el duro. */
function markDay(iso){
  const d = iso || todayISO();
  if(!store.days.includes(d)){ store.days.push(d); store.days.sort(); save(); }
}
function monthKey(){ return todayISO().slice(0,7); }
function freezesLeft(){
  if(store.freezes.month !== monthKey()){ store.freezes = {n:2, month:monthKey()}; save(); }
  return store.freezes.n;
}
/* la racha admite hasta dos huecos al mes: se congelan solos, sin pedir nada */
function streak(){
  if(!store.days.length) return 0;
  const set = new Set(store.days);
  let n = 0, frozen = 0, budget = freezesLeft();
  const d = new Date();
  const iso = x => x.getFullYear()+"-"+pad2(x.getMonth()+1)+"-"+pad2(x.getDate());
  if(!set.has(iso(d))) d.setDate(d.getDate()-1);
  for(let i=0;i<800;i++){
    if(set.has(iso(d))) n++;
    else if(budget > 0 && n > 0){ budget--; frozen++; }
    else break;
    d.setDate(d.getDate()-1);
  }
  streak.frozen = frozen;
  return n;
}
function bestStreak(){
  if(!store.days.length) return 0;
  const ds = store.days.slice().sort();
  let best = 1, cur = 1;
  for(let i=1;i<ds.length;i++){
    const a = new Date(ds[i-1]+"T00:00:00Z"), b = new Date(ds[i]+"T00:00:00Z");
    cur = ((b-a)/86400000 === 1) ? cur+1 : 1;
    best = Math.max(best, cur);
  }
  return best;
}

/* ─────────────────────────────────────────────── dificultad declarada ────
   El generador ya sabe qué técnicas exige cada caso: están en la cadena de
   deducción. Publicarlo convierte el cuaderno en un mapa —sabes qué te falta
   aprender y qué caso te lo va a enseñar— y sustituye el «8×8» por algo que
   de verdad dice cuánto cuesta. No delata nada: son los nombres de las
   herramientas, no dónde va nadie. */
const TECH_HARD = {unaria:0, linea:1, arco:1, oculto:2, recuento:2, asesino:2,
                   solas:3, salas:3, "linea-vacia":3, rasgo:3, testigo:4, bloqueado:4};
function techsOf(C){
  if(C && C.techs) return C.techs;          /* ya viene del índice */
  const seen = [];
  ((C && C.hints) || []).forEach(h => { if(seen.indexOf(h.tech) < 0) seen.push(h.tech); });
  return seen;
}
/* De 1 a 5. Los cortes están calibrados contra los cinco niveles del
   expediente: Iniciación sale 1, Investigación 2, Experto 3, Maestro 4 y Sin
   ley 5, y el diario recorre de 1 el lunes a 4 el domingo. Lo que de verdad
   separa un caso de otro no es la técnica más dura —casi todos llegan a la
   misma— sino el tamaño, cuántas técnicas distintas hacen falta y cuántos
   pasos exigen cruzar dos pistas en vez de leer una. */
const DIFF_CUT = [2.0, 3.2, 4.6, 5.85];
function diffOf(C){
  if(C && C.diff) return C.diff;             /* calculada al montar el sitio */
  const t = techsOf(C);
  const hard = t.reduce((a,k) => Math.max(a, TECH_HARD[k] === undefined ? 2 : TECH_HARD[k]), 0);
  const cross = (C.hints || []).reduce((a,h) => a + ((h.clues||[]).length > 1 ? 1 : 0), 0);
  const score = (C.R - 5) * 0.9 + (t.length - 2.5) * 0.5 + cross * 0.25 + hard * 0.3;
  let n = 1; while(n <= 4 && score >= DIFF_CUT[n-1]) n++;
  return n;
}
const diffDots = n => "●".repeat(n) + "○".repeat(5 - n);
/* del índice si sólo está la ficha, del caso si ya llegó entero */
const nsus = c => c.nsus !== undefined ? c.nsus
               : (c.suspects ? c.suspects.length : Math.min(c.R, c.C) - 1);
function techNames(C){
  const tab = (I18.TECH[LANG] || I18.TECH.es);
  return techsOf(C).map(k => (tab[k] || [k])[0]);
}

  };
  if(isFull(C)) o.X = I18.ctx(C, L);

}

/* ═══════════════════════════════════════════════════════════════ VISTAS ══ */
const app = document.getElementById("app");
let view = {name:"index"};
let timerId = null, tickStart = 0;

function render(){
  clearInterval(timerId); timerId = null;
  /* cualquier vista que no sea el tablero de la carrera en curso la pausa */
  if(store.race && store.race.running &&
     !(view.name === "case" && view.r && store.race.ids[store.race.i] === view.id))
    racePause();
  if(window.AsesiSudoku && AsesiSudoku.pauseRace) AsesiSudoku.pauseRace(view);
  if(view.name === "index") renderIndex();
  else if(view.name === "daily") renderDaily();
  else if(view.name === "learn") renderLearn();
  else if(view.name === "race") renderRace();
  else if(view.name === "sud" || view.name === "sudcase"){
    if(window.AsesiSudoku) AsesiSudoku.render(view);
  }
  else renderCase(view.id);
  refreshChrome();
  /* al llegar a una portada —fin de la cadena de puzzles— se cobra el
     anuncio armado; con un tablero delante, jamás */
  if(view.name !== "case" && view.name !== "sudcase") adBreak();
}
const hashFor = v => v.name === "case"
                     ? (v.d ? "#dia-" + v.d + "-" + v.k : "#caso-" + v.id)
                   : v.name === "daily" ? "#diario"
                   : v.name === "learn" ? "#aprender"
                   : v.name === "race" ? "#contrarreloj"
                   : v.name === "sud" ? "#sudoku" + (v.tab ? "-" + v.tab : "")
                   : v.name === "sudcase" ? "#sudoku-" + v.id : "#expediente";
function go(v, top){
  view = v;
  if(top !== false) window.scrollTo({top:0, behavior:"instant"});
  render();
  const h = hashFor(v);
  /* Cada vista entra en el historial: el botón «atrás» del navegador y el gesto
     de volver en Android salen del caso al índice, que es lo que espera todo el
     mundo. Antes se usaba replaceState y «atrás» sacaba del juego entero. */
  if(location.hash !== h) history.pushState(null, "", h);
}
/* Una invitación no es una vista, es un encargo: se recoge del enlace, se
   limpia de la barra de direcciones —para que recargar no vuelva a
   preguntar— y se atiende en cuanto la pestaña de contrarreloj está pintada. */
let PENDING = null;
function viewFromHash(){
  const h = location.hash || "";
  const gi = h.match(/^#grupo-([A-Za-z0-9]{4,10})$/);
  if(gi){ PENDING = {kind: "grupo", code: gi[1].toUpperCase()}; return {name: "race"}; }
  const di = h.match(/^#duelo-([A-Za-z0-9]{6})-(\d)-([0-3])$/);
  if(di && DUEL_SIZES.indexOf(+di[2]) >= 0){
    PENDING = {kind: "duelo", seed: di[1].toUpperCase(), n: +di[2], band: DUEL_BANDS[+di[3]]};
    return {name: "race"};
  }
  /* las invitaciones del modo sudoku llevan a su portada, que las atiende */
  const sgi = h.match(/^#sgrupo-([A-Za-z0-9]{4,10})$/);
  if(sgi){ PENDING = {kind: "sgrupo", code: sgi[1].toUpperCase()}; return {name: "sud"}; }
  const sdi = h.match(/^#sduelo-([A-Za-z0-9]{6})-(\d)-([0-2])$/);
  if(sdi && [1,3,5].indexOf(+sdi[2]) >= 0){
    PENDING = {kind: "sduelo", seed: sdi[1].toUpperCase(), n: +sdi[2],
               band: ["suave","dura","extrema"][+sdi[3]]};
    return {name: "sud"};
  }
  const dm = h.match(/^#dia-(\d{4}-\d{2}-\d{2})-([fx])$/);
  if(dm && DAILY[dm[1]]){ track = dm[2];
    return {name:"case", id: DAILY[dm[1]][dm[2]], d: dm[1], k: dm[2]}; }
  const m = h.match(/^#caso-(.+)$/);
  if(m && ALLCASES[m[1]]) return {name:"case", id:m[1]};
  if(h === "#diario") return {name:"daily"};
  if(h === "#sudoku") return {name:"sud"};
  const stab = h.match(/^#sudoku-(diario|expediente|contrarreloj|aprender)$/);
  if(stab) return {name:"sud", tab: stab[1]};
  const sm = h.match(/^#sudoku-(\d+)$/);
  if(sm) return {name:"sudcase", id:+sm[1]};
  if(h === "#expediente") return {name:"index"};
  if(h === "#aprender") return {name:"learn"};
  if(h === "#contrarreloj") return {name:"race"};
  /* quien llega por primera vez entra por el tutorial, no por un 6×6 */
  if(TUTOR.length && !store.tutor) return {name:"learn"};
  return DAILY[todayISO()] ? {name:"daily"} : {name:"index"};
}

/* plano decorativo de la portada */
/* `withTokens` sólo se activa en el escaparate del expediente, que dibuja un
   caso decorativo. En el diario iría el caso de hoy: pintar ahí las fichas
   sería regalar media solución antes de empezar. */
function heroPlan(c, withTokens){
  c = c || CASES[19] || CASES[0];
  const pw = 100 / c.C, ph = 100 / c.R;
  let out = c.rects.map((R,i) => { const [r0,c0,r1,c1] = R;
    return `<i class="${pat(i)}" style="left:${c0*pw}%;top:${r0*ph}%;width:${(c1-c0+1)*pw}%;height:${(r1-r0+1)*ph}%"></i>`;
  }).join("");
  if(!c.regions) return out;               /* sin muros hasta que llegue el caso */
  for(let r=0;r<c.R;r++) for(let q=0;q<c.C;q++){
    if(r+1<c.R && c.regions[r][q] !== c.regions[r+1][q])
      out += `<i class="w" style="left:${q*pw}%;top:calc(${(r+1)*ph}% - 2px);width:${pw}%;height:4px"></i>`;
    if(q+1<c.C && c.regions[r][q] !== c.regions[r][q+1])
      out += `<i class="w" style="top:${r*ph}%;left:calc(${(q+1)*pw}% - 2px);height:${ph}%;width:4px"></i>`;
  }
  if(withTokens){
    Object.keys(c.solution).slice(0,3).forEach(n => { const [r,q] = c.solution[n];
      out += `<span class="p" style="left:calc(${q*pw}% + ${pw*0.18}%);top:calc(${r*ph}% + ${ph*0.18}%);width:${pw*0.64}%;height:${ph*0.64}%"></span>`; });
    const [vr,vq] = c.victim.cell;
    out += `<span class="v" style="left:calc(${vq*pw}% + ${pw*0.12}%);top:calc(${vr*ph}% + ${ph*0.12}%);width:${pw*0.76}%;height:${ph*0.76}%">V</span>`;
  }
  return out;
}
function thumb(c){
  return c.rects.map((R,i) => { const [r0,c0,r1,c1] = R;
    return `<i class="${pat(i)}" style="left:${c0*100/c.C}%;top:${r0*100/c.R}%;width:${(c1-c0+1)*100/c.C}%;height:${(r1-r0+1)*100/c.R}%"></i>`;
  }).join("");
}
function tabs(active){
