    + (c.walk ? `<span><i style="background:none;border:2px dotted var(--blue)"></i>${T("walkable")}</span>` : "");


  hintLevel = 0;
  Audio_.resetChain();
  drawClues();
  refresh();
  if(s.solved) showVerdict(true);
  timerId = setInterval(() => {
    if(s.solved) return;
    const el = document.getElementById("chip-timer");
    if(el) el.textContent = fmtTime(s.ms + (Date.now() - tickStart));
  }, 1000);

  /* ───────────────────────────── geometría del cuerpo ─────────────── */
  function bodyCell(){
    const rows = new Set(), cols = new Set();
    for(const n in s.p){ rows.add(s.p[n][0]); cols.add(s.p[n][1]); }
    if(rows.size !== names.length) return null;
    const fr = [], fc = [];
    for(let i=0;i<c.R;i++) if(!rows.has(i)) fr.push(i);
    for(let i=0;i<c.C;i++) if(!cols.has(i)) fc.push(i);
    return (fr.length !== 1 || fc.length !== 1) ? null : [fr[0], fc[0]];
  }
  function bodyZone(){
    const rows = new Set(), cols = new Set();
    for(const n in s.p){ rows.add(s.p[n][0]); cols.add(s.p[n][1]); }
    if(!Object.keys(s.p).length) return [];
    const fr = [], fc = [];
    for(let i=0;i<c.R;i++) if(!rows.has(i)) fr.push(i);
    for(let i=0;i<c.C;i++) if(!cols.has(i)) fc.push(i);
    if(fr.length * fc.length > 6) return [];
    const out = []; for(const r of fr) for(const q of fc) out.push(r + "," + q);
    return out;
  }
  /* declarada, no asignada: el primer pintado ocurre más arriba en este mismo
     cuerpo y una `const` todavía estaría sin inicializar */
  function blocked(r,q){ return c.furniture.some(f => f.cell[0]===r && f.cell[1]===q && !f.walk); }

  function fitsFor(who){
    if(!who) return new Set();
    const taken = new Set(), rows = new Set(), cols = new Set();
    for(const n in s.p){ if(n === who) continue;
      taken.add(s.p[n].join(",")); rows.add(s.p[n][0]); cols.add(s.p[n][1]); }
    if(s.v && who !== VIC){ taken.add(s.v.join(",")); rows.add(s.v[0]); cols.add(s.v[1]); }
    const out = new Set();
    for(let r=0;r<c.R;r++) for(let q=0;q<c.C;q++){
      if(blocked(r,q) || taken.has(r+","+q) || rows.has(r) || cols.has(q)) continue;
      if(s.x[who] && s.x[who].includes(r+","+q)) continue;
      out.add(r+","+q);
    }
    return out;
  }
  /* El motor, sobre el tablero del jugador.
     Declaradas como funciones y no como constantes a propósito: el primer
     pintado ocurre más arriba en este mismo cuerpo y una `const` todavía no
     estaría inicializada. */
  function fixedNow(){ const f = {};
    for(const n in s.p) f[n] = s.p[n];
    if(s.v) f[c.victim.name] = s.v;
    return f; }
  function engName(n){ return n === VIC ? c.victim.name : n; }

  function clashes(){
    const all = {}; for(const n in s.p) all[n] = s.p[n];
    if(s.v) all[c.victim.name] = s.v;
    const byRow = {}, byCol = {};
    for(const n in all){
      (byRow[all[n][0]] = byRow[all[n][0]] || []).push(n);
      (byCol[all[n][1]] = byCol[all[n][1]] || []).push(n);
    }
    const out = [];
    for(const v in byRow) if(byRow[v].length > 1)
      out.push({axis:0, v:+v, who:byRow[v], label:T("clashRow",{v:+v+1})});
    for(const v in byCol) if(byCol[v].length > 1)
      out.push({axis:1, v:+v, who:byCol[v], label:T("clashCol",{v:colL(+v)})});
    return out;
  }
  function clashNames(){ const set = new Set();
    for(const cl of clashes()) cl.who.forEach(n => set.add(n)); return set; }
  function drawClashes(){
    const el = document.getElementById("clashes");
    if(!el) return;
    const list = clashes();
    if(!list.length || s.solved){ el.className = "clashbar ui"; el.innerHTML = ""; return; }
    el.className = "clashbar ui show";
    el.innerHTML = `<b>${list.length === 1 ? T("clashesOne") : T("clashesN",{n:list.length})}</b>`
      + `<ul>${list.map(cl => { const w = cl.who.map(esc); const last = w.pop();
          return `<li>${T("clashLine",{a:w.join(", "), b:last, l:cl.label})}</li>`; }).join("")}</ul>`;
  }

  /* ───────────────────────────── plano ────────────────────────────── */
  function drawGrid(){
    const g = document.getElementById("grid");
    const act = document.activeElement;
    if(act && act.classList && act.classList.contains("cell"))
      keepFocus = [+act.dataset.r, +act.dataset.q, true];
    const furn = {}; c.furniture.forEach(f => furn[f.cell.join(",")] = f);
    const occ = {}; for(const n in s.p) occ[s.p[n].join(",")] = n;
    const rowU = {}, colU = {};
    for(const n in s.p){ rowU[s.p[n][0]] = (rowU[s.p[n][0]]||0)+1; colU[s.p[n][1]] = (colU[s.p[n][1]]||0)+1; }
    if(s.v){ rowU[s.v[0]] = (rowU[s.v[0]]||0)+1; colU[s.v[1]] = (colU[s.v[1]]||0)+1; }
    const vkey = s.v ? s.v.join(",") : null;
    const bc = s.v ? s.v.slice() : bodyCell();
    const gkey = (!s.v && bc) ? bc.join(",") : null;
    const zone = s.v ? [] : bodyZone();
    const legal = (tool === "place" && sel) ? fitsFor(sel) : new Set();
    const clashRows = new Set(), clashCols = new Set();
    for(const cl of clashes()){ (cl.axis === 0 ? clashRows : clashCols).add(cl.v); }

    let html = "";
    for(let r=0;r<c.R;r++) for(let q=0;q<c.C;q++){
      const k = r+","+q, f = furn[k], who = occ[k], isV = (k === vkey);
      const cls = ["cell"];
      if(f) cls.push(f.walk ? "walkobj" : "blocked");
      if((who || isV) && (rowU[r] > 1 || colU[q] > 1)) cls.push("conflict");
      if(isV) cls.push("body");
      else if(k === gkey){ cls.push("body","ghost"); if(f && !f.walk) cls.push("bad"); }
      else if(zone.includes(k) && !who) cls.push("bodyzone");
      if(tool === "place" && sel){
        if(legal.has(k)) cls.push("legal");
        else if(!f && !who && !isV) cls.push("nofit");
      }
      if(clashRows.has(r) || clashCols.has(q)) cls.push("clashline");
      if(who && s.sealed.includes(who)) cls.push("sealed");
      let inner = "";
      if(s.hyp[k] !== undefined)
        inner += `<span class="hyp" style="background:${HYP[s.hyp[k] % HYP.length]}"></span>`;
      if(f) inner += (who || isV)
        ? `<span class="objbg">${ico(f.icon)}</span>`
        : `<span class="obj" title="${esc(lc.label(f))}">${ico(f.icon)}</span>`;
      if(cls.includes("conflict")) inner += `<span class="cbadge" aria-hidden="true">!</span>`;
      if(isV) inner += `<span class="tname" style="color:var(--accent);margin-top:0">${esc(c.victim.name)}</span>`;
      else if(who){
        const i = names.indexOf(who);
        inner += `<span class="token" style="--sc:${SC[i % SC.length]}"><b class="shape">${SHAPE[i % SHAPE.length]}</b>${c.suspects[i].emoji}</span>` +
                 `<span class="tname">${esc(who)}</span>`;
      } else {
        const nn = (s.notes[k] || []);
        /* la marca lleva la forma dentro, no sólo el color: a 10 px un punto
           de color es indistinguible para quien no separa rojo de verde */
        if(nn.length) inner += `<span class="marks">${nn.map(n => { const i = names.indexOf(n);
          return `<i style="color:${n === VIC ? "var(--accent)" : SC[i % SC.length]}" title="${esc(n===VIC?c.victim.name:n)}">${n===VIC?"V":SHAPE[i % SHAPE.length]}</i>`; }).join("")}</span>`;
        const xs = [];
        for(const n in s.x) if(s.x[n].includes(k)) xs.push(n);
        if(xs.length) inner += `<span class="xmarks">${xs.map(n =>
          `<b style="color:${n === VIC ? "var(--accent)" : SC[names.indexOf(n) % SC.length]}">✕</b>`).join("")}</span>`;
      }
      const room = lc.rooms[c.regions[r][q]];
      let what = f ? lc.label(f) : isV ? T("theBody") : who ? who : (k === gkey ? T("bodyIn",{c:ref([r,q])}) : "—");
      if(cls.includes("conflict")) what += ", " + T("clashesOne");
      html += `<button class="${cls.join(" ")}" role="gridcell" data-r="${r}" data-q="${q}" tabindex="-1"
        aria-label="${colL(q)}${r+1}, ${esc(room)}, ${esc(what)}">${inner}</button>`;
    }
    g.innerHTML = html;
    g.querySelectorAll(".cell").forEach(b => {
      b.addEventListener("click", () => onCell(+b.dataset.r, +b.dataset.q));
      b.addEventListener("contextmenu", ev => { ev.preventDefault();
        openWhyNot(+b.dataset.r, +b.dataset.q); });
      b.addEventListener("mouseenter", () => { focusCell = [+b.dataset.r, +b.dataset.q]; paintCross(); });
      b.addEventListener("mouseleave", () => { focusCell = null; paintCross(); });
      b.addEventListener("focus", () => { focusCell = [+b.dataset.r, +b.dataset.q]; paintCross(); });
    });
    const target = keepFocus ? g.querySelector(`.cell[data-r="${keepFocus[0]}"][data-q="${keepFocus[1]}"]`) : null;
    const first = target || g.querySelector(".cell");
    if(first) first.tabIndex = 0;
    if(target && keepFocus[2]) target.focus();

    const vi = document.getElementById("bodyinfo");
    const bk = bc ? bc.join(",") : null;
    const nclash = clashes().length;
    if(nclash){
      vi.textContent = nclash === 1 ? T("bodyRepeated") : T("bodyRepeatedN",{n:nclash});
      vi.style.color = "var(--amber)";
    } else if(!bc){
      const z = zone.length;
      vi.textContent = z ? T("bodyCandidates",{n:z}) : T("bodyUnplaced");
      vi.style.color = "var(--muted)";
    } else if(furn[bk] && !furn[bk].walk){
      vi.textContent = T("bodyOnObject"); vi.style.color = "var(--accent)";
    } else {
      const ri = c.regions[bc[0]][bc[1]];
      const k2 = Object.keys(s.p).filter(x => c.regions[s.p[x][0]][s.p[x][1]] === ri).length;
      vi.textContent = T("bodyAt",{r:lc.rooms[ri], n: k2 === 1 ? T("oneSuspect") : T("nSuspects",{n:k2})});
      vi.style.color = k2 === 1 ? "var(--green)" : "var(--accent)";
    }
  }
  function paintCross(){
    const g = document.getElementById("grid"); if(!g) return;
    g.querySelectorAll(".cell").forEach(b => {
      const r = +b.dataset.r, q = +b.dataset.q;
      const on = focusCell && (r === focusCell[0] || q === focusCell[1])
                 && !(r === focusCell[0] && q === focusCell[1]);
      b.classList.toggle("cross", !!on);
    });
    document.querySelectorAll(".rul span").forEach(sp => {
      const ax = +sp.dataset.ax, v = +sp.dataset.v;
      sp.classList.toggle("on", !!(focusCell && focusCell[ax] === v));
    });
    /* atenúa en el panel a quien ya no cabe en la casilla enfocada */
    if(focusCell && tool === "place"){
      const dom = E.propagate(B, c.clues, fixedNow());
      const k = E.key(focusCell[0], focusCell[1]);
      document.querySelectorAll(".sus").forEach(b => {
        const n = b.dataset.n, en = engName(n);
        const can = dom.get(en) && dom.get(en).has(k);
        b.classList.toggle("impossible", !can && !s.p[n] && !(n === VIC && s.v));
      });
    } else document.querySelectorAll(".sus.impossible").forEach(b => b.classList.remove("impossible"));
  }

  /* ───────────────────────────── panel de fichas ──────────────────── */
  function drawSuspects(){
    const wrap = document.getElementById("suspects");
    const bad = clashNames();
    const rows = c.suspects.map((x,i) => {
      const at = s.p[x.name], sealed = s.sealed.includes(x.name), cl = bad.has(x.name);
      const traits = [x.gafas ? (LANG==="en"?"glasses":"gafas") : "",
                      x.sombrero ? (LANG==="en"?"hat":"sombrero") : ""]
        .filter(Boolean).map(t => `<span class="trait ui">${t}</span>`).join("");
      return `<button class="sus${sel===x.name?" sel":""}${at?" placed":""}${sealed?" sealed":""}${cl?" clash":""}"
        data-n="${esc(x.name)}" style="--sc:${SC[i % SC.length]}" ${sealed?'aria-disabled="true"':''}>
        <span class="av"><b class="shape" style="color:${SC[i % SC.length]}">${SHAPE[i % SHAPE.length]}</b>${x.emoji}</span>
        <span class="who"><span class="nm ui">${esc(x.name)} ${traits}</span>
          <span class="rl">${esc(lc.role(x))}</span></span>
        <span class="pos mono">${at ? ref(at) : "—"}${cl ? '<span class="warn">!</span>' : ""}</span>
        <span class="kbd">${i+1}</span></button>`;
    }).join("");
    const vclash = bad.has(c.victim.name);
    wrap.innerHTML = rows + `<div class="vsep ui">${T("theVictim")}</div>
      <button class="sus${sel===VIC?" sel":""}${s.v?" placed":""}${vclash?" clash":""}"
      data-n="${VIC}" style="--sc:var(--accent)">
      <span class="av">${c.victim.emoji}</span>
      <span class="who"><span class="nm ui">${esc(c.victim.name)}</span>
        <span class="rl">${T(c.C === c.R ? "victimHint" : "victimHintFree")}</span></span>
      <span class="pos mono">${s.v ? ref(s.v) : "—"}${vclash ? '<span class="warn">!</span>' : ""}</span><span class="kbd">0</span></button>`;
    wrap.querySelectorAll(".sus").forEach(b => b.onclick = () => {
      const n = b.dataset.n;
      if(s.sealed.includes(n) || s.solved) return;
      sel = (sel === n) ? null : n; refresh();
    });
    document.getElementById("placedn").textContent =
      T("placedOf",{a:Object.keys(s.p).length, b:names.length});
    document.getElementById("vpos").textContent = s.v ? T("bodyIn",{c:ref(s.v)}) : T("bodyUnplaced");
  }

  function setStatus(){
    const el = document.getElementById("hintline");
    const placed = Object.keys(s.p).length;
    document.getElementById("b-accuse").disabled = placed < names.length || s.solved;
    const unsealed = names.filter(n => s.p[n] && !s.sealed.includes(n)).length;
    document.getElementById("b-check").disabled = unsealed < 3 || s.solved;
    document.getElementById("b-undo").disabled = !(UNDO[id] && UNDO[id].length);
    document.getElementById("b-redo").disabled = !(REDO[id] && REDO[id].length);
    document.getElementById("b-auto").textContent = s.auto ? T("autoNotesOff") : T("autoNotes");
    document.getElementById("b-why").setAttribute("aria-pressed", tool === "why" ? "true" : "false");
    if(el.dataset.sticky === "1"){ el.dataset.sticky = "0"; return; }
    el.className = "hintline ui";
    const who = sel === VIC ? T("theBody") : sel;
    if(tool === "why") el.textContent = T("whyPick");
    else if(tool === "place") el.textContent = sel ? T("selected",{w:who}) : T("pickToken");
    else if(tool === "note") el.textContent = sel ? T("noteMode",{w:who}) : T("noteNone");
    else if(tool === "x") el.textContent = sel ? T("discardMode",{w:who}) : T("discardNone");
    else el.textContent = T("colourMode");
  }
  function flash(msg, kind){
    const el = document.getElementById("hintline");
    el.className = "hintline ui" + (kind ? " " + kind : "");
    el.textContent = msg; el.dataset.sticky = "1"; say(msg);
    /* El aviso vive debajo del plano y en pantallas normales cae fuera de la
       vista: en un tablero grande el jugador acusaba, no veía nada y se
       quedaba pensando que el botón no hacía nada. Si el mensaje importa y no
       se ve, se trae a la vista. */
    if(kind !== "ok" && kind){
      const b = el.getBoundingClientRect();
      if(b.top > window.innerHeight - 40 || b.bottom < 0){
        const soft = window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        el.scrollIntoView({block:"center", behavior: soft ? "instant" : "smooth"});
      }
    }
  }
  function refresh(){ drawGrid(); drawSuspects(); drawClashes(); setStatus(); paintCross(); markBroken(); guide(); }

  /* ───────────────────────────── el tutorial guía ─────────────────────── */
  function tutorStep(){
    /* el primer paso de la cadena que el jugador todavía no ha colocado */
    for(const h of c.hints){
      const cur = h.who === c.victim.name ? s.v : s.p[h.who];
      if(!cur || cur[0] !== h.cell[0] || cur[1] !== h.cell[1]) return h;
    }
    return null;
  }
  function guide(){
    if(!isTutor) return;
    const box = document.getElementById("guide");
    if(!box) return;
    const h = tutorStep();
    const step = document.getElementById("g-step");
    const say = document.getElementById("g-say");
    const cl = document.getElementById("g-clue");
    if(!h || s.solved){
      step.textContent = "";
      say.textContent = T("tutorFinish");
      cl.hidden = true;
      box.classList.add("done");
      return;
    }
    box.classList.remove("done");
    const i = c.hints.indexOf(h);
    step.textContent = T("tutorStep", {n:i+1, t:c.hints.length});
    const esVictima = h.who === c.victim.name;
    const quien = esVictima ? T("theBody") : h.who;
    const lv = I18.hintLevels(h, lc.X, ref(h.cell));
    /* A veces la cadena resuelve el cuerpo ANTES que el último sospechoso: es
       la lección entera del «a solas», y ahí el cuerpo no cae solo todavía,
       hay que ponerlo. Decirle al jugador que se coloca solo sería mentirle
       justo en el paso que se le quiere enseñar. */
    say.textContent = esVictima
      ? (sel === VIC ? T("tutorBodyPlace") + " " + lv.l2
                     : T("tutorPickBody") + " " + T("tutorBodyWhy"))
      : (sel === h.who ? lv.l2 : T("tutorPickFirst", {w:quien}) + " " + T("tutorWho", {w:quien}));
    const q = (h.clues || []).map(k => pad2(k+1) + " · " + clueOf(c, c.clues[k]));
    cl.hidden = !q.length;
    cl.textContent = q.join("   ·   ");
  }

  /* ───────────────────────────── la lista de pistas ───────────────────── */
  function drawClues(){
    const ol = document.getElementById("clues");
    if(!ol) return;
    ol.innerHTML = c.clues.map((cl,i) =>
      `<li><button class="${s.used.includes(i)?"used":""}" data-i="${i}">
         <span class="n">${pad2(i+1)}</span><span class="tx">${esc(clueOf(c, cl))}</span>
         <span class="bang" aria-hidden="true">!</span></button></li>`).join("");
    ol.querySelectorAll("button").forEach(b => {
      const i = +b.dataset.i;
      b.onclick = () => { s.used = s.used.includes(i) ? s.used.filter(x => x !== i) : s.used.concat(i);
        save(); b.classList.toggle("used"); Audio_.mark(); };
      b.onmouseenter = () => lightClue(c, i, true);
      b.onmouseleave = () => lightClue(c, i, false);
      b.onfocus = () => lightClue(c, i, true);
      b.onblur = () => lightClue(c, i, false);
    });
    markBroken();
  }

  /* Marca en ámbar las pistas que lo colocado contradice. Nunca confirma que
     una pista se cumpla: eso sería decir «esto está bien» y el juego sella de
     tres en tres justamente para que no se resuelva probando. Sólo señala lo
     que el jugador podría ver releyendo, que es contabilidad, no deducción. */
  function markBroken(){
    const ol = document.getElementById("clues");
    if(!ol) return;
    const btns = ol.querySelectorAll("button");
    if(!s.live || s.solved){
      btns.forEach(b => b.classList.remove("broken"));
      setBrokenNote(0, false);
      return;
    }
    const fx = fixedNow();
    const br = new Set(E.brokenClues(B, c.clues, fx));
    btns.forEach(b => b.classList.toggle("broken", br.has(+b.dataset.i)));
    const global = br.size ? false : E.boardBreaks(B, c.clues, fx);
    setBrokenNote(br.size, global);
  }
  function setBrokenNote(n, global){
    const el = document.getElementById("cluefoot");
    if(!el) return;
    const msg = !s.live ? T("liveOff")
      : n ? T("clueBroken", {n})
      : global ? T("boardBroken")
      : T("clueStrike");
    el.textContent = msg;
    el.className = (n || global) ? "warnfoot" : "";
    /* el pitido sólo cuando la situación cambia, no en cada repintado */
    const now = (n || global) ? 1 : 0;
    if(now && el.dataset.warned !== "1") Audio_.warn();
    el.dataset.warned = String(now);
  }

  /* ───────────────────────────── autocandidatos ───────────────────── */
  function toggleAuto(){
    pushUndo(id);
    if(s.auto){ s.auto = false; s.notes = {}; save(); refresh(); flash(T("autoOff")); Audio_.lift(); return; }
    const { byCell } = E.candidates(B, c.clues, fixedNow());
    s.notes = {}; let n = 0;
    byCell.forEach((who, k) => {
      const r = E.rowOf(k), q = E.colOf(k);
      /* el cuerpo no se anota: no se deduce de las pistas sino del cruce que
         queda libre al final, y marcarlo en casi todas las casillas sólo
         ensuciaría el plano */
      const list = who.filter(p => p !== c.victim.name && !s.p[p]);
      if(list.length){ s.notes[r+","+q] = list; n++; }
    });
    s.auto = true; save(); refresh(); Audio_.mark();
    flash(T("autoOn",{n}));
  }

  /* ───────────────────────────── ¿por qué aquí no? ────────────────── */
  function openWhyNot(r, q){
    if(!sel){ flash(T("whyPick"), "bad"); return; }
    const who = engName(sel);
    const rs = E.whyNot(B, c.clues, who, [r, q], fixedNow());
    const cell = ref([r,q]);
    if(!rs.length){
      openSheet(T("whyNot"), `<p class="big">${T("whyFits",{w:esc(sel===VIC?c.victim.name:sel), c:cell})}</p>`);
      return;
    }
    const items = rs.map(o => {
      if(o.kind === "blocked") return `<li>${T("whyBlocked",{o: esc(LANG==="en"&&o.labelEn?o.labelEn:o.label||"")})}</li>`;
      if(o.kind === "taken") return `<li>${T("whyTaken",{w:esc(o.who)})}</li>`;
      if(o.kind === "row") return `<li>${T("whyRow",{w:esc(o.who)})}</li>`;
      if(o.kind === "col") return `<li>${T("whyCol",{w:esc(o.who)})}</li>`;
      const txt = esc(clueOf(c, c.clues[o.clue]));
      return `<li>${o.other ? T("whyClueOther",{n:o.clue+1, o:esc(o.other)}) : T("whyClue",{n:o.clue+1})}
        <div class="quote">${pad2(o.clue+1)} · ${txt}</div></li>`;
    }).join("");
    openSheet(T("whyTitle",{w: esc(sel===VIC?c.victim.name:sel), c: cell}), `<ul class="whylist">${items}</ul>`);
    Audio_.hint();
  }

  /* ───────────────────────────── interacción ─────────────────────── */
  function onCell(r,q){
    if(s.solved) return;
    /* En el tutorial no se deja colocar mal. Fuera del tutorial sí —el tablero
       es un cuaderno y probar es legítimo— pero aquí el jugador todavía no
       sabe qué está mirando y una ficha en el sitio equivocado no le enseña
       nada: le confirma que no se entera. */
    if(isTutor && tool === "place" && sel && !s.solved){
      const h = tutorStep();
      if(h){
        const quien = h.who === c.victim.name ? VIC : h.who;
        if(sel !== quien){ flash(T("tutorWho", {w: quien === VIC ? T("theBody") : h.who}), "warn"); return; }
        if(r !== h.cell[0] || q !== h.cell[1]){ flash(T("tutorWrong"), "bad"); Audio_.bad(); return; }
      }
    }
    const k = r + "," + q;
    if(tool === "why"){ openWhyNot(r,q); return; }
    if(tool === "hyp"){
      pushUndo(id);
      if(s.hyp[k] === undefined) s.hyp[k] = hypColor;
      else if(s.hyp[k] === hypColor) delete s.hyp[k];
      else s.hyp[k] = hypColor;
      save(); Audio_.mark(); drawGrid(); setStatus(); return;
    }
    if(tool === "note" || tool === "x"){
      if(!sel){ flash(T("pickFirst"), "bad"); return; }
      pushUndo(id);
      if(tool === "note"){
        const arr = s.notes[k] = s.notes[k] || [];
        const i = arr.indexOf(sel);
        if(i >= 0) arr.splice(i,1); else arr.push(sel);
        if(!arr.length) delete s.notes[k];
      } else {
        const arr = s.x[sel] = s.x[sel] || [];
        const i = arr.indexOf(k);
        if(i >= 0) arr.splice(i,1); else arr.push(k);
        if(!arr.length) delete s.x[sel];
      }
      save(); Audio_.mark(); buzz(8); drawGrid(); setStatus(); return;
    }
    if(blocked(r,q)){
      const f = c.furniture.find(o => o.cell[0]===r && o.cell[1]===q);
      flash(T("objectOccupies",{o: f ? lc.label(f) : "—"}), "bad"); Audio_.bad(); return;
    }
    if(s.v && s.v[0] === r && s.v[1] === q){
      pushUndo(id); s.v = null; sel = VIC; save(); Audio_.lift(); refresh(); return;
    }
    const here = Object.keys(s.p).find(n => s.p[n][0] === r && s.p[n][1] === q);
    if(here){
      if(s.sealed.includes(here)){ flash(T("sealedToken",{w:here})); return; }
      pushUndo(id); delete s.p[here]; sel = here; save(); Audio_.lift(); buzz(10); refresh(); return;
    }
    /* el cadáver fantasma: tocarlo lo hace de verdad, y a partir de ahí se
       mueve o se quita como cualquier ficha */
    if(!sel && !s.v){
      const bc0 = bodyCell();
      if(bc0 && bc0[0] === r && bc0[1] === q){
        pushUndo(id); s.v = [r,q]; save(); Audio_.place(); buzz(12); refresh(); return;
      }
    }
    if(!sel){ flash(T("pickFirst"), "bad"); return; }
    pushUndo(id);
    if(sel === VIC) s.v = [r,q]; else s.p[sel] = [r,q];
    if(s.x[sel]) delete s.x[sel];
    for(const kk in s.notes){ const i = s.notes[kk].indexOf(sel);
      if(i >= 0){ s.notes[kk].splice(i,1); if(!s.notes[kk].length) delete s.notes[kk]; } }
    const placedName = sel === VIC ? c.victim.name : sel;
    save(); sel = null; refresh();
    const cell = document.querySelector(`.cell[data-r="${r}"][data-q="${q}"]`);
    if(cell) cell.classList.add("pop");

    const mine = clashes().filter(cl => cl.who.includes(placedName));
    if(mine.length){
      Audio_.warn(); buzz([10,60,10]);
      const parts = mine.map(cl => T("clashWith",{l:cl.label,
        o: cl.who.filter(n => n !== placedName).join(" · ")}));
      flash(T("clash",{w:placedName, c:ref([r,q]), p:parts.join(" · ")}), "warn");
      return;
    }
    Audio_.place(); buzz(12);
    /* El cruce libre se SEÑALA, no se ocupa: antes el juego plantaba el
       cadáver solo al colocar al último sospechoso, y volvía a aparecer en
       cuanto movías cualquier ficha — imposible quitarlo para reagrupar.
       Ahora el fantasma marca el sitio y el jugador decide. */
    const bc = bodyCell();
    if(bc && !s.v && Object.keys(s.p).length === names.length)
      flash(T("allPlaced",{c:ref(bc)}), "ok");
  }

  function check(){
    const unsealed = names.filter(n => s.p[n] && !s.sealed.includes(n));
    const right = unsealed.filter(n =>
      s.p[n][0] === c.solution[n][0] && s.p[n][1] === c.solution[n][1]);
    if(right.length < 3){
      flash(T("checkFew"), "bad"); Audio_.bad(); buzz([25,45,25]); return;
    }
    pushUndo(id);
    s.sealed = s.sealed.concat(right); save();
    Audio_.seal(); buzz([12,30,12]);
    flash(right.length === 1 ? T("checkSealed1") : T("checkSealed",{n:right.length}), "ok");
    refresh();
    right.forEach(n => {
      const el = document.querySelector(`.cell[data-r="${s.p[n][0]}"][data-q="${s.p[n][1]}"]`);
      if(el) el.classList.add("sealpop");
    });
  }

  function accuse(){
    const wrong = names.filter(n => { const a = s.p[n], b = c.solution[n];
      return !a || a[0] !== b[0] || a[1] !== b[1]; }).length;
    const vbad = !!(s.v && (s.v[0] !== c.victim.cell[0] || s.v[1] !== c.victim.cell[1]));
    if(wrong === 0 && vbad){ flash(T("accuseBodyBad"), "bad"); Audio_.bad(); return; }
    if(wrong === 0){
      s.solved = true; s.v = c.victim.cell.slice();
      s.ms = (s.ms || 0) + (Date.now() - tickStart); tickStart = Date.now();
      s.sealed = names.slice(); save();
      if(isDaily) markDay(dayISO);
      Audio_.win(); buzz([15,40,15,40,60]);
      if(isTutor && tutorN >= 0 && (store.tutor || 0) <= tutorN){
        store.tutor = tutorN + 1; save();
      }
      if(race){
        race.hints += (s.hints || 0);
        raceSplit();
        Audio_.win(); buzz([15,40,15]);
        const sig = store.race && store.race.running ? store.race.ids[store.race.i] : null;
        refresh(); showVerdict(true); refreshChrome();
        /* un respiro para ver el veredicto y saltar solo al siguiente */
        setTimeout(() => { if(sig) go({name:"case", id:sig, r:1}); else go({name:"race"}); }, 1400);
        return;
      }
      refresh(); showVerdict(true); refreshChrome();
      flash(T("accuseWin"), "ok");
      /* el anuncio, después del veredicto y con un respiro: interrumpir el
         momento en que se cierra un caso sería cobrárselo dos veces */
      if(adDue(isTutor ? "tutor" : isDaily ? "daily" : "case"))
        setTimeout(() => showAd(null, false, isDaily ? "adWhyDaily" : "adWhyCase"), 1100);
      setTimeout(checkAchv, 1700);       /* los logros, tras el veredicto */
      setTimeout(pedirValoracion, 2600); /* y, muy de vez en cuando, la reseña */
      return;
    }
    s.fails = (s.fails || 0) + 1; save();
    const msg = wrong <= 2 ? T("accuseFew") : wrong <= 4 ? T("accuseMid") : T("accuseMany");
    flash(msg + " " + T("reviewClues"), "bad");
    Audio_.bad(); buzz([25,50,25]);
    const pl = document.getElementById("plan");
    pl.animate([{transform:"translateX(0)"},{transform:"translateX(-6px)"},
                {transform:"translateX(6px)"},{transform:"translateX(0)"}], {duration:220});
    setStatus();
  }

  /* ───────────────────────────── pistas graduadas ────────────────── */
  function nextHintStep(){
    for(const h of c.hints){
      const cur = h.who === c.victim.name ? s.v : s.p[h.who];
      if(!cur || cur[0] !== h.cell[0] || cur[1] !== h.cell[1]) return h;
    }
    return null;
  }
  function askHint(){
    const slot = document.getElementById("hintslot");
    const h = nextHintStep();
    if(!h){ slot.innerHTML = ""; flash(T("hintNone"), "ok"); return; }
    hintLevel = Math.min(hintLevel + 1, 4);
    if(hintLevel === 1){ s.hints = (s.hints || 0) + 1; save(); }
    Audio_.hint();
    const lv = I18.hintLevels(h, lc.X, ref(h.cell));
    let learnedNow = false;
    if(hintLevel >= 3 && store.learned.indexOf(h.tech) < 0){
      store.learned.push(h.tech); save(); learnedNow = true;
    }
    const quoted = h.clues.map(i =>
      `<div class="quote">${pad2(i+1)} · ${esc(clueOf(c, c.clues[i]))}</div>`).join("");
    let body = `<p class="lvl">${esc(lv.l1)}</p>`;
    if(hintLevel >= 2) body += `<p class="lvl">${esc(lv.l2)}</p>` + (h.clues.length ? quoted : "");
    if(hintLevel >= 3) body += `<span class="tech ui">${esc(lv.techName)}</span>`
      + (learnedNow ? `<span class="tech new ui">${T("hintTechNew")}</span>` : "")
      + `<p class="lvl">${esc(lv.l3)}</p>`;
    if(hintLevel >= 4) body += `<p class="lvl"><b>${esc(lv.l4)}</b></p>`;
    slot.innerHTML = `<div class="hintcard">
      <h3 class="ui">${T("hintLevel",{n:hintLevel})}
        <button class="btn ghost" id="hint-close" style="padding:2px 6px">✕</button></h3>
      <div class="body">${body}
        ${hintLevel < 4 ? `<button class="btn" id="hint-more" style="margin-top:12px">${T("hintMore")}</button>`
          : `<button class="btn" id="hint-apply" style="margin-top:12px">${T("hintApply")}</button>`}
      </div></div>`;
    document.getElementById("hint-close").onclick = () => { slot.innerHTML = ""; hintLevel = 0; };
    const more = document.getElementById("hint-more");
    if(more) more.onclick = askHint;
    const ap = document.getElementById("hint-apply");
    if(ap) ap.onclick = () => {
      pushUndo(id);
      if(h.who === c.victim.name) s.v = h.cell.slice(); else s.p[h.who] = h.cell.slice();
      save(); slot.innerHTML = ""; hintLevel = 0; Audio_.place(); refresh();
    };
    say(T("hintLevel",{n:hintLevel}));
  }

  /* ───────────────────────────── veredicto y repetición ──────────── */
  function showVerdict(won){
    const v = document.getElementById("verdict");
    const i = names.indexOf(c.murderer), m = c.suspects[i];
    const room = lc.rooms[c.regions[c.victim.cell[0]][c.victim.cell[1]]];
    v.innerHTML = `<p class="kicker ui">${won ? T("solved") : T("revealed")}</p>
      <h4 class="ui">${m.emoji} ${esc(m.name)}, ${esc(lc.role(m))}</h4>
      <p>${T("verdictBody",{v:esc(c.victim.name), r:esc(room), c:ref(c.victim.cell)})}</p>
      <div class="sharebox">
        <button class="btn" id="b-replay">${T("replay")}</button>
        ${won ? `<button class="btn" id="b-share">${T("copyResult")}</button>` : ""}
        ${won && isTutor ? `<button class="btn primary" id="b-next3">${
            tutorN + 1 < TUTOR.length ? T("tutorNext") : T("tutorToDaily")}</button>` : ""}
        ${won && next && !isTutor ? `<button class="btn primary" id="b-next2">${T("nextCaseBtn")}</button>` : ""}
        <span class="score mono">${T("score",{t:fmtTime(s.ms), h:s.hints||0, f:s.fails||0})}</span>
      </div>`;
    v.classList.add("show");
    document.getElementById("b-replay").onclick = () => openReplay(c, lc);
    const sh = document.getElementById("b-share");
    if(sh) sh.onclick = () => {
      /* El diario comparte fecha y dificultad, no el título: el título es el
         mismo para todos y no invita a nada, mientras que la fecha sí —es lo
         que hace que quien lo lea compare con el suyo. En el expediente el
         número de caso hace ese papel. */
      const steps = c.hints.length;
      const bar = "▪".repeat(Math.max(1, steps - (s.hints||0))) + "▫".repeat(Math.min(steps, s.hints||0));
      const head = isDaily
        ? `ASESIDOKU · ${dayISO} · ${T(dayTrack === "x" ? "trackHard" : "trackEasy")} · ${diffDots(diffOf(c))}`
        : `ASESIDOKU · ${T("subtitle_case",{n:pad2(c.id)})} · ${diffDots(diffOf(c))}`;
      const txt = `${head}\n${bar}  ${fmtTime(s.ms)}\n`
        + (s.hints ? T("shareHints",{n:s.hints}) : T("shareClean")) + "\n"
        + location.origin + location.pathname + (isDaily ? "#diario" : "#caso-" + c.id);
      navigator.clipboard.writeText(txt).then(() => flash(T("copied"), "ok"),
                                              () => flash(T("copyFail"), "bad"));
    };
    const nx = document.getElementById("b-next2");
    if(nx) nx.onclick = () => go({name:"case", id:id+1});
    const nt = document.getElementById("b-next3");
    if(nt) nt.onclick = () => tutorN + 1 < TUTOR.length
      ? go({name:"case", id:TUTOR[tutorN+1].id})
      : go({name: DAILY[todayISO()] ? "daily" : "index"});
    if(won) try { v.scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e){}
  }

  /* ───────────────────────────── teclado ─────────────────────────── */
  function onKey(e){
    if(document.getElementById("sheet").classList.contains("open")) return;
    if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    const g = document.getElementById("grid"); if(!g) return;
    const k = e.key;
    if(k >= "0" && k <= "9"){
      const i = +k, n = i === 0 ? VIC : (c.suspects[i-1] ? c.suspects[i-1].name : null);
      if(n){ sel = (sel === n) ? null : n; refresh(); e.preventDefault(); }
      return;
    }
    const tools = {q:"place", w:"note", e:"x", r:"hyp"};
    if(tools[k.toLowerCase()]){
      tool = tools[k.toLowerCase()];
      document.querySelectorAll(".seg [data-tool]").forEach(x =>
        x.setAttribute("aria-pressed", x.dataset.tool === tool ? "true" : "false"));
      refresh(); e.preventDefault(); return;
    }
    if(k.toLowerCase() === "z"){ if(undo(id)){ Audio_.lift(); refresh(); } e.preventDefault(); return; }
    if(k.toLowerCase() === "y"){ if(redo(id)){ Audio_.mark(); refresh(); } e.preventDefault(); return; }
    if(k.toLowerCase() === "h"){ askHint(); e.preventDefault(); return; }
    if(k.toLowerCase() === "a"){ toggleAuto(); e.preventDefault(); return; }
    if(k === "?" && focusCell){ openWhyNot(focusCell[0], focusCell[1]); e.preventDefault(); return; }
    if(k === "Escape"){ sel = null; refresh(); return; }
    const cur = document.activeElement && document.activeElement.classList &&
                document.activeElement.classList.contains("cell") ? document.activeElement : null;
    const arrows = {ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1]};
    if(arrows[k]){
      e.preventDefault();
      let r = cur ? +cur.dataset.r : 0, q = cur ? +cur.dataset.q : 0;
      if(cur){ r = Math.max(0, Math.min(c.R-1, r + arrows[k][0]));
               q = Math.max(0, Math.min(c.C-1, q + arrows[k][1])); }
      const t = g.querySelector(`.cell[data-r="${r}"][data-q="${q}"]`);
      if(t){ g.querySelectorAll(".cell").forEach(x => x.tabIndex = -1); t.tabIndex = 0; t.focus(); }
      return;
    }
    if(cur && (k === "Enter" || k === " ")){ e.preventDefault(); cur.click(); }
    if(cur && (k === "Home" || k === "End")){
      e.preventDefault();
      const r = +cur.dataset.r, q = k === "Home" ? 0 : c.C - 1;
      const t = g.querySelector(`.cell[data-r="${r}"][data-q="${q}"]`);
      if(t){ g.querySelectorAll(".cell").forEach(x => x.tabIndex = -1); t.tabIndex = 0; t.focus(); }
    }
  }
  document.removeEventListener("keydown", window.__mk || (()=>{}));
  window.__mk = onKey;
  document.addEventListener("keydown", onKey);
  window.addEventListener("beforeunload", () => {
    if(!s.solved){ s.ms = (s.ms || 0) + (Date.now() - tickStart); save(); }
  }, {once:true});
}

/* resalta en el plano lo que menciona una pista */
function lightClue(c, i, on){
  const lc = loc(c);
  document.querySelectorAll(".rlabel").forEach(el => {
    el.classList.toggle("lit", on && clueOf(c, c.clues[i]).indexOf(lc.rooms[+el.dataset.room]) >= 0);
  });
  document.querySelectorAll(".cell").forEach(el => el.classList.remove("objlit"));
  if(!on) return;
  const t = clueOf(c, c.clues[i]);
  c.furniture.forEach(f => {
    if(t.indexOf(lc.label(f)) >= 0){
      const el = document.querySelector(`.cell[data-r="${f.cell[0]}"][data-q="${f.cell[1]}"]`);
      if(el) el.classList.add("objlit");
    }
  });
  document.querySelectorAll(".sus").forEach(b => {
    const n = b.dataset.n;
    b.style.transform = (n && n !== VIC && t.indexOf(n) >= 0) ? "translateX(4px)" : "";
  });
}

/* — reproducción paso a paso — */
function openReplay(c, lc){
  let i = 0;
  const draw = () => {
    const h = c.hints[i];
    const lv = I18.hintLevels(h, lc.X, ref(h.cell));
    const pw = 100 / c.C, ph = 100 / c.R;
    const placed = c.hints.slice(0, i+1);
    const mini = c.rects.map((R,j) => { const [r0,c0,r1,c1] = R;
      return `<i class="${pat(j)}" style="left:${c0*pw}%;top:${r0*ph}%;width:${(c1-c0+1)*pw}%;height:${(r1-r0+1)*ph}%"></i>`;
    }).join("") + placed.map((s2,j) => {
      const isLast = j === i;
      return `<span class="rp${isLast?" now":""}" style="left:${s2.cell[1]*pw}%;top:${s2.cell[0]*ph}%;width:${pw}%;height:${ph}%">${esc(s2.who.slice(0,2))}</span>`;
    }).join("");
    document.getElementById("sheet-body").innerHTML = `
      <p>${T("replayNote")}</p>
      <div class="replay">
        <div class="rpplan" style="aspect-ratio:${c.C}/${c.R}">${mini}</div>
        <div>
          <p class="step ui">${T("step",{n:i+1, t:c.hints.length})}</p>
          <span class="tech ui">${esc(lv.techName)}</span>
          <p class="lvl">${esc(lv.l3)}</p>
          <p class="lvl"><b>${esc(lv.l4)}</b></p>
          ${h.clues.length ? h.clues.map(k =>
            `<div class="quote">${pad2(k+1)} · ${esc(clueOf(c, c.clues[k]))}</div>`).join("") : ""}
        </div>
      </div>
      <div class="row" style="margin-top:16px">
        <button class="btn" id="rp-prev" ${i===0?"disabled":""}>← ${T("replayPrev")}</button>
        <button class="btn" id="rp-next" ${i===c.hints.length-1?"disabled":""}>${T("replayNext")} →</button>
      </div>`;
    const p = document.getElementById("rp-prev"), n = document.getElementById("rp-next");
    if(p) p.onclick = () => { if(i>0){ i--; draw(); } };
    if(n) n.onclick = () => { if(i<c.hints.length-1){ i++; draw(); } };
  };
  openSheet(T("replayTitle"), "");
  draw();
}

/* ══════════════════════════════════════════════════ MARCAS Y DUELOS ═════
   La clasificación compartida necesita servidor y cuentas. Hasta que exista,
   aquí hay dos cosas que sí funcionan sin nada detrás y son honestas:

   · tus marcas por día de la semana, que es contra quien de verdad compites
     al principio, y que además hace visible si estás mejorando;
   · el duelo por código: tu marca del día cabe en una línea de texto que le
     pasas a quien quieras por donde quieras. Quien la recibe la pega y ve
     quién ganó. Sin registro, sin servidor y sin destripar nada.

   `Board.push` es el único punto por donde saldrían los datos a un servidor
   el día que lo haya: hoy no hace nada. */
const Board = {
  online: false,
  push(){ /* aquí irá el envío al servidor cuando exista */ },
};

/* la marca cabe en una línea: fecha, tiempo en segundos, pistas y fallos */
function markOf(iso, k){
  const c = dayCase(iso, k || track);
  if(!c) return null;
  const st = store.cases[c.id];
  if(!st || !st.solved) return null;
  return {d: iso, k: k || track, t: Math.round((st.ms||0)/1000),
          h: st.hints||0, f: st.fails||0};
}
const markToCode = m => "ASD2." + m.d.replace(/-/g,"") + m.k + "." + m.t + "." + m.h + "." + m.f;
function codeToMark(txt){
  const m = String(txt||"").trim().match(/ASD2\.(\d{8})([fx])\.(\d+)\.(\d+)\.(\d+)/);
  if(!m) return null;
  return {d: m[1].slice(0,4)+"-"+m[1].slice(4,6)+"-"+m[1].slice(6,8),
          k: m[2], t:+m[3], h:+m[4], f:+m[5]};
}

/* medias y mejores por día de la semana */
function myRecords(){
  const out = [];
  for(let w = 0; w < 7; w++){
    const list = DAILY_DATES.filter(d => DAILY[d].wd === w)
      .map(d => markOf(d, track)).filter(Boolean);
    if(!list.length){ out.push(null); continue; }
    const ts = list.map(x => x.t);
    out.push({n:list.length, best:Math.min(...ts),
              avg:Math.round(ts.reduce((a,b)=>a+b,0)/ts.length),
              clean:list.filter(x => !x.h).length});
  }
  return out;
}

function openBoard(){
  const rec = myRecords();
  const any = rec.some(Boolean);
  const max = Math.max(1, ...rec.filter(Boolean).map(r => r.avg));
  const rows = rec.map((r,i) => r
    ? `<div class="b"><span class="lab">${T(DAYNAMES[i])}</span>
         <span class="bar" style="width:${Math.max(6, r.avg/max*100)}%">${fmtTime(r.avg*1000)}</span>
         <span class="best mono">${T("boardBest")} ${fmtTime(r.best*1000)} · ${T("boardN",{n:r.n})}</span></div>`
    : `<div class="b"><span class="lab">${T(DAYNAMES[i])}</span>
         <span class="bar zero" style="width:6%">—</span></div>`).join("");
  openSheet(T("board"), `
    <h4 class="ui">${T("boardMine")}</h4>
    ${any ? `<div class="bars wide">${rows}</div>` : `<p>${T("boardNone")}</p>`}
    <h4 class="ui">${T("markTitle")}</h4>
    <p>${T("markNote")}</p>
    <div class="row">
      <button class="btn" id="d-copy">${T("duelCopy")}</button>
      <button class="btn" id="d-paste">${T("duelPaste")}</button>
    </div>
    <p class="duelout" id="duelout"></p>
    <h4 class="ui">${T("boardOnlineTitle")}</h4>
    <p class="muted">${T("boardOnlineSoon")}</p>`);

  document.getElementById("d-copy").onclick = () => {
    const mine = markOf(todayISO(), track);
    const out = document.getElementById("duelout");
    if(!mine){ out.textContent = T("duelNoDaily"); return; }
    const code = markToCode(mine);
    navigator.clipboard.writeText(code).then(() => { out.textContent = code; },
                                             () => uiPrompt(T("duelCopy"), code));
  };
  document.getElementById("d-paste").onclick = async () => {
    const out = document.getElementById("duelout");
    const other = codeToMark(await uiPrompt(T("duelAsk"), ""));
    if(!other){ out.textContent = T("duelBad"); return; }
    const mine = markOf(other.d, other.k);
    if(!mine){ out.textContent = DAILY[other.d] ? T("duelNoScore") : T("duelOther",{d:other.d}); return; }
    const a = fmtTime(mine.t*1000), b = fmtTime(other.t*1000);
    out.textContent = (mine.t < other.t ? T("duelYouWin",{a,b})
                     : mine.t > other.t ? T("duelYouLose",{a,b})
                     : T("markTie",{a}))
      + " " + T("duelHintNote",{a:mine.h, b:other.h});
  };
}

/* — reglas y glosario — */
/* El texto de las reglas va aquí en crudo, en los dos idiomas, y no en la
   tabla de cadenas: es prosa larga con marcado, y partirla en claves sueltas
   la volvería ilegible para quien tenga que revisarla. */
const RULES_ES = `
  <h4 class="ui">Las seis reglas</h4>
  <ol>
    <li>En cada fila y en cada columna hay <b>como mucho una persona</b>. La víctima cuenta como persona: <b>nadie comparte fila ni columna con el cuerpo</b>.</li>
    <li><b>Dónde está el cuerpo no se dice.</b> Coloca a los sospechosos y quedarán libres una fila y una columna: el cuerpo está en su cruce. En los casos <b>Sin ley</b> el tablero tiene una columna de más, así que el cruce deja varias casillas posibles y hace falta deducir cuál.</li>
    <li>Las casillas con un <b>objeto fijo</b> están ocupadas: ahí no cabe nadie.</li>
    <li>Algunos objetos son <b>practicables</b> —van con recuadro punteado— y sí admiten a alguien encima.</li>
    <li>El plano está partido en <b>habitaciones</b> por paredes gruesas. <b>Las paredes no se atraviesan:</b> «al lado de» significa casilla contigua en horizontal o vertical <b>y en la misma habitación</b>.</li>
    <li>El asesino es quien se quedó <b>a solas con la víctima</b>: en la habitación del cuerpo hay exactamente un sospechoso.</li>
  </ol>
  <p style="border-left:2px solid var(--line); padding-left:14px; color:var(--muted); font-size:15px">
    Todas las pistas son ciertas. Cada caso tiene una única reconstrucción posible y se deduce
    sin adivinar: si te toca tantear, se te ha escapado algo.</p>

  <h4 class="ui">Glosario (lee esto si una pista te parece ambigua)</h4>
  <dl class="gloss">
    <dt>Persona</dt><dd>Cualquier ficha del tablero, <b>la víctima incluida</b>. Los recuentos («había exactamente dos personas») la cuentan.</dd>
    <dt>Sospechoso</dt><dd>Una persona que no es la víctima.</dd>
    <dt>Al lado de</dt><dd>Casilla contigua en horizontal o vertical <b>y dentro de la misma habitación</b>. Las diagonales no cuentan. Dos casillas pegadas a uno y otro lado de un tabique <b>no</b> están al lado.</dd>
    <dt>A solas con</dt><dd>En esa habitación hay <b>exactamente dos</b> personas: esas dos. Ni una más.</dd>
    <dt>Al norte de</dt><dd>En una fila con número menor, en <b>cualquier</b> columna. Norte es arriba, oeste es izquierda.</dd>
    <dt>Exactamente 2 filas al sur</dt><dd>Misma columna, dos filas más abajo. <b>La geometría no la cortan las paredes</b>: solo la vecindad.</dd>
    <dt>Al noroeste de</dt><dd>Más al norte <b>y</b> más al oeste a la vez.</dd>
    <dt>La única persona que…</dt><dd>Nadie más cumple eso en todo el tablero.</dd>
    <dt>Al menos dos</dt><dd>Dos vale, tres también. Una no.</dd>
    <dt>Habitación vacía</dt><dd>Una habitación puede quedarse sin nadie. <b>No</b> hay ninguna regla que obligue a poner una persona por habitación.</dd>
  </dl>

  <h4 class="ui">Herramientas</h4>
  <ul>
    <li><b>Colocar</b> — elige una ficha y pulsa una casilla. Se resaltan las casillas donde encaja sin contradecir nada, pero <b>puedes ponerla donde quieras</b>: si choca con otra ficha, se coloca igual y se te avisa de con quién comparte fila o columna. Lo único que no admite a nadie encima es un objeto fijo.</li>
    <li><b>Candidato</b> — puntitos de color: «esta ficha <i>podría</i> estar aquí».</li>
    <li><b>Descartar</b> — aspas: «esta ficha <i>no</i> puede estar aquí». Además retira esa casilla de las legales.</li>
    <li><b>Color</b> — sombrea casillas para agrupar una hipótesis. No lo evalúa nadie: es tu cuaderno.</li>
    <li><b>Candidatos automáticos</b> — el motor cruza todas las pistas y anota por ti las casillas que aún sobreviven. No adivina: solo apunta lo que ya se deduce.</li>
    <li><b>¿Por qué aquí no?</b> — elige una ficha, pulsa una casilla y te dice qué lo impide, citando la pista concreta.</li>
    <li><b>Contrastar</b> — sella conclusiones <b>de tres en tres</b>. Si tres o más de las que has colocado son correctas, quedan selladas y ya no se mueven. Si son menos de tres, no se sella ninguna y no se te dice cuáles fallan: así no se puede resolver el caso a base de probar.</li>
    <li><b>Pedir una pista</b> — cuatro niveles: un empujón, qué pistas cruzar, cómo se llama la técnica y, solo al final, dónde va la ficha. Nunca te dice quién es el asesino.</li>
  </ul>

  <h4 class="ui">Un caso al día</h4>
  <p>Cada fecha tiene su caso, el mismo para todo el mundo, y la dificultad sube de lunes a domingo:
  el lunes se resuelve con un café, el domingo es el grande. La racha admite dos días de gracia al mes,
  porque perder cuatro meses de constancia por una noche mala no enseña nada.</p>

  <h4 class="ui">Teclado</h4>
  <ul>
    <li><span class="kbd">1</span>–<span class="kbd">7</span> elegir sospechoso · <span class="kbd">0</span> la víctima</li>
    <li><span class="kbd">Q</span> colocar · <span class="kbd">W</span> candidato · <span class="kbd">E</span> descartar · <span class="kbd">R</span> color</li>
    <li>Flechas para moverse por el plano · <span class="kbd">Enter</span> actuar · <span class="kbd">Esc</span> soltar la ficha</li>
    <li><span class="kbd">Z</span> deshacer · <span class="kbd">Y</span> rehacer · <span class="kbd">H</span> pista · <span class="kbd">?</span> por qué aquí no</li>
  </ul>`;

const RULES_EN = `
  <h4 class="ui">The six rules</h4>
  <ol>
    <li>Every row and every column holds <b>at most one person</b>. The victim counts as a person: <b>nobody shares a row or a column with the body</b>.</li>
    <li><b>You are never told where the body is.</b> Place the suspects and one row and one column will be left empty: the body lies at their crossing. In <b>No Rules</b> cases the board has one column too many, so the crossing leaves several squares open and you have to work out which.</li>
    <li>Squares holding a <b>fixed object</b> are occupied: nobody fits there.</li>
    <li>Some objects are <b>walkable</b> — drawn with a dotted outline — and do take someone on top.</li>
    <li>Thick walls cut the plan into <b>rooms</b>. <b>Walls are not crossed:</b> "next to" means an adjacent square, horizontally or vertically, <b>and in the same room</b>.</li>
    <li>The murderer is whoever was <b>alone with the victim</b>: the body's room holds exactly one suspect.</li>
  </ol>
  <p style="border-left:2px solid var(--line); padding-left:14px; color:var(--muted); font-size:15px">
    Every clue is true. Each case has exactly one possible reconstruction and it can be reasoned out
    without guessing: if you find yourself trying things, you have missed something.</p>

  <h4 class="ui">Glossary (read this when a clue looks ambiguous)</h4>
  <dl class="gloss">
    <dt>Person</dt><dd>Any token on the board, <b>the victim included</b>. Counts ("there were exactly two people") include her.</dd>
    <dt>Suspect</dt><dd>A person who is not the victim.</dd>
    <dt>Next to</dt><dd>An adjacent square, horizontally or vertically, <b>and inside the same room</b>. Diagonals do not count. Two squares either side of a partition are <b>not</b> next to each other.</dd>
    <dt>Alone with</dt><dd>That room holds <b>exactly two</b> people: those two. Not one more.</dd>
    <dt>North of</dt><dd>In a lower-numbered row, in <b>any</b> column. North is up, west is left.</dd>
    <dt>Exactly 2 rows south</dt><dd>Same column, two rows further down. <b>Geometry is not cut by walls</b> — only adjacency is.</dd>
    <dt>North-west of</dt><dd>Further north <b>and</b> further west at the same time.</dd>
    <dt>The only person who…</dt><dd>Nobody else on the whole board matches that.</dd>
    <dt>At least two</dt><dd>Two counts, three counts. One does not.</dd>
    <dt>Empty room</dt><dd>A room may hold nobody. There is <b>no</b> rule forcing one person per room.</dd>
  </dl>

  <h4 class="ui">Tools</h4>
  <ul>
    <li><b>Place</b> — pick a token and press a square. The squares where it fits without contradicting anything are highlighted, but <b>you can put it wherever you like</b>: if it clashes, it still goes down and you are told who it shares a row or column with. The only thing that takes nobody on top is a fixed object.</li>
    <li><b>Candidate</b> — coloured dots: "this token <i>could</i> be here".</li>
    <li><b>Rule out</b> — crosses: "this token <i>cannot</i> be here". It also drops that square from the legal ones.</li>
    <li><b>Colour</b> — shade squares to group a hypothesis. Nobody grades it: it is your notebook.</li>
    <li><b>Auto-candidates</b> — the engine crosses every clue and pencils in the squares that still survive. It never guesses: it only writes down what already follows.</li>
    <li><b>Why not here?</b> — pick a token, press a square and it tells you what rules it out, quoting the clue responsible.</li>
    <li><b>Check</b> — seals conclusions <b>three at a time</b>. If three or more of what you have placed is right, those get sealed and stop moving. If fewer than three are right, nothing is sealed and you are not told which ones fail — so the case cannot be brute-forced.</li>
    <li><b>Ask for a hint</b> — four levels: a nudge, which clues to cross, the name of the technique and, only at the end, where the token goes. It never names the murderer.</li>
  </ul>

  <h4 class="ui">One case a day</h4>
  <p>Every date has its case, the same one for everybody, and difficulty climbs from Monday to Sunday:
  Monday goes down with a coffee, Sunday is the big one. The streak allows two grace days a month,
  because losing four months of consistency to one bad night teaches nothing.</p>

  <h4 class="ui">Keyboard</h4>
  <ul>
    <li><span class="kbd">1</span>–<span class="kbd">7</span> pick a suspect · <span class="kbd">0</span> the victim</li>
    <li><span class="kbd">Q</span> place · <span class="kbd">W</span> candidate · <span class="kbd">E</span> rule out · <span class="kbd">R</span> colour</li>
    <li>Arrow keys move around the plan · <span class="kbd">Enter</span> act · <span class="kbd">Esc</span> drop the token</li>
    <li><span class="kbd">Z</span> undo · <span class="kbd">Y</span> redo · <span class="kbd">H</span> hint · <span class="kbd">?</span> why not here</li>
  </ul>`;

  const tot = all.reduce((a,c) => a + (store.cases[c.id].ms || 0), 0);
  const noHint = all.filter(c => !(store.cases[c.id].hints)).length;
  const clean = all.filter(c => !(store.cases[c.id].fails)).length;
  const byTier = TIERS.map(t => { const list = CASES.filter(c => c.tier === t.key);

  const maxT = Math.max(1, ...byTier.map(b => b.tot));
  const fails = [0,1,2,3].map(k => all.filter(c =>
    (k === 3 ? (store.cases[c.id].fails||0) >= 3 : (store.cases[c.id].fails||0) === k)).length);

  openSheet(T("yourFile"), `
    <div class="statgrid">
      <div class="stat"><div class="v ui">${done.length}</div><div class="k ui">${T("casesClosed")}</div></div>

  };
}

/* -- sudoku.js -- */
/* ═══════════════════════════════════════════════════════════════════════════
   SUDOKU · la segunda plataforma: el mismo trato, tablero clásico.

   Dos mil sudokus generados y verificados (solución única), seis niveles,
   quinientos gratis (uno de cada cuatro por nivel), sudoku del día que
   nunca lleva candado, y el MISMO Pro de 1,99 € abre los dos modos: aquí
   no hay una segunda compra, hay el doble de contenido en la misma.

   Este fichero vive aparte de app.js pero comparte su mundo: los scripts
   se cosen planos, así que store, save, isPro, T, flash, adDue, showAd,
   openSheet, openPro, Audio_, buzz y todayISO están al alcance. Lo único
   propio es el estado del tablero y sus vistas.
   ═══════════════════════════════════════════════════════════════════════ */
(function (root) {
'use strict';

/* los datos: cosidos dentro (fichero único y app) o pedidos aparte (web) */
let SUD = /*__SUD__*/null;
let LIST = null;
const BY = {};

const S_TIERS = [
  { key:'iniciacion',    n:'Iniciación',    en:'Beginnings' },
  { key:'investigacion', n:'Investigación', en:'Investigation' },
  { key:'experto',       n:'Experto',       en:'Expert' },
  { key:'maestro',       n:'Maestro',       en:'Master' },
  { key:'sinley',        n:'Sin ley',       en:'Lawless' },
  { key:'extremo',       n:'Extremo',       en:'Extreme' },
];

function initSud(d){ SUD = d; LIST = d.list; LIST.forEach(x => BY[x.id] = x); }
if (SUD) initSud(SUD);

function ready(cb){
  if (LIST) return cb();
  fetch('data/sudoku.json').then(r => r.json())
    .then(d => { initSud(d); cb(); })
    .catch(() => { flashTop(T('sudLoadFail')); });
}

/* ── estado guardado ──────────────────────────────────────────────────── */
function SS(){
  store.sud = store.sud || { cases:{}, days:{} };
  store.sud.cases = store.sud.cases || {};
  store.sud.days = store.sud.days || {};
  return store.sud;
}
function st(id){
  const s = SS();
  s.cases[id] = s.cases[id] || { e:{}, n:{}, ms:0, fails:0, solved:false };
  return s.cases[id];
}
function sudSolved(){ const s = SS(); let n = 0;
  for (const k in s.cases) if (s.cases[k].solved) n++; return n; }

/* el sudoku del día: cualquiera de los dos mil, y NUNCA con candado */
function sudDayId(iso){
  let h = 2166136261;
  const str = iso + '·sudoku';
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return (h % SUD.total) + 1;
}
function canPlaySud(x){
  return isPro() || x.f === 1 || x.id === sudDayId(todayISO());
}

const dots = d => '●'.repeat(d) + '○'.repeat(5 - d);
const fmt = ms => { const t = Math.floor(ms/1000);
  return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0'); };

/* ── contrarreloj: 1, 3 o 5 tableros seguidos, a reloj corrido ──────────
   Se sortea SOLO del fondo gratuito, como las carreras de casos: la misma
   carrera para quien paga y quien no. Se prefieren tableros sin resolver;
   si no quedan, se reutilizan resueltos limpiándolos primero. */
const RACE_NS = [1, 3, 5];
const RACE_BANDS = {
  suave:   ['iniciacion', 'investigacion'],
  dura:    ['experto', 'maestro'],
  extrema: ['sinley', 'extremo'],
};
function raceState(){ return SS().race; }
function raceStart(n, band, ids0, seed){
  /* con `ids0` la carrera no sortea: corre esos tableros (así los dos lados
     de un duelo juegan exactamente lo mismo); `seed` la marca como duelo */
  let ids;
  if (ids0){ ids = ids0.slice(); }
  else {
    const pool = LIST.filter(x => x.f === 1 && RACE_BANDS[band].indexOf(x.tier) >= 0);
    const sinHacer = pool.filter(x => !(SS().cases[x.id] && SS().cases[x.id].solved));
    const src = sinHacer.length >= n ? sinHacer : pool;
    ids = [];
    const bag = src.slice();
    while (ids.length < n && bag.length){
      ids.push(bag.splice(Math.floor(Math.random() * bag.length), 1)[0].id);
    }
  }
  ids.forEach(id => { delete SS().cases[id]; });   /* tableros en blanco */
  SS().race = { ids, i: 0, ms: 0, t0: Date.now(), n: ids.length, band, running: 1 };
  if (seed) SS().race.seed = seed;
  save();
  go({name:'sudcase', id: ids[0], r: 1});
}
function raceAbort(){
  const rc = raceState();
  if (rc){ rc.running = 0; save(); }
}
/* el reloj de la carrera sólo corre con su tablero delante, igual que en el
   modo asesinato: salir, cambiar de vista o mandar la app al fondo lo pausa */
function raceElapsedS(){
  const rc = raceState();
  if (!rc) return 0;
  return (rc.ms || 0) + (rc.running && !rc.paused ? Date.now() - rc.t0 : 0);
}
function racePauseS(){
  const rc = raceState();
  if (rc && rc.running && !rc.paused){ rc.ms = raceElapsedS(); rc.paused = 1; save(); }
}
function raceResumeS(){
  const rc = raceState();
  if (rc && rc.running && rc.paused){ rc.paused = 0; rc.t0 = Date.now(); save(); }
}
/* si la app murió sin despedirse, el rato perdido no se cobra */
if (SS().race && SS().race.running && !SS().race.paused){
  SS().race.paused = 1; save();
}

/* ═══ DUELOS Y LIGA DEL SUDOKU ════════════════════════════════════════════
   La misma dinámica que en el modo asesinato, con el mismo motor: standings,
   temporadas, groupAdd/groupPost y duelWinner/duelPost operan sobre objetos
   y sirven tal cual. Lo único propio de aquí son los códigos (prefijos SD·
   para que no se confundan con los del otro modo) y el sorteo, que siembra
   sobre el pool gratuito de sudokus para que a los dos rivales les salgan
   exactamente los mismos tableros. */
const S_BANDS = Object.keys(RACE_BANDS);              /* suave · dura · extrema */
const LIGA_N = 3, LIGA_BAND = 'dura';                 /* la carrera que puntúa */
const sduels  = () => (SS().duels  = SS().duels  || []);
const sgroups = () => (SS().groups = SS().groups || []);
const sduelBy  = seed => sduels().find(d => d.seed === seed);
const sgroupBy = code => sgroups().find(g => g.code === code);
function sduelKeep(d){ sduels().unshift(d); SS().duels = sduels().slice(0, 30); save(); return d; }
function sduelNew(n, band){
  return sduelKeep({seed: newCode(6), n, band, mode:'priv', host:1,
                    when: todayISO(), mine:null, rival:null});
}
function sduelAdopt(p){
  return sduelBy(p.seed) || sduelKeep({seed:p.seed, n:p.n, band:p.band,
    mode:'priv', host:0, when: todayISO(), mine:null, rival:null});
}
function sduelDraw(seed, n, band){
  const pool = LIST.filter(x => x.f === 1 && RACE_BANDS[band].indexOf(x.tier) >= 0);
  const rnd = seedRnd('sd:' + seed + ':' + band + ':' + n);
  const out = [];
  let guard = 0;
  while (out.length < Math.min(n, pool.length) && ++guard < 600){
    const id = pool[Math.floor(rnd() * pool.length)].id;
    if (out.indexOf(id) < 0) out.push(id);
  }
  return out;
}
const sduelCode = d => ['SDD1', d.seed, d.n, S_BANDS.indexOf(d.band)].join('.');
function sduelParse(txt){
  const m = String(txt || '').trim().toUpperCase()
    .match(/SDD1[.\-]([A-Z0-9]{6})[.\-](\d)[.\-]([0-2])/);
  if (!m || RACE_NS.indexOf(+m[2]) < 0) return null;
  return {seed: m[1], n: +m[2], band: S_BANDS[+m[3]]};
}
const sduelLabel = d => T('duelShape', {n: d.n, b: T('sudBand_' + d.band)});
const sduelPart = d => ['SDR1', d.seed, me().id, Math.round(d.mine.ms / 1000), 0,
  meName().replace(/[^\p{L}\p{N} ]/gu, '').slice(0, 14) || '?'].join('.');
function sduelPartParse(txt){
  const m = String(txt || '').trim().match(
    /SDR1\.([A-Z0-9]{6})\.([A-Z0-9]+)\.(\d+)\.(\d+)\.(.+)$/u);
  if (!m) return null;
  return {seed: m[1], pid: m[2], ms: +m[3] * 1000, hints: +m[4], name: m[5].trim()};
}
function sgroupCreate(name){
  const g = {code: newCode(6), name: name || T('groupUnnamed'), kind: 'sud',
             start: null, members: {}, results: {}, history: []};
  g.members[me().id] = {name: meName(), emoji: me().emoji};
  sgroups().push(g); save();
  return g;
}
function sgroupJoin(code){
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!code || sgroupBy(code)) return null;
  const g = {code, name: T('groupJoined', {c: code}), kind: 'sud',
             start: null, members: {}, results: {}, history: []};
  g.members[me().id] = {name: meName(), emoji: me().emoji};
  sgroups().push(g); save();
  return g;
}
const spartOf = (g, iso, ms) =>
  ['SDG1', g.code, me().id, iso.replace(/-/g, ''), Math.round(ms / 1000), 0,
   meName().replace(/[^\p{L}\p{N} ]/gu, '').slice(0, 14) || '?'].join('.');
function spartParse(txt){
  const m = String(txt || '').trim().match(
    /SDG1\.([A-Z0-9]+)\.([A-Z0-9]+)\.(\d{8})\.(\d+)\.(\d+)\.(.+)$/u);
  if (!m) return null;
  return {code: m[1], pid: m[2],
          iso: m[3].slice(0,4) + '-' + m[3].slice(4,6) + '-' + m[3].slice(6,8),
          ms: +m[4] * 1000, hints: +m[5], name: m[6].trim()};
}
async function pasteSPart(prefer, outEl){
  const p = spartParse(await uiPrompt(T('groupAskPart'), ''));
  const say = m => { if (outEl) outEl.textContent = m; else uiAlert(m); };
  if (!p){ say(T('groupBadPart')); return; }
  let g = sgroupBy(p.code);
  if (!g && prefer) g = sgroupBy(prefer);
  if (!g){
    if (!await uiConfirm(T('groupJoinFromPart', {c: p.code}))) return;
    g = sgroupJoin(p.code);
    if (!g){ say(T('groupBadCode')); return; }
  }
  const ok = groupPost(g, p.iso, p.pid, p.name, p.ms, p.hints);
  say(ok === true ? T('groupPartOk', {w: p.name, t: fmt(p.ms), d: p.iso})
    : ok === 'lleno' ? T('groupFullPart', {w: p.name, n: GROUP_MAX})
    : T('groupPartDup', {w: p.name, d: p.iso}));
  drawSgroups();
  if (outEl) openSgroup(g.code);
}
async function sudSwapOK(){
  const rc = raceState();
  return !(rc && rc.running) || await uiConfirm(T('raceSwapAsk'));
}
function raceWon(x){
  const rc = raceState();
  if (!rc || !rc.running || rc.ids[rc.i] !== x.id) return false;
  rc.i++;
  if (rc.i < rc.ids.length){
    save();
    flashTop(T('sudRaceNext', {i: rc.i + 1, n: rc.ids.length}));
    setTimeout(() => go({name:'sudcase', id: rc.ids[rc.i], r: 1}), 1200);
    return true;
  }
  rc.total = raceElapsedS();
  rc.running = 0;
  const s = SS();
  /* un duelo no acaba en la hoja normal: acaba en la del duelo, con los dos
     tiempos al lado — la misma regla que en el modo asesinato */
  if (rc.seed){
    const d = sduelBy(rc.seed);
    if (d){
      if (!d.mine){ d.mine = {ms: rc.total, hints: 0}; }
      save();
      go({name:'sud', tab:'contrarreloj'});
      openSduel(rc.seed);
      if (typeof checkAchv === 'function') setTimeout(checkAchv, 1400);
      if (adDue('race')) setTimeout(() => showAd(null, false, 'adWhyRace'), 1100);
      return true;
    }
  }
  const key = rc.n + '·' + rc.band;
  s.best = s.best || {};
  const record = !s.best[key] || rc.total < s.best[key];
  if (record) s.best[key] = rc.total;
  s.raceLog = s.raceLog || [];
  s.raceLog.push({ n: rc.n, band: rc.band, ms: rc.total, t: Date.now() });
  save();
  /* sólo la carrera con la forma de la liga puntúa, y sólo una al día */
  const aptos = (rc.n === LIGA_N && rc.band === LIGA_BAND) ? sgroups() : [];
  openSheet(T('sudRaceDone'), `
    <p class="big">${T('sudRaceTotal', {t: fmt(rc.total)})}</p>
    <p class="${record ? '' : 'muted'}">${record ? T('sudRaceRecord') : T('sudRaceBest', {t: fmt(s.best[key])})}</p>
    ${aptos.length ? `<div class="postgroups">
      <p class="ui">${T('racePostTo')}</p>
      ${aptos.map(g => {
        const ya = (g.results[todayISO()] || {})[me().id];
        return `<button class="btn ${ya ? 'ghost' : ''}" data-spost="${g.code}" ${ya ? 'disabled' : ''}>
          ${esc(g.name)}${ya ? ' ✔' : ''}</button>`; }).join('')}
      <p class="duelout" id="sr-out"></p>
    </div>` : ''}
    <div class="row">
      <button class="btn primary" id="sr-again">${T('sudRaceAgain')}</button>
      <button class="btn" id="sr-home">${T('sudBack')}</button>
    </div>`);
  document.querySelectorAll('[data-spost]').forEach(b => b.onclick = () => {
    const g = sgroupBy(b.dataset.spost);
    if (!g) return;
    const ok = groupPost(g, todayISO(), me().id, meName(), rc.total, 0);
    b.disabled = true; b.textContent = g.name + ' ✔';
    const out = document.getElementById('sr-out');
    if (out) out.textContent = ok === true
      ? T('racePosted', {g: g.name}) + '  ' + spartOf(g, todayISO(), rc.total)
      : T('groupPartDup', {w: meName(), d: todayISO()});
    Audio_.seal();
  });
  document.getElementById('sr-again').onclick = () => { closeSheet(); raceStart(rc.n, rc.band); };
  document.getElementById('sr-home').onclick = () => { closeSheet(); go({name:'sud', tab:'contrarreloj'}); };
  if (typeof checkAchv === 'function') setTimeout(checkAchv, 1400);
  if (adDue('race')) setTimeout(() => showAd(null, false, 'adWhyRace'), 1100);
  return true;
}

/* ── portada del modo sudoku ──────────────────────────────────────────── */
const PAGE = 60;
let shown = {};
let sTierSel = null;    /* pestaña de nivel elegida */
let sudSec = 'duelo';   /* apartado de la contrarreloj a la vista */
let sudTab = 'diario';  /* pestaña principal del modo: diario · expediente · contrarreloj · aprender */
let sDuelN = 3, sDuelBand = 'dura';   /* la forma del duelo que se propone */
const SUD_TABS = ['diario', 'expediente', 'contrarreloj', 'aprender'];

function sudCard(x){
  const s = SS().cases[x.id];
  const done = s && s.solved, started = s && !s.solved && Object.keys(s.e).length;
  const lock = !canPlaySud(x);
  return `<button class="case-card sudcard cc${done ? ' done' : ''}${lock ? ' locked' : ''}" data-sid="${x.id}"
    aria-label="${T('sudN', {n: String(x.id).padStart(4,'0')})}${lock ? ' · Pro' : ''}">
    <span class="ccnum mono">${String(x.id).padStart(4,'0')}</span>
    <span class="ccdots mono" aria-hidden="true">${dots(x.d)}</span>
    ${done ? `<span class="cctick" aria-hidden="true">✓</span>`
           : lock ? `<span class="padlock ui" aria-hidden="true">${T('proBadge')}</span>`
           : started ? '<span class="started"></span>' : ''}
  </button>`;
}

/* miniatura: la silueta de pistas del puzle, sin regalar cifras */
function thumb9(x){
  let cells = '';
  for (let k = 0; k < 81; k++)
    if (x.p[k] !== '0') cells += `<i style="grid-area:${Math.floor(k/9)+1}/${k%9+1}"></i>`;
  return `<span class="mini9">${cells}</span>`;
}

     contrarreloj y aprender — la plataforma entera con una sola gramática */

  if (typeof PENDING !== 'undefined' && PENDING &&
      (PENDING.kind === 'sduelo' || PENDING.kind === 'sgrupo')) sudTab = 'contrarreloj';
  const iso = todayISO();
  const day = BY[sudDayId(iso)];
  const dayDone = SS().days[iso];
  const n = sudSolved(), t = SUD.total;
  document.getElementById('subtitle').textContent =
    sudTab === 'contrarreloj' ? T('raceTab') : sudTab === 'expediente' ? T('fileTab')
    : sudTab === 'aprender' ? T('tutorTab') : T('subtitle_sud');
  let h = `<div class="tabs ui" role="tablist">
    <button role="tab" data-sgo="diario" aria-selected="${sudTab === 'diario'}">${T('dailyTab')}</button>

    <button role="tab" data-sgo="contrarreloj" aria-selected="${sudTab === 'contrarreloj'}">${T('raceTab')}</button>
    <button role="tab" data-sgo="aprender" aria-selected="${sudTab === 'aprender'}">${T('tutorTab')}</button>
  </div>`;

  if (sudTab === 'diario'){
  h += `<section class="hero">
    <div>
      <p class="tag ui">${T('sudDaily')}</p>
      <h2 class="ui">${T('sudN', {n: String(day.id).padStart(4,'0')})}</h2>
      <p class="dmeta ui"><span class="diff mono">${dots(day.d)}</span>
        <span>${esc(tierName(day.tier))}</span></p>
      <p>${T('sudDailyLead')}</p>
      <div class="row">
        <button class="btn primary" id="sd-play">${dayDone ? T('playAgain') : T('playToday')}</button>
        <button class="btn" id="sd-how">${T('sudHow')}</button>
      </div>
      <div class="legendrow" style="margin-top:16px">

  if (sudTab === 'contrarreloj'){

     en el modo asesinato */

  const best = SS().best || {};
  const franja = rc && rc.running ? `<div class="racebar resume ui" id="srace-on">
    <span class="rstep mono">${rc.seed ? T('duelTitle') + ' · ' : ''}${

    <button class="btn primary" id="sr-cont">${T('sudRaceCont')}</button>

        ${Object.keys(best).length ? `<p class="muted bestrow">${Object.keys(best).sort().map(k => {

  if (!sTierSel || !S_TIERS.some(t => t.key === sTierSel)){
    const prox = LIST.find(x => canPlaySud(x) && !(SS().cases[x.id] && SS().cases[x.id].solved));

      if (!g){ uiAlert(T('groupBadCode')); return; }
      renderSud(); openSgroup(g.code);

    document.getElementById('sg-paste').onclick = () => pasteSPart();

  drawSgroups();

function tierName(key){
  const tr = S_TIERS.find(t => t.key === key);
  return tr ? (LANG === 'en' ? tr.en : tr.n) : key;
}

/* ── duelos: interfaz (los mismos huesos que en el modo asesinato) ──────── */
function drawSduels(){
  const box = document.getElementById('sd-list');
  if (!box) return;
  const ds = sduels();
  if (!ds.length){ box.innerHTML = `<p class="muted">${T('duelNone')}</p>`; return; }
  box.innerHTML = ds.slice(0, 8).map(d => {
    const w = duelWinner(d);
    const estado = w === 'yo' ? `<span class="dwin">${T('duelYouWon')}</span>`
      : w === 'rival' ? `<span class="dlose">${T('duelTheyWon', {w: d.rival.name})}</span>`
      : w === 'empate' ? `<span class="dtie">${T('duelTie')}</span>`
      : d.mine ? `<span class="dwait">${T('duelWaitingRival')}</span>`
      : `<span class="dwait">${T('duelNotRun')}</span>`;
    return `<button class="dcard" data-sd="${d.seed}">
      <span class="gtop"><b class="ui">${sduelLabel(d)}</b>
        <span class="gcode mono">${d.seed}</span></span>
      <span class="gmid ui">${T('duelModePriv')} · ${d.when}</span>
      <span class="dstate ui">${estado}</span>
      <span class="dtimes mono">${d.mine ? fmt(d.mine.ms) : '—:—'}
        <i>vs</i> ${d.rival && d.rival.ms != null ? fmt(d.rival.ms) : '—:—'}</span>
    </button>`;
  }).join('');
  box.querySelectorAll('[data-sd]').forEach(b => b.onclick = () => openSduel(b.dataset.sd));
}

function openSduel(seed){
  const d = sduelBy(seed);
  if (!d) return;
  const w = duelWinner(d);
  const url = shareURL('#sduelo-' + d.seed + '-' + d.n + '-' + S_BANDS.indexOf(d.band));
  const invitacion = url || sduelCode(d);
  const marcador = () => {
    if (!d.mine && !d.rival) return `<p class="muted">${T('duelRunFirst')}</p>`;
    const yo = d.mine
      ? `<div class="dside${w === 'yo' ? ' win' : ''}">
          <span class="dwho ui">${esc(meName())}</span>
          <span class="dt mono">${fmt(d.mine.ms)}</span></div>`
      : `<div class="dside pend">
          <span class="dwho ui">${esc(meName())}</span>
          <span class="dt mono">—:—</span>
          <span class="dh">${T('duelNotRun')}</span></div>`;
    const otro = d.rival && d.rival.ms != null
      ? `<div class="dside${w === 'rival' ? ' win' : ''}">
          <span class="dwho ui">${esc(d.rival.name)}</span>
          <span class="dt mono">${fmt(d.rival.ms)}</span></div>`
      : `<div class="dside pend"><span class="dwho ui">${
          d.rival ? esc(d.rival.name) : T('duelRivalUnknown')}</span>
          <span class="dt mono">—:—</span>
          <span class="dh">${T('duelWaitingRival')}</span></div>`;
    return `<div class="duelboard">${yo}<span class="dvs ui">vs</span>${otro}</div>
      ${w ? `<p class="big">${w === 'yo' ? T('duelYouWon')
             : w === 'rival' ? T('duelTheyWon', {w: d.rival.name}) : T('duelTie')}</p>` : ''}`;
  };

  openSheet(T('duelSheet', {n: d.n}) + ' · ' + d.seed, `
    <p class="big">${sduelLabel(d)} · Sudoku</p>
    <p>${T('duelPrivHow')}</p>
    ${marcador()}
    <div class="row" style="margin-top:16px">
      ${d.mine ? '' : `<button class="btn primary" id="sdu-run">${T('duelRun')}</button>`}
      <button class="btn${d.mine ? ' primary' : ' ghost'}" id="sdu-share">${
        url ? T('duelShareLink') : T('duelShareCode')}</button>
      ${d.mine && !(d.rival && d.rival.ms != null)
        ? `<button class="btn ghost" id="sdu-part">${T('duelCopyPart')}</button>
           <button class="btn ghost" id="sdu-paste">${T('duelPastePart')}</button>` : ''}
    </div>
    <p class="duelout" id="sdu-out"></p>
    <p class="muted">${T('duelFairNote')}</p>
    <p style="margin-top:18px"><button class="btn ghost" id="sdu-drop">${T('duelDrop')}</button></p>`);

  const out = () => document.getElementById('sdu-out');
  const run = document.getElementById('sdu-run');
  if (run) run.onclick = () => {
    if (!sudSwapOK()) return;
    closeSheet();
    raceStart(d.n, d.band, sduelDraw(d.seed, d.n, d.band), d.seed);
  };
  document.getElementById('sdu-share').onclick = () =>
    shareOut(T('duelInviteText', {s: sduelLabel(d) + ' · Sudoku', c: invitacion}),
             T('duelShareCode'), out());
  const part = document.getElementById('sdu-part');
  if (part) part.onclick = () => {
    const txt = sduelPart(d);
    navigator.clipboard.writeText(txt).then(() => { out().textContent = txt; },
                                            () => uiPrompt(T('duelCopyPart'), txt));
  };
  const pega = document.getElementById('sdu-paste');
  if (pega) pega.onclick = async () => {
    const p = sduelPartParse(await uiPrompt(T('duelAskPart'), ''));
    if (!p){ out().textContent = T('duelBadPart'); return; }
    if (p.seed !== d.seed){ out().textContent = T('duelOtherDuel'); return; }
    if (!duelPost(d, p.pid, p.name, p.ms, p.hints)){
      out().textContent = T('duelPartDup'); return;
    }
    Audio_.seal();
    drawSduels(); openSduel(d.seed);
  };
  document.getElementById('sdu-drop').onclick = async () => {
    if (!await uiConfirm(T('duelDropAsk'))) return;
    SS().duels = sduels().filter(x => x.seed !== d.seed); save();
    closeSheet(); renderSud();
  };
}

    ${seasonOn(g)
      ? `<p class="big">${T('groupSeasonRange', {a: g.start, b: seasonEnd(g), n: seasonLeft(g)})}</p>`

    <p>${T('sudGroupHow')}</p>

      n: groupSize(g), libres: Math.max(0, GROUP_MAX - groupSize(g))})}</p>
    <div class="tw"><table class="standings">
      <thead><tr><th>#</th><th>${T('groupPlayer')}</th><th>${T('groupPts')}</th>
        <th>${T('groupDays')}</th><th>${T('groupBest')}</th></tr></thead>
      <tbody>${t.map(fila).join('')}</tbody></table></div>
    ${jugados ? '' : `<p class="muted">${T('groupNobodyYet')}</p>`}
    <h4 class="ui">${T('groupToday')}</h4>
    <p class="muted">${T('groupTodayNote')}</p>
    <div class="row">
      <button class="btn" id="sgp-copy">${T('groupCopyPart')}</button>
      <button class="btn ghost" id="sgp-paste">${T('groupPaste')}</button>
      <button class="btn ghost" id="sgp-invite">${T('groupInvite')}</button>
    </div>
    <p class="duelout" id="sgp-out"></p>
    ${hist ? `<h4 class="ui">${T('groupPast')}</h4><ul>${hist}</ul>` : ''}
    <p style="margin-top:22px"><button class="btn ghost" id="sgp-leave">${T('groupLeave')}</button></p>`);

  document.getElementById('sgp-copy').onclick = () => {
    const r = (g.results[todayISO()] || {})[me().id];
    if (!r){ out().textContent = T('groupNoRaceToday'); return; }
    const code2 = spartOf(g, todayISO(), r.ms);
    navigator.clipboard.writeText(code2).then(() => { out().textContent = code2; },
                                              () => uiPrompt(T('groupCopyPart'), code2));

  document.getElementById('sgp-paste').onclick = () => pasteSPart(g.code, out());
  document.getElementById('sgp-invite').onclick = () => {
    if (groupSize(g) >= GROUP_MAX){ out().textContent = T('groupFull', {n: GROUP_MAX}); return; }

    if (!await uiConfirm(T('groupLeaveAsk'))) return;
    SS().groups = sgroups().filter(x => x.code !== g.code); save();
    closeSheet(); renderSud();

const UNDO = [];

               raceState().ids[raceState().i] === x.id) ? raceState() : null;
  app.innerHTML = `
  <div class="topbar">

  </div>
  <section class="sudwrap">

      <span class="rstep mono">${T('sudRaceOn', {i: rc0.i + 1, n: rc0.ids.length})}</span>
      <span class="grow" style="flex:1"></span>
